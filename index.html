/* ---------- Auto-calculate pieces from raw-material weight (bar / pipe / plate) ---------- */
const CALC_MATS = {ms:{n:'Mild steel / EN series',d:7.85}, ss:{n:'Stainless steel',d:8.0}, al:{n:'Aluminium',d:2.70}, br:{n:'Brass',d:8.5}, cu:{n:'Copper',d:8.96}, ci:{n:'Cast iron',d:7.2}, custom:{n:'Other (enter density)',d:0}};
const CALC_SHAPES = {
  round:{n:'Round bar',  f:[['d1','Diameter (mm)']]},
  square:{n:'Square bar', f:[['d1','Side (mm)']]},
  hex:{n:'Hex bar',      f:[['d1','Across flats (mm)']]},
  flat:{n:'Flat bar',    f:[['d1','Width (mm)'],['d2','Thickness (mm)']]},
  pipe:{n:'Pipe / tube', f:[['d1','Outer dia (mm)'],['d2','Wall thickness (mm)']]},
  plate:{n:'Plate / sheet', f:[['d1','Thickness (mm)']]},
};
const CALC_KERFS = ['0','1','1.5','2','2.5','3','4','5'];
const CALC_DEF = {on:false, shape:'round', mat:'ms', dens:'', d1:'', d2:'', weight:'', barLen:'', bars:'1', cut:'', cutW:'', kerf:'2', kerfC:'', manual:false};
function calcShapeSvg(shape){
  const a = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"';
  const m = {
    round:`<circle cx="16" cy="16" r="11" ${a}/>`,
    square:`<rect x="6" y="6" width="20" height="20" ${a}/>`,
    hex:`<polygon points="16,4 26,10 26,22 16,28 6,22 6,10" ${a}/>`,
    flat:`<rect x="3" y="11" width="26" height="10" ${a}/>`,
    pipe:`<circle cx="16" cy="16" r="11" ${a}/><circle cx="16" cy="16" r="6" ${a}/>`,
    plate:`<polygon points="4,22 10,10 28,10 22,22" ${a}/>`,
  };
  return `<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">${m[shape]||m.round}</svg>`;
}
function calcDensity(cl){ return cl.mat==='custom' ? _cn(cl.dens) : (CALC_MATS[cl.mat]||CALC_MATS.ms).d; }
function calcKerf(cl){ return cl.kerf==='custom' ? _cn(cl.kerfC) : _cn(cl.kerf); }
function calcPieces(cl){
  cl = {...CALC_DEF, ...(cl||{})};
  const dens = calcDensity(cl), kerf = calcKerf(cl), cut = _cn(cl.cut), d1=_cn(cl.d1), d2=_cn(cl.d2);
  let W = _cn(cl.weight);
  const barLenM = _cn(cl.barLen), nBars = Math.max(1, Math.floor(_cn(cl.bars)) || 1);
  const shape = CALC_SHAPES[cl.shape] ? cl.shape : 'round';
  const bad = m => ({ok:false, msg:m, shape});
  if(dens<=0) return bad('Enter the material density.');
  if(d1<=0 || (CALC_SHAPES[shape].f.length>1 && d2<=0)) return bad('Enter the size of the raw material (' + CALC_SHAPES[shape].f.map(x=>x[1]).join(' & ') + ').');
  const isPlate = shape==='plate';
  if(W<=0 && (isPlate || barLenM<=0)) return bad(isPlate ? 'Enter the weight of the raw material (kg).' : 'Enter the length of the raw material (m) or its weight (kg).');
  if(cut<=0) return bad('Enter the cutting size of one piece (mm).');
  if(shape==='plate'){
    const cw = _cn(cl.cutW); if(cw<=0) return bad('Enter the cut width of one piece (mm).');
    const kgPc = (cut+kerf)*(cw+kerf)*d1*dens/1e6;       // with cutting loss on both sides
    const net  = cut*cw*d1*dens/1e6;
    const pieces = Math.floor(W/kgPc + 1e-9);
    return {ok:true, shape, pieces, kgPc:net, kgPcLoss:kgPc, kerf, cut, cw, W, dens, plate:true, offcutKg: W - pieces*kgPc};
  }
  let area;
  if(shape==='round')  area = Math.PI/4*d1*d1;
  else if(shape==='square') area = d1*d1;
  else if(shape==='hex')    area = Math.sqrt(3)/2*d1*d1;
  else if(shape==='flat')   area = d1*d2;
  else { if(d1 <= 2*d2) return bad('Wall thickness is too large for this outer diameter.'); area = Math.PI/4*(d1*d1 - (d1-2*d2)*(d1-2*d2)); }
  const kgPerMm = area*dens/1e6;
  const pitch = cut+kerf;
  if(barLenM>0){
    // Physical bars: each bar is cut separately, so the left-over of every bar is wasted
    const barMm = barLenM*1000;
    if(barMm < cut) return bad('Bar length is shorter than one piece.');
    const perBar = Math.floor((barMm + kerf)/pitch + 1e-9);   // last cut needs no kerf after it
    const pieces = perBar*nBars;
    const theoW = kgPerMm*barMm*nBars;
    return {ok:true, shape, byLen:true, pieces, perBar, nBars, barLenM, barMm, pitch, kerf, cut, W:theoW, enteredW:_cn(cl.weight), dens, kgPc: area*cut*dens/1e6, offcut: barMm - perBar*pitch + kerf};
  }
  const totalLen = W/kgPerMm;
  const pieces = Math.floor(totalLen/pitch + 1e-9);
  return {ok:true, shape, pieces, totalLen, pitch, kerf, cut, W, dens, kgPc: area*cut*dens/1e6, offcut: totalLen - pieces*pitch};
}
function calcSummary(res){
  const f = (n,d)=> (Math.round(n*Math.pow(10,d||0))/Math.pow(10,d||0)).toLocaleString('en-IN');
  if(!res.ok) return `<div class="warn">${esc(res.msg)}</div>`;
  const sh = (CALC_SHAPES[res.shape]||{}).n || '';
  if(res.plate) return `${calcShapeSvg(res.shape)}<div><b style="font-size:15px;">${res.pieces} pieces</b> from ${f(res.W,2)} kg of ${esc(sh.toLowerCase())}<br>
    <small>Each piece ${f(res.cut)} × ${f(res.cw)} mm (+ ${f(res.kerf,1)} mm cutting loss) = ${f(res.kgPcLoss,3)} kg · net piece weight ${f(res.kgPc,3)} kg · left-over ≈ ${f(Math.max(0,res.offcutKg),2)} kg</small></div>`;
  if(res.byLen){
    const wn = (res.enteredW>0 && Math.abs(res.enteredW-res.W)/res.W>0.05) ? ` <span class="warn">· entered weight ${f(res.enteredW,2)} kg differs from calculated</span>` : '';
    return `${calcShapeSvg(res.shape)}<div><b style="font-size:15px;">${res.pieces} pieces</b> from ${res.nBars} × ${f(res.barLenM,3)} m ${esc(sh.toLowerCase())} (≈ ${f(res.W,2)} kg)<br>
    <small>${f(res.barMm)} mm bar ÷ (${f(res.cut)} cut + ${f(res.kerf,1)} loss = ${f(res.pitch,1)} mm per piece) = ${res.perBar} pieces per bar · weight per piece ${f(res.kgPc,3)} kg · offcut ≈ ${f(Math.max(0,res.offcut))} mm per bar${wn}</small></div>`;
  }
  return `${calcShapeSvg(res.shape)}<div><b style="font-size:15px;">${res.pieces} pieces</b> from ${f(res.W,2)} kg of ${esc(sh.toLowerCase())}<br>
    <small>Bar length ≈ ${f(res.totalLen)} mm ÷ (${f(res.cut)} cut + ${f(res.kerf,1)} loss = ${f(res.pitch,1)} mm per piece) · weight per piece ${f(res.kgPc,3)} kg · offcut ≈ ${f(Math.max(0,res.offcut))} mm</small></div>`;
}

function openCostingModal(id){
  const p = DB.products.find(x=>x.id===id); if(!p) return;
  COST = { id, c:getCosting(p), rate:(p.rate===undefined||p.rate===null)?'':p.rate };
  // Brand-new setup: stock counting starts TODAY — older invoices are not deducted.
  if(!COST.c.setup && !COST.c.trackFrom && !COST.c.batches.length) COST.c.trackFrom = todayInputDate();
  openModal(`
    <div class="modal-head"><div><h3>Costing &amp; Stock</h3><div class="mh-sub">${esc(p.name)}${p.dwg?` · ${esc(p.dwg)}`:''}</div></div><button class="btn btn-ghost btn-icon" onclick="closeModal()" aria-label="Close">${icon('x')}</button></div>
    <div class="modal-body" id="cs-body"></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="cs-save">Save</button></div>
  `, {wide:true});
  const body = document.getElementById('cs-body');
  costRender();
  body.addEventListener('input', ev=>{
    const t = ev.target, r = t.closest && t.closest('.cs-row.cs-b');
    if(r && t.dataset){
      const isP = t.dataset.f==='pieces', isC = !!t.dataset.cf;
      if(isP || isC){
        costRead();
        const b = COST.c.batches.find(x=>x.id===r.dataset.id);
        if(b && b.calc && b.calc.on) b.calc.manual = isP;   // typing pieces = manual override; changing weight/size/loss = recalc
      }
    }
    costUpdate();
  });
  body.addEventListener('change', e=>{
    const f = e.target && e.target.dataset && e.target.dataset.cf;
    if(f==='shape' || f==='mat' || f==='kerf'){ costRead(); costRender(); }   // these change which fields are shown
  });
  body.addEventListener('click', e=>{
    const add = e.target.closest('[data-cs-add]'), del = e.target.closest('[data-cs-del]');
    if(e.target.closest('#cs-use-sugg')){
      costRead();
      const kk = calcCosting(COST.c, p);
      if(kk.unit>0){ const ri = document.getElementById('cs-rate-in'); if(ri){ ri.value = round2(kk.unit*(1+_cn(COST.c.markup)/100)); costUpdate(); } }
      else toast('Add raw material / operation costs first.', 'err');
      return;
    }
    const rs = e.target.closest('[data-cs-resetcalc]');
    if(rs){
      e.preventDefault(); costRead();
      const b = COST.c.batches.find(x=>x.id===rs.closest('.cs-row').dataset.id);
      if(b && b.calc) b.calc.manual = false;
      costRender(); return;
    }
    const tg = e.target.closest('[data-cs-calc]');
    if(tg){
      costRead();
      const rid = tg.closest('.cs-row').dataset.id, b = COST.c.batches.find(x=>x.id===rid);
      if(b){
        const cur = b.calc ? {...CALC_DEF, ...b.calc} : {...CALC_DEF, ...calcGuessFromName(p.name)};
        if(!b.calc || !(cur.d1||cur.cut)) Object.assign(cur, calcGuessFromName(p.name));
        cur.on = !(b.calc && b.calc.on); cur.manual = false;
        b.calc = cur;
      }
      costRender();
      return;
    }
    if(add){
      costRead();
      const t = add.dataset.csAdd;
      if(t==='batch') COST.c.batches.push({id:uid('b_'), date:todayInputDate(), material:'', supplier:'', cost:'', pieces:'', rejected:''});
      if(t==='op')    COST.c.ops.push({id:uid('o_'), name:'', cost:''});
      if(t==='app')   COST.c.applied.push({id:uid('a_'), name:'', cost:''});
      costRender();
      const rows = body.querySelectorAll(t==='batch'?'.cs-row.cs-b':t==='op'?'.cs-row.cs-o':'.cs-row.cs-a');
      const last = rows[rows.length-1]; if(last){ const f = last.querySelector('input:not([type=date])'); if(f) f.focus(); }
    } else if(del){
      costRead();
      const row = del.closest('.cs-row'), rid = row.dataset.id;
      COST.c.batches = COST.c.batches.filter(x=>x.id!==rid); COST.c.ops = COST.c.ops.filter(x=>x.id!==rid); COST.c.applied = COST.c.applied.filter(x=>x.id!==rid);
      costRender();
    }
  });
  document.getElementById('cs-save').onclick = async ()=>{
    costRead();
    const c = COST.c;
    const rec = {
      batches: c.batches.filter(b=>_cn(b.cost)||_cn(b.pieces)||(b.material||'').trim()).map(b=>({id:b.id||uid('b_'), date:b.date||'', material:(b.material||'').trim(), supplier:(b.supplier||'').trim(), cost:_cn(b.cost), pieces:_cn(b.pieces), rejected:_cn(b.rejected), ...(b.calc ? {calc:{on:!!b.calc.on, shape:b.calc.shape||'round', mat:b.calc.mat||'ms', dens:_cn(b.calc.dens), d1:_cn(b.calc.d1), d2:_cn(b.calc.d2), weight:_cn(b.calc.weight), barLen:_cn(b.calc.barLen), bars:_cn(b.calc.bars)||1, cut:_cn(b.calc.cut), cutW:_cn(b.calc.cutW), kerf:String(b.calc.kerf===undefined?'2':b.calc.kerf), kerfC:_cn(b.calc.kerfC), manual:!!b.calc.manual}} : {})})),
      ops: c.ops.filter(o=>(o.name||'').trim()||_cn(o.cost)).map(o=>({id:o.id||uid('o_'), name:(o.name||'').trim(), cost:_cn(o.cost)})),
      applied: c.applied.filter(o=>(o.name||'').trim()||_cn(o.cost)).map(o=>({id:o.id||uid('a_'), name:(o.name||'').trim(), cost:_cn(o.cost)})),
      trackFrom: c.trackFrom || todayInputDate(),
      setup: true,
      markup: c.markup==='' ? '' : _cn(c.markup),
    };
    if(_cn(COST.rate) < 0){ toast('Selling rate cannot be negative.', 'err'); return; }
    const bad = rec.batches.find(b=>b.pieces-b.rejected < 0);
    if(bad){ toast('Rejected pieces cannot be more than pieces obtained.', 'err'); return; }
    const prev = {costing:p.costing, rate:p.rate, updatedAt:p.updatedAt};
    p.costing = rec;
    const k = calcCosting(getCosting(p), p);
    if(String(COST.rate).trim()!=='' ){ p.rate = round2(_cn(COST.rate)); }
    p.updatedAt = nowISO();
    const btn = document.getElementById('cs-save');
    if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
    const ok = await Promise.race([persist('products'), new Promise(r=>setTimeout(()=>r(false), 15000))]);
    if(!ok){
      // The database did not accept it — undo the local change and keep the form open so nothing is lost.
      if(prev.costing===undefined) delete p.costing; else p.costing = prev.costing;
      p.rate = prev.rate; p.updatedAt = prev.updatedAt;
      if(btn){ btn.disabled = false; btn.textContent = 'Save'; }
      toast('Not saved — the app cannot reach the database right now. Check your internet, then press Save again.', 'err');
      return;
    }
    cacheSaveDB();
    closeModal(); render(); toast('Costing & stock saved', 'ok');
  };
}

      'Raw Material / pc':k.tracked?round2(k.rawPc):'', 'Operations / pc':k.tracked?round2(k.opsPc):'', 'Applied / pc':k.tracked?round2(k.appPc):'',

function duplicateProduct(id){
  const p = DB.products.find(x=>x.id===id); if(!p) return;
  const copy = {...p, id: uid('p_'), dwg: p.dwg+'-COPY', name: p.name+' (Copy)', createdAt: nowISO(), updatedAt: nowISO()};
  const srcFiles = (p.files||[]);
  copy.files = srcFiles.map(f=>({...f}));
  DB.products.push(copy); persist('products'); render(); toast('Product duplicated', 'ok');
  if(srcFiles.length){ (async()=>{ for(const f of srcFiles){ try{
    const snap = await RTDB_ROOT.child('product_files').child(id).child(f.id).get();
    if(snap.exists()) await RTDB_ROOT.child('product_files').child(copy.id).child(f.id).set(snap.val());
  }catch(e){ console.error('copy file failed', e); } } })(); }
}
function toggleProductActive(id){
  const p = DB.products.find(x=>x.id===id); if(!p) return;
  p.active = !p.active; p.updatedAt = nowISO(); persist('products'); render();
}
function deleteProduct(id){
  const used = DB.invoices.some(inv => (inv.items||[]).some(it=>it.productId===id));
  if(used){ if(!confirm('This product is used in existing invoices. Deleting it will not affect saved invoices (they keep their own snapshot), but future use will require re-adding it. Delete anyway?')) return; }
  else if(!confirm('Delete this product permanently?')) return;
  pfRemoveAllFor(id);
  DB.products = DB.products.filter(x=>x.id!==id); PRODUCT_SEL.delete(id); persist('products'); render(); toast('Product deleted', 'ok');
}
function deleteSelectedProducts(){
  const ids = new Set(PRODUCT_SEL);
  const n = DB.products.filter(p=>ids.has(p.id)).length;
  if(!n){ toast('No products selected', 'err'); return; }
  const used = DB.invoices.some(inv => (inv.items||[]).some(it=>ids.has(it.productId)));
  const note = used ? ' Some are used in existing invoices; saved invoices keep their own snapshot and will not be affected.' : '';
  if(!confirm(`Delete ${n} selected product${n>1?'s':''} permanently? This cannot be undone.${note}`)) return;
  ids.forEach(pid=>pfRemoveAllFor(pid));
  DB.products = DB.products.filter(p=>!ids.has(p.id));
  PRODUCT_SEL.clear();
  persist('products'); render();
  toast(`Deleted ${n} product${n>1?'s':''}`, 'ok');
}
function deleteAllProducts(){
  if(!Array.isArray(DB.products)) DB.products = [];
  if(!DB.products.length){ toast('No products to delete', 'err'); return; }
  const n = DB.products.length;
  if(!confirm(`Delete ALL ${n} products permanently? This cannot be undone. (Existing invoices keep their own item snapshots and won't be affected, but you'll need to re-add products before creating new invoices.)`)) return;
  try{ RTDB_ROOT.child('product_files').remove(); }catch(e){}
  DB.products = []; PRODUCT_SEL.clear();
  persist('products'); render();
  toast(`Deleted all ${n} products`, 'ok');
}
function setAllProductsGST18(){
  if(!Array.isArray(DB.products)) DB.products = [];
  if(!DB.products.length){ toast('No products to update', 'err'); return; }
  if(!confirm(`Set GST to ${defGst()}% for all ${DB.products.length} products? This overwrites any product-specific GST rates currently set.`)) return;
  DB.products.forEach(p=>{ p.gst = defGst(); p.updatedAt = nowISO(); });
  persist('products'); render();
  toast(`GST set to ${defGst()}% for ${DB.products.length} products`, 'ok');
}

  const rows = DB.products.map(p=>[p.name,p.category||'',p.material||'',p.dwg,p.hsn,p.unit,p.rate,p.gst,p.description,p.active?'Yes':'No']);

const normProdName = s => String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function findDuplicateGroups(){
  const map = new Map();
  DB.products.forEach(p=>{ const k = normProdName(p.name); if(!k) return; const kk = k+'|'+(p.category||''); if(!map.has(kk)) map.set(kk,[]); map.get(kk).push(p); });
  return [...map.values()].filter(g=>g.length>1);
}
function openDuplicatesModal(newIds){
  newIds = newIds || new Set();
  const groups = findDuplicateGroups();
  if(!groups.length){ closeModal(); toast('No duplicate products found', 'ok'); return; }
  const total = groups.reduce((a,g)=>a+g.length,0);
  const body = groups.map(g=>{
    const rates = g.map(p=>Number(p.rate)||0);
    const lo = Math.min(...rates), hi = Math.max(...rates);
    const diff = hi!==lo;
    return `<div style="border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden;">
      <div style="padding:9px 14px;background:var(--canvas-2);display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <b style="font-size:13px;">${esc(g[0].name)}</b>${g[0].category?' '+catBadge(g[0].category):''}
        <span class="badge ${diff?'badge-partial':'badge-draft'}">${g.length} entries · ${diff?`Rate differs (${fmtINR(lo)} – ${fmtINR(hi)})`:'Same rate'}</span>
      </div>
      <table class="tbl" style="margin:0;"><tbody>
      ${g.map(p=>{ const r=Number(p.rate)||0; const tag = diff ? (r===lo?'<span class="badge badge-paid">Lowest</span>':(r===hi?'<span class="badge badge-cancelled">Highest</span>':'')) : '';
        return `<tr>
          <td class="chk-col"><input type="checkbox" class="prod-chk" data-dup-sel="${p.id}"></td>
          <td>${esc(p.name)} ${newIds.has(p.id)?'<span class="badge badge-sent">New</span>':'<span class="badge badge-draft">Existing</span>'}${p.dwg?` <span class="mono muted">${esc(p.dwg)}</span>`:''}</td>
          <td class="right t-strong nowrap">${fmtINR(p.rate)}</td>
          <td class="right">${tag}</td></tr>`; }).join('')}
      </tbody></table></div>`;
  }).join('');
  openModal(`
    <div class="modal-head"><div><h3>Duplicate Products</h3><div class="mh-sub">${groups.length} names appear more than once (${total} entries). Tick the extras you want to delete.</div></div><button class="btn btn-ghost btn-icon" onclick="closeModal()" aria-label="Close">${icon('x')}</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot">
      <button class="btn btn-sm" id="dup-keep-lowest">Select all except lowest rate</button>
      <button class="btn btn-sm" id="dup-keep-first">Select all except first</button>
      <div class="spacer" style="flex:1"></div>
      <button class="btn" onclick="closeModal()">Close</button>
      <button class="btn btn-danger" id="dup-delete">${icon('trash')} Delete Selected (<span id="dup-n">0</span>)</button>
    </div>`, {wide:true});
  const boxes = ()=>[...document.querySelectorAll('[data-dup-sel]')];
  const upd = ()=>{ document.getElementById('dup-n').textContent = boxes().filter(b=>b.checked).length; };
  boxes().forEach(b=>b.addEventListener('change', upd));
  const keepBy = pick => {
    boxes().forEach(b=>b.checked=false);
    groups.forEach(g=>{ const keep = pick(g); g.forEach(p=>{ if(p!==keep){ const b=document.querySelector(`[data-dup-sel="${p.id}"]`); if(b) b.checked=true; } }); });
    upd();
  };
  document.getElementById('dup-keep-lowest').addEventListener('click', ()=>keepBy(g=>g.reduce((a,b)=>(Number(b.rate)||0)<(Number(a.rate)||0)?b:a)));
  document.getElementById('dup-keep-first').addEventListener('click', ()=>keepBy(g=>g[0]));
  document.getElementById('dup-delete').addEventListener('click', ()=>{
    const ids = new Set(boxes().filter(b=>b.checked).map(b=>b.dataset.dupSel));
    if(!ids.size){ toast('Nothing selected', 'err'); return; }
    // never allow deleting every entry of a name
    const wipes = groups.some(g=>g.every(p=>ids.has(p.id)));
    if(wipes && !confirm('You selected every entry for at least one product, so it will be removed completely. Continue?')) return;
    if(!confirm(`Delete ${ids.size} selected duplicate${ids.size>1?'s':''}? This cannot be undone.`)) return;
    DB.products = DB.products.filter(p=>!ids.has(p.id));
    ids.forEach(id=>PRODUCT_SEL.delete(id));
    persist('products'); render();
    toast(`Deleted ${ids.size} duplicate${ids.size>1?'s':''}`, 'ok');
    if(findDuplicateGroups().length) openDuplicatesModal(newIds); else closeModal();
  });
}
/* ---- Import helpers: find the real header row + the Product / Rate columns ---- */
function _impNum(v){
  if(typeof v === 'number') return v;
  if(v===undefined || v===null) return NaN;
  const c = String(v).replace(/[^0-9.\-]/g,'');
  return c===''||c==='-'||c==='.' ? NaN : parseFloat(c);
}
function _impIsJunkName(name){
  const s = String(name||'').trim();
  if(!s) return true;
  if(/^[\d\s.,\-\/()#:]+$/.test(s)) return true;                       // "1", "2", "3.1"
  if(/^(sr|s|sl|serial)[ .]*(no|num|number)?\.?$/i.test(s)) return true; // "SR.NO", "S.No"
  if(/^(rate|price|description|particulars?|product( name)?|item( name)?|part name|amount|total|qty|quantity|unit|hsn|dwg.*)$/i.test(s)) return true;
  return false;
}
function detectProductColumns(grid){
  const clean = h => String(h==null?'':h).toLowerCase().replace(/\s+/g,' ').trim();
  const rateScore = s => (!s || /gst|tax|%|hsn|qty|quantity/.test(s)) ? 0 : (/^(rate|price|unit rate|unit price|basic rate|rate \(rs\.?\)|rate in rs\.?|mrp)$/.test(s) ? 3 : (/(rate|price|mrp|amount|cost)/.test(s) ? 1 : 0));
  const nameScore = s => {
    if(!s || /(dwg|drawing|hsn|code|unit|uom|qty|quantity|rate|price|gst)/.test(s)) return 0;
    if(/^(sr|s|sl|serial)[ .]*(no|num|number)?\.?$/.test(s)) return 0;
    if(/^(product name|item name|part name|product|item|name)$/.test(s)) return 3;
    if(/(product|name|item|component|material)/.test(s)) return 2;
    if(/(description|desc|particular)/.test(s)) return 1;
    return 0;
  };
  const limit = Math.min(grid.length, 40);
  for(let r=0;r<limit;r++){
    const row = grid[r].map(clean);
    let nc=-1, ns=0, rc=-1, rs=0;
    row.forEach((h,i)=>{ const a=nameScore(h); if(a>ns){ns=a;nc=i;} const b=rateScore(h); if(b>rs){rs=b;rc=i;} });
    if(nc!==-1 && rc!==-1 && nc!==rc) return {headerRow:r, nameCol:nc, rateCol:rc, how:'headers', nameLabel:String(grid[r][nc]).trim(), rateLabel:String(grid[r][rc]).trim()};
  }
  // Fallback: guess from the data itself.
  const width = Math.max(0,...grid.map(r=>r.length));
  let nameCol=-1, bestText=0;
  const stats=[];
  for(let c=0;c<width;c++){
    let text=0, num=0, filled=0; const nums=[];
    grid.forEach(r=>{
      const v=r[c]; if(v===undefined||v===null||String(v).trim()==='') return; filled++;
      const n=_impNum(v);
      if(!isNaN(n) && /^[\s\d.,₹$\-rs]*$/i.test(String(v))){ num++; nums.push(n); }
      else if(String(v).trim().length>=3 && !_impIsJunkName(v)) text++;
    });
    const serial = nums.length>3 && nums.slice(0,8).every((n,i,a)=> i===0 || n===a[i-1]+1);
    stats.push({c,text,num,filled,serial});
    if(text>bestText){ bestText=text; nameCol=c; }
  }
  if(nameCol===-1) return null;
  const cands = stats.filter(s=>s.c!==nameCol && !s.serial && s.num>0 && s.num>=s.filled*0.5);
  if(!cands.length) return null;
  cands.sort((a,b)=> b.num-a.num || b.c-a.c);
  return {headerRow:-1, nameCol, rateCol:cands[0].c, how:'guessed', nameLabel:'column '+(nameCol+1), rateLabel:'column '+(cands[0].c+1)};
}
function importProductsCSV(e){
  const file = e.target.files[0]; if(!file) return;
  e.target.value='';
  const preset = (PRODUCT_CAT!=='all' && PRODUCT_CAT!=='__none') ? PRODUCT_CAT : '';
  openModal(`

    <div class="modal-body">
      <p class="hint" style="margin:6px 0 0;">Only Product and Rate are imported from the file.</p>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="imp-go">${icon('upload')} Import</button></div>`);
  document.getElementById('imp-go').onclick = ()=>{
    closeModal();
    _importCategory = '';
    runProductImport({target:{files:[file], value:''}});
  };
}
function runProductImport(e){
  const file = e.target.files[0]; if(!file) return;
  const isExcel = /\.xlsx$|\.xls$/i.test(file.name);

  function processGrid(grid){
    if(!Array.isArray(DB.products)) DB.products = [];
    grid = grid.filter(r=>Array.isArray(r) && r.some(c=>String(c==null?'':c).trim()!==''));
    const det = detectProductColumns(grid);
    if(!det){ toast('Could not find a Product and a Rate column in that file. Make sure it has a product/description column and a Rate column.', 'err'); return; }
    let added=0, skipped=0;
    const importedIds = new Set();
    grid.slice(det.headerRow+1).forEach(r=>{
      const raw = r[det.nameCol];
      const rate = _impNum(r[det.rateCol]);
      // A cell can list several products on separate lines sharing one rate -> one product per line.
      const lines = (raw===undefined||raw===null ? '' : String(raw)).split(/\r?\n/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
      if(!lines.length || isNaN(rate)){ skipped++; return; }
      lines.forEach(name=>{
        if(_impIsJunkName(name)){ skipped++; return; }   // title rows, SR.NO, row numbers
        const rec = {id:uid('p_'),name,category:_importCategory,dwg:'',hsn:DEFAULT_HSN,unit:'Nos',rate,gst:defGst(),description:'',active:true,createdAt:nowISO(),updatedAt:nowISO()};
        DB.products.push(rec); importedIds.add(rec.id); added++;
      });
    });
    persist('products'); render();
    const groups = findDuplicateGroups();
    toast(`Imported ${added} products${_importCategory?' into '+_importCategory:''} using "${det.nameLabel}" + "${det.rateLabel}"${det.how==='guessed'?' (auto-detected)':''}` + (skipped?` · ${skipped} rows skipped`:'') + (groups.length?` · ${groups.length} duplicate name${groups.length>1?'s':''} found`:''), added?'ok':'err');
    if(groups.length) openDuplicatesModal(importedIds);
  }

  if(isExcel){
    if(typeof XLSX === 'undefined'){
      toast('Excel import needs an internet connection to load the Excel reader. Try again once you\'re online, or use CSV instead.', 'err');
      e.target.value=''; return;
    }
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const wb = XLSX.read(reader.result, {type:'array'});
        // Use the first sheet that has a recognisable Product + Rate header; otherwise the first non-empty sheet.
        let grid=null, fallback=null;
        for(const name of wb.SheetNames){
          const g = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:'', raw:true});
          if(!g.length) continue;
          if(!fallback) fallback=g;
          const d = detectProductColumns(g.filter(r=>r.some(c=>String(c).trim()!=='')));
          if(d && d.how==='headers'){ grid=g; break; }
        }
        grid = grid || fallback;
        if(!grid){ toast('That Excel file looks empty.', 'err'); return; }
        processGrid(grid);
      }catch(err){ console.error(err); toast('Import failed: ' + (err && err.message ? err.message : 'could not read that Excel file.'), 'err'); }
    };
    reader.onerror = ()=>{ toast('Could not read that file.', 'err'); };
    reader.readAsArrayBuffer(file);
  } else {
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const {header, rows} = parseCSV(reader.result);
        processGrid([header, ...rows]);
      }catch(err){ console.error(err); toast('Import failed: ' + (err && err.message ? err.message : 'invalid CSV file'), 'err'); }
    };
    reader.onerror = ()=>{ toast('Could not read that file.', 'err'); };
    reader.readAsText(file);
  }
  e.target.value='';
}

function cleanJunkProducts(){
  const junk = DB.products.filter(p=>_impIsJunkName(p.name));
  if(!junk.length){ toast('No junk rows found (numbers-only names, SR.NO, etc.)', 'ok'); return; }
  const preview = junk.slice(0,8).map(p=>p.name).join(', ') + (junk.length>8?', …':'');
  if(!confirm(`Delete ${junk.length} junk product${junk.length>1?'s':''} whose names are just numbers or headings like SR.NO?\n\n${preview}`)) return;
  const ids = new Set(junk.map(p=>p.id));
  DB.products = DB.products.filter(p=>!ids.has(p.id));
  ids.forEach(id=>PRODUCT_SEL.delete(id));
  persist('products'); render();
  toast(`Deleted ${ids.size} junk rows`, 'ok');
}

    const name = document.getElementById('cf-name').value.trim();
    const baddr = document.getElementById('cf-baddr').value.trim();

    const gstin = document.getElementById('cf-gstin').value.trim().toUpperCase();
    if(gstin && !/^[0-9]{2}[A-Z0-9]{10}[0-9][A-Z][0-9A-Z]$/.test(gstin)){
      if(!confirm("This GSTIN doesn't match the usual 15-character format. Save anyway?")) return;
    }
    const cleanObItems = obItems
      .map(it=>({ number: (it.number||'').trim(), date: it.date||'', amount: round2(parseFloat(it.amount)||0) }))
      .filter(it=>it.number || it.date || it.amount);
    const openingRaw = document.getElementById('cf-opening').value.trim();
    const openingBalance = cleanObItems.length
      ? round2(cleanObItems.reduce((t,it)=>t+it.amount,0))
      : (openingRaw === '' ? 0 : round2(parseFloat(openingRaw)));
    if(isNaN(openingBalance)){ document.getElementById('cf-err').textContent='Opening balance must be a valid number.'; return; }
    const rec = {
      id: c.id || uid('c_'),
      name, billingAddress: baddr,
      shippingAddress: same.checked ? baddr : document.getElementById('cf-saddr').value.trim(),
      gstin, pan: document.getElementById('cf-pan').value.trim().toUpperCase(),
      contactPerson: document.getElementById('cf-contact').value.trim(),
      phone: document.getElementById('cf-phone').value.trim(),
      email, state: document.getElementById('cf-state').value.trim(), stateCode,
      paymentTerms: document.getElementById('cf-terms').value.trim(),
      notes: document.getElementById('cf-notes').value.trim(),
      openingBalance,
      openingBalanceItems: cleanObItems,
      createdAt: c.id ? c.createdAt : nowISO(), updatedAt: nowISO(),
    };
    if(c.id){ const idx = DB.customers.findIndex(x=>x.id===c.id); DB.customers[idx]=rec; }
    else DB.customers.push(rec);
    persist('customers'); closeModal();
    toast('Customer saved', 'ok');
    if(onSaved) onSaved(rec); else render();
  };
}
function deleteCustomer(id){

}
function exportCustomersCSV(){
  const header = ['Name','Billing Address','Shipping Address','GSTIN','PAN','Contact Person','Phone','Email','State','State Code','Payment Terms','Notes'];
  const rows = DB.customers.map(c=>[c.name,c.billingAddress,c.shippingAddress,c.gstin,c.pan,c.contactPerson,c.phone,c.email,c.state,c.stateCode,c.paymentTerms,c.notes]);
  downloadCSV('customers_export.csv', header, rows);

function importCustomersCSV(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const {header, rows} = parseCSV(reader.result);
      const idx = n => header.findIndex(h=>h.toLowerCase().trim()===n);
      let added=0, updated=0;
      rows.forEach(r=>{
        const name = r[idx('name')]||r[0]; if(!name) return;
        const gstin = (r[idx('gstin')]||'').toUpperCase();
        const rec = {
          name, billingAddress:r[idx('billing address')]||'', shippingAddress:r[idx('shipping address')]||r[idx('billing address')]||'',
          gstin, pan:(r[idx('pan')]||'').toUpperCase(), contactPerson:r[idx('contact person')]||'',
          phone:r[idx('phone')]||'', email:r[idx('email')]||'', state:r[idx('state')]||'', stateCode:r[idx('state code')]||'',
          paymentTerms:r[idx('payment terms')]||'', notes:r[idx('notes')]||''
        };
        const existing = gstin && DB.customers.find(c=>c.gstin===gstin);
        if(existing){ Object.assign(existing, rec, {updatedAt:nowISO()}); updated++; }
        else { DB.customers.push({...rec, id:uid('c_'), createdAt:nowISO(), updatedAt:nowISO()}); added++; }
      });
      persist('customers'); render(); toast(`Imported: ${added} added, ${updated} updated`, 'ok');
    }catch(err){ toast('Import failed: invalid CSV file', 'err'); }
  };
  reader.readAsText(file);
  e.target.value='';
}

/* ========================================================================
   CSV helpers
   ======================================================================== */
function downloadCSV(filename, header, rows){
  const esc2 = v => { v = (v===undefined||v===null)?'':String(v); if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"'; return v; };
  const csv = [header.map(esc2).join(','), ...rows.map(r=>r.map(esc2).join(','))].join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  triggerDownload(blob, filename);
}
function triggerDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
}
function parseCSV(text){
  const rows = [];
  let row=[], field='', inQuotes=false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(inQuotes){
      if(ch === '"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field += ch;
    } else {
      if(ch === '"') inQuotes = true;
      else if(ch === ','){ row.push(field); field=''; }
      else if(ch === '\n' || ch === '\r'){ if(ch==='\r' && text[i+1]==='\n') i++; row.push(field); field=''; rows.push(row); row=[]; }
      else field += ch;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  const filtered = rows.filter(r=>r.some(c=>c!==''));
  const header = (filtered.shift()||[]).map(h=>h.toLowerCase().trim());
  return {header, rows: filtered};
}

/* ========================================================================
   RECEIVABLES & PAYABLES — the dedicated "who owes what" page. Customer-wise
   and supplier-wise balances are always derived live from invoices/purchases
   (grandTotal − amountPaid), never stored separately, so they can never drift
   out of sync with the actual documents and payments.
   ======================================================================== */
let LEDGER_TAB = 'receivable'; // receivable | payable
let LEDGER_SEARCH = '';
/* Total outstanding across ALL of a customer's invoices (not just the current one) —
   used for the small "overall balance" note that can optionally be printed on a bill. */
function customerOverallBalance(customerId, customerName){
  const invTotal = DB.invoices.reduce((sum, i)=>{
    const matches = customerId ? i.customerId===customerId : (!i.customerId && (i.customerName||'')===(customerName||''));
    return matches ? sum + invBalance(i) : sum;
  }, 0);
  const opening = customerId ? round2((DB.customers.find(c=>c.id===customerId)||{}).openingBalance||0) : 0;
  return round2(invTotal + opening);
}
function customerBalances(){
  // Opening balances (carried in from before this app) are keyed by customer id so they can
  // seed a row even for a customer with zero invoices, and add on top of invoice balances
  // for a customer who already has some.
  const openingById = {};
  DB.customers.forEach(c=>{ openingById[c.id] = round2(c.openingBalance||0); });
  const map = {};
  const ensure = (key, id, name) => {
    if(!map[key]){
      const opening = id ? (openingById[id]||0) : 0;
      map[key] = {key, id, name, invoices:[], billed:0, received:0, due:opening, opening, taxable:0, cgst:0, sgst:0, igst:0};
    }
    return map[key];
  };
  DB.customers.forEach(c=>{ if(round2(c.openingBalance||0)!==0) ensure(c.id, c.id, c.name); });
  DB.invoices.forEach(i=>{
    const key = i.customerId || ('name:'+(i.customerName||'Unknown'));
    const row = ensure(key, i.customerId, i.customerName||'Unnamed customer');
    const bal = invBalance(i);
    row.invoices.push(i);
    row.billed += round2(i.totals?.grandTotal||0);
    row.taxable += round2(i.totals?.taxableTotal||0); row.cgst += round2(i.totals?.cgst||0); row.sgst += round2(i.totals?.sgst||0); row.igst += round2(i.totals?.igst||0);
    row.received += round2(i.amountPaid||0);
    row.due += bal;
  });
  return Object.values(map).map(r=>({...r, billed:round2(r.billed), received:round2(r.received), due:round2(r.due), opening:round2(r.opening||0), taxable:round2(r.taxable), cgst:round2(r.cgst), sgst:round2(r.sgst), igst:round2(r.igst)}));
}
function supplierBalances(){
  const openingById = {};
  DB.suppliers.forEach(s=>{ openingById[s.id] = round2(s.openingBalance||0); });
  const map = {};
  const ensure = (key, id, name) => {
    if(!map[key]){
      const opening = id ? (openingById[id]||0) : 0;
      map[key] = {key, id, name, purchases:[], billed:0, paid:0, due:opening, opening, taxable:0, cgst:0, sgst:0, igst:0};
    }
    return map[key];
  };
  DB.suppliers.forEach(s=>{ if(round2(s.openingBalance||0)!==0) ensure(s.id, s.id, s.name); });
  DB.purchases.forEach(p=>{
    const key = p.supplierId || ('name:'+(p.supplierName||'Unknown'));
    const row = ensure(key, p.supplierId, p.supplierName||'Unnamed supplier');
    const bal = purBalance(p);
    row.purchases.push(p);
    row.billed += round2(p.totals?.grandTotal||0);
    row.taxable += round2(p.totals?.taxableTotal||0); row.cgst += round2(p.totals?.cgst||0); row.sgst += round2(p.totals?.sgst||0); row.igst += round2(p.totals?.igst||0);
    row.paid += round2(p.amountPaid||0);
    row.due += bal;
  });
  return Object.values(map).map(r=>({...r, billed:round2(r.billed), paid:round2(r.paid), due:round2(r.due), opening:round2(r.opening||0), taxable:round2(r.taxable), cgst:round2(r.cgst), sgst:round2(r.sgst), igst:round2(r.igst)}));
}
/* GST cell for the ledger: total GST on top, CGST / SGST / IGST split underneath. */
function gstCell(o){
  const total = round2((o.cgst||0)+(o.sgst||0)+(o.igst||0));
  if(!total) return '<span class="muted">—</span>';
  const parts = [];
  if(o.cgst) parts.push('CGST '+fmtINR(o.cgst));
  if(o.sgst) parts.push('SGST '+fmtINR(o.sgst));
  if(o.igst) parts.push('IGST '+fmtINR(o.igst));
  return '<div class="gst-main">'+fmtINR(total)+'</div><div class="gst-split">'+parts.join(' · ')+'</div>';
}

/* ========================================================================
   INVOICE NUMBERING
   ======================================================================== */
function peekNextInvoiceNumber(){
  const fy = currentFY();
  let seq = DB.counter.seq;
  if(DB.counter.fy !== fy) seq = 0;
  seq += 1;
  const padded = String(seq).padStart(DB.counter.pad||3,'0');
  return { number: `${DB.counter.prefix||''}${padded}/${fy}`, seq, fy };
}
function commitInvoiceNumber(){
  const {seq, fy} = peekNextInvoiceNumber();
  DB.counter.seq = seq; DB.counter.fy = fy; persist('counter');
}
/* Atomically reserves the next sequence number directly on the server, so two tabs/devices
   creating invoices at the same moment can never end up with the same (or an out-of-order)
   number — whichever one commits first server-side wins that number, guaranteed. */
async function claimInvoiceNumber(){
  const fy = currentFY();
  const localPrefix = (DB.counter && DB.counter.prefix) || '';
  const localPad = (DB.counter && DB.counter.pad) || 3;
  const ref = RTDB_ROOT.child(K_COUNTER).child('value');
  const result = await ref.transaction(current=>{
    let c = (current && typeof current==='object') ? {...current} : { fy, seq:0, prefix:localPrefix, pad:localPad };
    if(c.fy !== fy){ c.fy = fy; c.seq = 0; }
    if(c.prefix===undefined) c.prefix = localPrefix;
    if(c.pad===undefined) c.pad = localPad;
    c.seq = (c.seq||0) + 1;
    return c;
  });
  if(!result.committed || !result.snapshot || !result.snapshot.exists()){
    throw new Error('Could not reserve an invoice number — check your internet connection and try again.');
  }
  const c = result.snapshot.val();
  DB.counter = c;
  const padded = String(c.seq).padStart(c.pad||3,'0');
  return { number: `${c.prefix||''}${padded}/${c.fy}`, seq: c.seq, fy: c.fy };
}
function isNumberTaken(number, excludeId){
  return DB.invoices.some(i=>i.number===number && i.id!==excludeId);
}

/* ---- One-time maintenance tool: renumber every existing invoice into a clean, gap-free
   sequence (001, 002, 003...) per financial year, ordered by invoice date. Does not touch
   customer, item, or amount data — only the "number" field and, for currently-open drafts,
   nothing (drafts get a fresh number the normal way when they're saved). ---- */
function buildResequencePlan(){
  const prefix = (DB.counter && DB.counter.prefix) || '';
  const pad = (DB.counter && DB.counter.pad) || 3;
  const sorted = [...DB.invoices].sort((a,b)=>{
    const da = a.date||'', db_ = b.date||'';
    if(da !== db_) return da < db_ ? -1 : 1;
    const ca = a.createdAt||'', cb = b.createdAt||'';
    if(ca !== cb) return ca < cb ? -1 : 1;
    return (a.number||'').localeCompare(b.number||'');
  });
  const seqByFY = {};
  const plan = sorted.map(inv=>{
    const fy = fyFromDate(inv.date);
    seqByFY[fy] = (seqByFY[fy]||0) + 1;
    const newNumber = `${prefix}${String(seqByFY[fy]).padStart(pad,'0')}/${fy}`;
    return { id: inv.id, date: inv.date, customerName: inv.customerName, oldNumber: inv.number, newNumber, fy, seq: seqByFY[fy] };
  });
  return { plan, seqByFY, prefix, pad };
}
async function applyResequencePlan(planResult){
  const { plan, seqByFY, prefix, pad } = planResult;
  for(const row of plan){
    const inv = DB.invoices.find(i=>i.id===row.id);
    if(!inv) continue;
    inv.number = row.newNumber;
    inv.updatedAt = nowISO();
  }
  // Move the counter to the end of whichever FY is chronologically last, so the very next
  // new invoice continues on cleanly from here.
  const fyKeys = Object.keys(seqByFY).sort();
  const lastFY = fyKeys[fyKeys.length-1] || currentFY();
  DB.counter.fy = lastFY;
  DB.counter.seq = seqByFY[lastFY] || 0;
  DB.counter.prefix = prefix;
  DB.counter.pad = pad;
  const results = await Promise.all(plan.map(row=>{
    const inv = DB.invoices.find(i=>i.id===row.id);
    return inv ? invoiceSet(inv.id, inv) : Promise.resolve(true);
  }));
  await persist('counter');
  return results.every(r=>r!==false);
}

    <div class="modal-head"><div><h3>Resequence All Invoice Numbers</h3><div class="mh-sub">${changed.length} of ${plan.length} invoice${plan.length===1?'':'s'} will get a new number, ordered by invoice date</div></div><button class="btn btn-ghost btn-icon" onclick="closeModal()" aria-label="Close">${icon('x')}</button></div>
    <div class="modal-body">
      <div class="alert warn" style="margin-bottom:14px;">${icon('alert')}<div>This only changes the printed invoice <strong>number</strong> — dates, items, customers and amounts are untouched. If any of these invoices were already sent to customers or filed under their current number, make sure that's not a problem before continuing. Download a backup first if unsure.</div></div>
      <div class="tbl-wrap" style="max-height:420px;overflow-y:auto;">
        <table class="tbl"><thead><tr><th>Date</th><th>Customer</th><th>Current #</th><th>New #</th></tr></thead><tbody>${rows}</tbody></table>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="reseq-confirm">${icon('check')} Apply New Numbering</button>
    </div>
  `, {wide:true});
  document.getElementById('reseq-confirm').addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    btn.disabled = true; btn.textContent = 'Renumbering…';
    const { plan: freshPlan } = buildResequencePlan();
    const ok = await applyResequencePlan({ plan: freshPlan, seqByFY: (()=>{ const m={}; freshPlan.forEach(r=>{m[r.fy]=Math.max(m[r.fy]||0,r.seq);}); return m; })(), prefix: (DB.counter&&DB.counter.prefix)||'', pad: (DB.counter&&DB.counter.pad)||3 });
    closeModal();
    if(ok){ toast('Invoice numbers resequenced', 'ok'); render(); }
    else{ toast('Some invoices failed to update — check your connection and try again.', 'err'); }
  });
}

let _phTimer=null;
function closePriceHistory(){ clearTimeout(_phTimer); const el=document.getElementById('ph-pop'); if(el) el.remove(); document.removeEventListener('keydown',_phEsc); }
function _phEsc(e){ if(e.key==='Escape') closePriceHistory(); }
function showPriceHistory(prod, curInv){
  closePriceHistory();
  const norm = x=>String(x||'').toLowerCase().replace(/\s+/g,' ').trim();
  const nm = norm(prod.name);
  const rows=[];
  (DB.invoices||[]).forEach(iv=>{
    if(!iv || iv.status==='cancelled' || (curInv && curInv.id && iv.id===curInv.id)) return;
    (iv.items||[]).forEach(it=>{
      if((it.productId && it.productId===prod.id) || norm(it.name)===nm) rows.push({iv, it});
    });
  });
  rows.sort((a,b)=> new Date(b.iv.date||0) - new Date(a.iv.date||0));
  const sameCust = r => curInv && curInv.customerId && r.iv.customerId===curInv.customerId;
  const body = rows.length ? rows.map(r=>{
    const disc = r.it.discountValue ? ` · disc ${r.it.discountType==='pct' ? r.it.discountValue+'%' : fmtINR(r.it.discountValue)}` : '';
    return `<div class="ph-row ${sameCust(r)?'same':''}">
      <div class="ph-meta"><div class="ph-cust">${esc(r.iv.customerName||'—')}</div>
      <div class="ph-sub">${esc(fmtDate(r.iv.date))} · #${esc(r.iv.number||'')} · Qty ${esc(r.it.qty)}${disc}</div></div>
      <div class="ph-rate">${fmtINR(r.it.rate)}</div></div>`;
  }).join('') : `<div class="ph-empty">No earlier bill has this product.</div>`;
  const el=document.createElement('div'); el.id='ph-pop'; el.className='no-print';
  el.innerHTML=`<div class="ph-head"><div><div class="ph-title">Previous rates in all bills${rows.length?` (${rows.length})`:''}</div><div class="ph-prod">${esc(prod.name)}</div></div><button class="ph-x" aria-label="Close">&times;</button></div><div class="ph-list">${body}</div>`;
  document.body.appendChild(el);
  el.querySelector('.ph-x').onclick=closePriceHistory;
  document.addEventListener('keydown',_phEsc);
  const arm=()=>{ clearTimeout(_phTimer); _phTimer=setTimeout(closePriceHistory, 20000); };
  el.addEventListener('mouseenter',()=>clearTimeout(_phTimer)); el.addEventListener('mouseleave',arm); arm();
}
function invBillGstVal(inv){
  const its = (inv && inv.items) || [];
  if(!its.length) return defGst();

}
function defGst(){
  const v = parseFloat(DB.settings && DB.settings.defaultGstRate);

function __gstOpts(list, cur){
  const set = new Set(list); set.add(defGst());

}

function loadInvoiceIntoEditor(){
  if(VIEW_PARAMS.invoiceId){

    // (and therefore this function) reruns on every render() — which fires on every keystroke,
    // every "Add Product" click, every GST Type click, etc. Previously this re-cloned the pristine
    // saved record from DB.invoices on EVERY render, silently discarding whatever the user had just
    // changed a moment earlier — which is why edits to an already-saved invoice appeared to do
    // nothing (Add Product, GST Type, field edits — all reverted instantly by the next render).
    if(!CURRENT_INVOICE || CURRENT_INVOICE.id !== VIEW_PARAMS.invoiceId){

function knownHSNCodes(){
  const set = new Set();
  const add = v=>{ const code=String(v||'').trim(); if(code) set.add(code); };
  (DB.settings && Array.isArray(DB.settings.hsnCodes) ? DB.settings.hsnCodes : []).forEach(add);
  (DB.products||[]).forEach(p=>add(p.hsn));
  (DB.invoices||[]).forEach(inv=>(inv.items||[]).forEach(it=>add(it.hsn)));
  (DB.purchases||[]).forEach(p=>(p.items||[]).forEach(it=>add(it.hsn)));
  return [...set].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
}
function rememberHSNCode(value){
  const code=String(value||'').trim(); if(!code) return;
  if(!DB.settings) DB.settings={};
  if(!Array.isArray(DB.settings.hsnCodes)) DB.settings.hsnCodes=[];
  if(DB.settings.hsnCodes.some(x=>String(x).trim().toLowerCase()===code.toLowerCase())) return;
  DB.settings.hsnCodes.push(code);
  persist('settings').then(ok=>{ if(ok){ scheduleCacheSave(); } else { toast('HSN saved on this screen but cloud sync failed','err'); } });
}

/* generic autocomplete wiring
   NOTE: previously this added a fresh `document` click-listener on every call, and since
   wireInvoiceEditor() re-runs on every re-render (i.e. on every keystroke in item qty/rate/
   discount fields), those listeners accumulated forever and were never removed — after enough
   edits, dozens/hundreds of stale listeners piled up on `document`, making every click on the
   page (including the GST Type toggle) feel unresponsive or laggy. Fixed by installing a single
   delegated closer once, instead of one per autocomplete instance per render.

   The dropdown panel is rendered as a `position:fixed` element appended directly to
   document.body (not inside .ac-list-holder) and positioned under the input via
   getBoundingClientRect(). This is required because the items table (.items-card /
   .items-scroll) uses overflow:hidden / overflow-x:auto for its scroll behaviour, which was
   clipping the old absolutely-positioned-inside-the-row dropdown so it appeared cut off /
   hidden as soon as you typed a search. Only one panel is ever open at a time (ACTIVE_AC),
   so this can't leak the same way the old per-render listeners did. */
let AC_GLOBAL_CLOSER_INSTALLED = false;
let ACTIVE_AC = null; // {panel, inputEl, reposition}
function closeActiveAC(){
  if(ACTIVE_AC){ if(ACTIVE_AC.panel) ACTIVE_AC.panel.remove(); ACTIVE_AC = null; }
}
function installAutocompleteGlobalCloser(){
  if(AC_GLOBAL_CLOSER_INSTALLED) return;
  AC_GLOBAL_CLOSER_INSTALLED = true;
  document.addEventListener('click', (e)=>{
    if(!ACTIVE_AC) return;
    if(ACTIVE_AC.inputEl.contains(e.target)) return;
    if(ACTIVE_AC.panel && ACTIVE_AC.panel.contains(e.target)) return;
    closeActiveAC();
  });
  window.addEventListener('scroll', ()=>{ if(ACTIVE_AC) ACTIVE_AC.reposition(); }, true);
  window.addEventListener('resize', ()=>{ if(ACTIVE_AC) ACTIVE_AC.reposition(); });
}
function wireAutocomplete(inputEl, listHolderEl, searchFn, itemHtmlFn, onSelect, onCreateNew){
  installAutocompleteGlobalCloser();
  let items = []; let hiIdx = -1;
  function reposition(){
    if(!ACTIVE_AC || ACTIVE_AC.inputEl!==inputEl || !ACTIVE_AC.panel) return;
    const r = inputEl.getBoundingClientRect();
    const panel = ACTIVE_AC.panel;
    panel.style.left = Math.round(r.left)+'px';
    panel.style.width = Math.round(r.width)+'px';
    // Flip above the input if there isn't room below (e.g. last row of a long items table).
    const spaceBelow = window.innerHeight - r.bottom;
    if(spaceBelow < 180 && r.top > spaceBelow){
      panel.style.top = 'auto';
      panel.style.bottom = Math.round(window.innerHeight - r.top + 6)+'px';
    } else {
      panel.style.bottom = 'auto';
      panel.style.top = Math.round(r.bottom + 6)+'px';
    }
  }
  function close(){ if(ACTIVE_AC && ACTIVE_AC.inputEl===inputEl) closeActiveAC(); }
  function open(q){
    items = searchFn(q);
    if(!q){ close(); return; }
    hiIdx = -1;
    if(!ACTIVE_AC || ACTIVE_AC.inputEl!==inputEl){
      closeActiveAC();
      const panel = document.createElement('div');
      panel.className = 'ac-list';
      panel.style.position = 'fixed';
      panel.style.right = 'auto';
      document.body.appendChild(panel);
      ACTIVE_AC = {panel, inputEl, reposition};
    }
    const listHtml = items.length? items.map((it,i)=>`<div class="ac-item" data-i="${i}">${itemHtmlFn(it)}</div>`).join('')
      : `<div class="ac-empty">No matches found.</div>`;
    const createHtml = onCreateNew ? `<div class="ac-item ac-create" data-create="1">${icon('plus')} Add "${esc(q)}" as new product</div>` : '';
    ACTIVE_AC.panel.innerHTML = listHtml + createHtml;
    reposition();
    ACTIVE_AC.panel.querySelectorAll('.ac-item[data-i]').forEach(el=>{
      el.addEventListener('click', ()=>{ onSelect(items[+el.dataset.i]); close(); });
    });
    const createEl = ACTIVE_AC.panel.querySelector('.ac-create');
    if(createEl) createEl.addEventListener('click', ()=>{ close(); onCreateNew(q); });
  }
  inputEl.addEventListener('input', ()=>open(inputEl.value.trim()));
  inputEl.addEventListener('focus', ()=>{ if(inputEl.value.trim()) open(inputEl.value.trim()); });
  inputEl.addEventListener('keydown', (e)=>{
    const rows = (ACTIVE_AC && ACTIVE_AC.inputEl===inputEl && ACTIVE_AC.panel) ? ACTIVE_AC.panel.querySelectorAll('.ac-item') : [];
    if(e.key==='ArrowDown'){ e.preventDefault(); hiIdx=Math.min(hiIdx+1, rows.length-1); rows.forEach((r,i)=>r.classList.toggle('hi', i===hiIdx)); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); hiIdx=Math.max(hiIdx-1,0); rows.forEach((r,i)=>r.classList.toggle('hi', i===hiIdx)); }
    else if(e.key==='Enter'){
      if(hiIdx>=0 && rows[hiIdx]){
        e.preventDefault();
        const row = rows[hiIdx];
        if(row.dataset.create){ const q = inputEl.value.trim(); close(); onCreateNew && onCreateNew(q); }
        else if(items[+row.dataset.i]){ onSelect(items[+row.dataset.i]); close(); }
      }
    }
    else if(e.key==='Escape'){ close(); }
  });
}

/* Autosave draft */
function scheduleAutosave(){
  clearTimeout(SAVE_TIMER);
  SAVE_TIMER = setTimeout(async ()=>{
    if(!CURRENT_INVOICE || CURRENT_INVOICE._readonly) return;
    const _dr={...CURRENT_INVOICE}; const _pf=_dr._pendingFiles||{}; delete _dr._pendingFiles; delete _dr._removedAtt; if(Array.isArray(_dr.attachments)) _dr.attachments=_dr.attachments.filter(a=>!_pf[a.id]);
    await storeSet(K_DRAFT, {..._dr, _savedAt:new Date().toLocaleTimeString('en-IN')});
    const el = document.getElementById('draft-status');
    if(el && !CURRENT_INVOICE.id) el.textContent = 'Draft saved · ' + new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  }, 900);
}

function validateInvoice(inv){
  if(!inv.customerId && !inv.customerName) return 'Please select or create a customer.';
  if(!inv.date) return 'Invoice date is required.';
  if(!inv.number || !inv.number.trim()) return 'Invoice number is required.';
  if(isNumberTaken(inv.number, inv.id)) return `Invoice number ${inv.number} is already used by another invoice.`;
  if(!inv.items.length || inv.items.every(i=>!i.name)) return 'Add at least one product to the invoice.';
  for(const it of inv.items){
    if(it.name && (!it.qty || it.qty<=0)) return `Quantity must be greater than 0 for "${it.name}".`;
    if(it.name && it.rate<0) return `Rate cannot be negative for "${it.name}".`;
  }
  return null;
}


/* ---- Sales-invoice bill attachments (PDF / image) — same approach as purchase-bill attachments.
   The invoice record only keeps tiny metadata (inv.attachments = [{id,name,type,size,thumb}]).
   The file itself lives under a separate root 'invoice_files/<invoiceId>/<attId>' so the invoice
   list stays light and fast. Images are shrunk before saving; PDFs are stored as-is. ---- */
const IA_MAX_FILES = 5;
const IA_MAX_PDF_BYTES = 4*1024*1024;
function iaFmtBytes(n){ n=n||0; return n>=1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(n/1024))+' KB'; }
function iaReadDataURL(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error('Could not read the file.')); r.readAsDataURL(blob); }); }
function iaShrinkImage(file, maxDim, quality){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const sc = Math.min(1, maxDim/Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      const ctx = c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('That image could not be opened.')); };
    img.src = url;
  });
}
async function iaAdd(inv, file){
  if(!Array.isArray(inv.attachments)) inv.attachments = [];
  if(!inv._pendingFiles) inv._pendingFiles = {};
  if(inv.attachments.length >= IA_MAX_FILES) throw new Error('You can attach up to '+IA_MAX_FILES+' files per invoice.');
  const isPdf = file.type==='application/pdf' || /\.pdf$/i.test(file.name||'');
  const isImg = /^image\//.test(file.type||'');
  if(!isPdf && !isImg) throw new Error('Only PDF or image files can be attached.');
  let data, type, thumb='';
  if(isPdf){
    if(file.size > IA_MAX_PDF_BYTES) throw new Error('That PDF is over '+iaFmtBytes(IA_MAX_PDF_BYTES)+' — compress it or attach a smaller scan.');
    data = await iaReadDataURL(file); type = 'application/pdf';
  } else {
    data = await iaShrinkImage(file, 1800, 0.78); type = 'image/jpeg';
    try{ thumb = await iaShrinkImage(file, 96, 0.6); }catch(e){}
  }
  const id = uid('att_');
  inv.attachments.push({ id, name:file.name||('bill'+(isPdf?'.pdf':'.jpg')), type, size: Math.round(data.length*0.75), thumb, addedAt: nowISO() });
  inv._pendingFiles[id] = data;
}
async function iaGetData(inv, att){
  if(inv._pendingFiles && inv._pendingFiles[att.id]) return inv._pendingFiles[att.id];
  const snap = await RTDB_ROOT.child('invoice_files').child(inv.id).child(att.id).get();
  return snap.exists() ? (snap.val().data||null) : null;
}
async function iaOpen(invOrId, attId){
  const inv = typeof invOrId==='string' ? DB.invoices.find(x=>x.id===invOrId) : invOrId;
  const att = inv && (inv.attachments||[]).find(a=>a.id===attId);
  if(!att) return;
  const win = window.open('', '_blank'); // open synchronously so the popup isn't blocked
  try{
    const data = await iaGetData(inv, att);
    if(!data) throw new Error('File not found — it may not have finished uploading.');
    const blob = await (await fetch(data)).blob();
    const url = URL.createObjectURL(blob);
    if(win) win.location.href = url; else window.location.href = url;
    setTimeout(()=>URL.revokeObjectURL(url), 5*60*1000);
  }catch(e){
    if(win) win.close();
    toast(e.message||'Could not open the file.', 'err');
  }
}
async function iaSave(inv){
  // Called right before the invoice itself is saved: uploads new files, deletes removed ones.
  const pend = inv._pendingFiles || {};
  for(const id of Object.keys(pend)){
    if(!(inv.attachments||[]).some(a=>a.id===id)) continue;
    await RTDB_ROOT.child('invoice_files').child(inv.id).child(id).set({ data: pend[id] });
  }
  for(const id of (inv._removedAtt||[])){
    try{ await RTDB_ROOT.child('invoice_files').child(inv.id).child(id).remove(); }catch(e){}
  }
}
function iaRemoveAll(id){ try{ RTDB_ROOT.child('invoice_files').child(id).remove(); }catch(e){} }
/* Sales-invoice bill attachments are switched off for now (kept in Purchase bills). Set to true to bring this card back. */
const IA_CARD_ENABLED = false;
function iaCardHTML(inv, readonly){
  if(!IA_CARD_ENABLED || inv.referenceOnly) return '';
  const list = inv.attachments||[];
  return `
  <div class="card" style="margin-bottom:16px;">
    <div class="card-hd"><div><h3>${icon('paperclip')} Bill Attachments</h3><div class="sub">PDF or photo of the bill, kept with this invoice (${list.length}/${IA_MAX_FILES})</div></div></div>
    <div class="card-bd">
      ${readonly ? '' : `
      <div class="att-drop" id="ia-drop">${icon('upload')} <b>Attach PDF or image</b> — click to choose, or drag &amp; drop here
        <input type="file" id="ia-input" accept="image/*,.pdf,application/pdf" multiple style="display:none;">
      </div>`}
      <div class="att-list" id="ia-list">
        ${list.length ? list.map(a=>`
        <div class="att-item">
          <div class="att-thumb">${a.thumb ? `<img src="${a.thumb}" alt="">` : icon('file')}</div>
          <div class="att-meta"><div class="att-name" title="${esc(a.name)}">${esc(a.name)}</div><div class="att-sub">${a.type==='application/pdf'?'PDF':'Image'} · ${iaFmtBytes(a.size)}${(inv._pendingFiles&&inv._pendingFiles[a.id])?' · not saved yet':''}</div></div>
          <button type="button" class="btn btn-sm" data-ia-view="${a.id}">${icon('eye')} View</button>
          ${readonly ? '' : `<button type="button" class="btn btn-ghost btn-sm btn-icon danger" data-ia-del="${a.id}" title="Remove">${icon('trash')}</button>`}
        </div>`).join('') : `<div class="muted" style="font-size:12.5px;">${readonly?'No files attached to this invoice.':'No files attached yet.'}</div>`}
      </div>
    </div>
  </div>`;
}
function iaWire(inv, readonly){
  if(!inv || inv.referenceOnly) return;
  document.querySelectorAll('[data-ia-view]').forEach(b=>b.addEventListener('click', ()=>iaOpen(inv, b.dataset.iaView)));
  if(readonly) return;
  document.querySelectorAll('[data-ia-del]').forEach(b=>b.addEventListener('click', ()=>{
    const id = b.dataset.iaDel;
    inv.attachments = (inv.attachments||[]).filter(a=>a.id!==id);
    if(inv._pendingFiles) delete inv._pendingFiles[id];
    if(inv.id){ (inv._removedAtt = inv._removedAtt||[]).push(id); }
    render();
  }));
  const drop = document.getElementById('ia-drop'), inp = document.getElementById('ia-input');
  if(!drop || !inp) return;
  const handle = async (files)=>{
    for(const f of files){
      try{ await iaAdd(inv, f); }
      catch(e){ toast(e.message||'Could not attach that file.', 'err'); }
    }
    render();
  };
  drop.addEventListener('click', e=>{ if(e.target!==inp) inp.click(); });
  inp.addEventListener('change', ()=>{ const fs=[...inp.files]; inp.value=''; if(fs.length) handle(fs); });
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e=>{ const fs=[...(e.dataTransfer&&e.dataTransfer.files||[])]; if(fs.length) handle(fs); });
}

async function saveInvoice(){
  const inv = CURRENT_INVOICE;
  const err = validateInvoice(inv);
  if(err){ toast(err, 'err'); return false; }
  inv.items = inv.items.filter(i=>i.name); // drop empty rows
  inv.totals = Calc.compute(inv);
  inv.customerStateCode = inv.customerStateCode || '';
  inv.companyStateCode = DB.settings.stateCode;
  // Freeze company info at time of invoicing — EXCEPT the logo image, which is left out so we
  // don't re-store a full copy of the (often large) base64 logo inside every single invoice.
  // The logo is instead always pulled from current settings when the invoice is displayed.
  const snapshot = slimCompanySnapshot(DB.settings);
  inv.companySnapshot = snapshot;

  const isNew = !inv.id;
  if(isNew){
    inv.id = uid('inv_');
    inv.createdAt = nowISO();
    inv.status = inv.status || 'draft';
    if(inv.autoNumber!==false){
      // Number wasn't hand-typed — reserve the real number atomically now, at the moment of
      // saving, instead of trusting the placeholder shown when the form was opened.
      try{
        const claimed = await claimInvoiceNumber();
        inv.number = claimed.number;
      }catch(e){
        toast(e.message || 'Could not reserve an invoice number — check your internet connection and try again.', 'err');
        inv.id = null;
        return false;
      }
    } else if(isNumberTaken(inv.number, inv.id)){
      toast(`Invoice number ${inv.number} is already used by another invoice.`, 'err');
      inv.id = null;
      return false;
    }
    delete inv.autoNumber;
    DB.invoices.push(inv);
  } else {
    const idx = DB.invoices.findIndex(x=>x.id===inv.id);
    DB.invoices[idx] = inv;
  }
  inv.updatedAt = nowISO();
  // Attachment files go to their own node; keep only light metadata on the invoice itself.
  try{ await iaSave(inv); }
  catch(e){
    console.error('attachment upload failed', e);
    if(isNew){ DB.invoices = DB.invoices.filter(x=>x.id!==inv.id); inv.id=null; }
    toast('Could not upload the attached file — check your connection (or try a smaller file) and save again.', 'err');
    return false;
  }
  delete inv._pendingFiles; delete inv._removedAtt;
  const ok = await invoiceSet(inv.id, inv);
  if(ok===false){
    // roll back so a failed save doesn't leave phantom local-only state
    if(isNew){ DB.invoices = DB.invoices.filter(x=>x.id!==inv.id); inv.id=null; }
    toast('Could not save the invoice — check your internet connection and try again.', 'err');
    return false;
  }
  storeSet(K_DRAFT, null).catch(()=>{});
  _xlRebuildAndWrite(); // keeps TOTAL SELL in sync whether this is a new invoice or an edit
  toast('Invoice saved', 'ok');
  goto('invoices');
  return true;
}

function duplicateInvoice(id){
  const src = DB.invoices.find(i=>i.id===id); if(!src) return;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = null; copy.status='draft'; copy.date = todayInputDate(); copy.dueDate='';
  copy.attachments = []; delete copy._pendingFiles; delete copy._removedAtt;
  copy.number = peekNextInvoiceNumber().number;
  copy.autoNumber = true;
  copy.createdAt=null; copy.updatedAt=null;
  copy.items.forEach(it=>{ it.rowId = uid('r_'); });
  CURRENT_INVOICE = copy;
  goto('newInvoice', {keepDraft:true});
  toast('Duplicated — review and save to assign the new invoice number', 'ok');
}

/* Toggles an invoice between "paid" (money received) and its previous status with one click,
   so the Amount Received stat card and per-row button reflect exactly who has actually paid. */
async function toggleInvoiceSent(id){
  const inv = DB.invoices.find(x=>x.id===id);
  if(!inv) return;
  inv.sentToVendor = !inv.sentToVendor;
  inv.sentAt = inv.sentToVendor ? todayInputDate() : null;
  inv.updatedAt = nowISO();
  render();
  const ok = await invoiceSet(inv.id, inv);
  if(!ok) toast('Could not save — check your connection and try again.', 'err');
  else toast(inv.sentToVendor ? 'Marked as sent to vendor' : 'Marked as not sent', 'ok');
}
async function toggleInvoicePaid(id){
  const inv = DB.invoices.find(x=>x.id===id);
  if(!inv) return;
  const total = round2((inv.totals||Calc.compute(inv)).grandTotal||0);
  if(inv.status==='paid'){
    inv.status = inv._prevStatus || 'draft';
    delete inv._prevStatus;
    // Undo full settlement — pull the auto "full settlement" entry it left behind, if any,
    // rather than wiping out any real partial payments the customer had already made.
    if(!Array.isArray(inv.paymentHistory)) inv.paymentHistory = [];
    const autoIdx = inv.paymentHistory.findIndex(h=>h.auto);
    if(autoIdx>-1){ inv.amountPaid = round2(Math.max(0,(inv.amountPaid||0) - inv.paymentHistory[autoIdx].amount)); inv.paymentHistory.splice(autoIdx,1); }
    else inv.amountPaid = 0;
  } else {
    inv._prevStatus = inv.status || 'draft';
    inv.status = 'paid';
    const remaining = round2(total - (inv.amountPaid||0));
    if(remaining>0){
      if(!Array.isArray(inv.paymentHistory)) inv.paymentHistory = [];
      inv.paymentHistory.push({id:uid('pay_'), date:todayInputDate(), amount:remaining, mode:'Other', note:'Marked fully received', recordedAt:nowISO(), auto:true});
      inv.amountPaid = total;
    }
  }
  inv.updatedAt = nowISO();
  render();
  const ok = await invoiceSet(inv.id, inv);
  if(!ok) toast('Could not save — check your connection and try again.', 'err');
  else { toast(inv.status==='paid' ? 'Marked as received' : 'Marked as not received', 'ok'); _xlRebuildAndWrite(); }
}

function validatePurchase(p){
  if(!p.supplierId && !p.supplierName) return 'Please select or create a supplier.';
  if(!p.date) return 'Purchase bill date is required.';
  if(p.amount!==undefined){
    if(!p.amount || p.amount<=0) return 'Purchase amount must be greater than 0.';
  } else if(!p.items || !p.items.length || p.items.every(i=>!i.name)){
    return 'Add at least one item to the purchase bill.';
  }
  return null;
}

async function savePurchase(){
  const p = CURRENT_PURCHASE;
  const err = validatePurchase(p);
  if(err){ toast(err, 'err'); return false; }
  if(Array.isArray(p.items)) p.items = p.items.filter(i=>i.name);
  p.totals = computePurchaseTotals(p);
  p.supplierStateCode = p.supplierStateCode || '';
  p.companyStateCode = DB.settings.stateCode;

  const isNew = !p.id;
  if(isNew){
    p.id = uid('pur_');
    p.createdAt = nowISO();
    p.status = p.status || 'draft';
    DB.purchases.push(p);
  } else {
    const idx = DB.purchases.findIndex(x=>x.id===p.id);
    DB.purchases[idx] = p;
  }
  p.updatedAt = nowISO();
  // Attachment files go to their own node; keep only light metadata on the bill itself.
  const pendingFiles = p._pendingFiles, removedAtt = p._removedAtt;
  try{ await savePurchaseAttachments(p); }
  catch(e){
    console.error('attachment upload failed', e);
    if(isNew){ DB.purchases = DB.purchases.filter(x=>x.id!==p.id); p.id=null; }
    toast('Could not upload the attached file — check your connection (or try a smaller file) and save again.', 'err');
    return false;
  }
  delete p._pendingFiles; delete p._removedAtt;
  const ok = await purchaseSet(p.id, p);
  if(ok===false){
    if(isNew){ DB.purchases = DB.purchases.filter(x=>x.id!==p.id); p.id=null; }
    toast('Could not save the purchase bill — check your internet connection and try again.', 'err');
    return false;
  }
  _xlRebuildAndWrite(); // keeps TOTAL PURCHASE in sync whether this is a new bill or an edit
  toast('Purchase bill saved', 'ok');
  goto('purchases');
  return true;
}

function duplicatePurchase(id){
  const src = DB.purchases.find(p=>p.id===id); if(!src) return;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = null; copy.status='draft'; copy.date = todayInputDate();
  copy.createdAt=null; copy.updatedAt=null;
  copy.attachments = []; delete copy._pendingFiles; delete copy._removedAtt;
  if(Array.isArray(copy.items)) copy.items.forEach(it=>{ it.rowId = uid('pr_'); });
  CURRENT_PURCHASE = copy;
  goto('newPurchase', {keepDraft:true});
  toast('Duplicated — review and save', 'ok');
}

function deletePurchase(id){
  if(!confirm('Permanently delete this purchase bill? This cannot be undone.')) return;
  DB.purchases = DB.purchases.filter(p=>p.id!==id);
  purchaseRemove(id);
  try{ RTDB_ROOT.child('purchase_files').child(id).remove(); }catch(e){}
  render();
  toast('Purchase bill deleted','ok');
  _xlRebuildAndWrite();
}

/* Toggles a purchase bill between "paid" and its previous status with one click, so the
   Paid stat card and per-row button reflect exactly which suppliers you've settled up with. */
async function togglePurchasePaid(id){
  const p = DB.purchases.find(x=>x.id===id);
  if(!p) return;
  const total = round2((p.totals||computePurchaseTotals(p)).grandTotal||0);
  if(p.status==='paid'){
    p.status = p._prevStatus || 'draft';
    delete p._prevStatus;
    if(!Array.isArray(p.paymentHistory)) p.paymentHistory = [];
    const autoIdx = p.paymentHistory.findIndex(h=>h.auto);
    if(autoIdx>-1){ p.amountPaid = round2(Math.max(0,(p.amountPaid||0) - p.paymentHistory[autoIdx].amount)); p.paymentHistory.splice(autoIdx,1); }
    else p.amountPaid = 0;
  } else {
    p._prevStatus = p.status || 'draft';
    p.status = 'paid';
    const remaining = round2(total - (p.amountPaid||0));
    if(remaining>0){
      if(!Array.isArray(p.paymentHistory)) p.paymentHistory = [];
      p.paymentHistory.push({id:uid('pay_'), date:todayInputDate(), amount:remaining, mode:'Other', note:'Marked fully paid', recordedAt:nowISO(), auto:true});
      p.amountPaid = total;
    }
  }
  p.updatedAt = nowISO();
  render();
  const ok = await purchaseSet(p.id, p);
  if(!ok) toast('Could not save — check your connection and try again.', 'err');
  else { toast(p.status==='paid' ? 'Marked as paid' : 'Marked as unpaid', 'ok'); _xlRebuildAndWrite(); }
}

const PUR_COLLAPSED = new Set();    // month keys currently collapsed
function purMonthKey(p){
  const m = String(p.date||'').match(/^(\d{4})-(\d{2})/);
  if(m) return m[1]+'-'+m[2];
  const d = new Date(p.date);
  if(isNaN(d)) return 'nodate';
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function purMonthLabel(k){
  if(k==='nodate') return 'No date';
  const [y,m] = k.split('-');
  return new Date(parseInt(y,10), parseInt(m,10)-1, 1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});
}
// Turns the flat sorted purchase rows into rows + month divider entries
function purBuildItems(rows){
  if(!PUR_GROUP) return rows;
  const groups = new Map();
  rows.forEach(p=>{ const k=purMonthKey(p); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(p); });
  const asc = (PUR_SORT==='oldest');
  const keys = [...groups.keys()].sort((a,b)=>{
    if(a==='nodate') return 1; if(b==='nodate') return -1;
    return asc ? a.localeCompare(b) : b.localeCompare(a);
  });
  const out = [];
  keys.forEach(k=>{
    const list = groups.get(k);
    const grand = list.reduce((x,p)=>x+((p.totals||computePurchaseTotals(p)).grandTotal||0),0);
    const unpaid = list.reduce((x,p)=>x+purBalance(p),0);
    const collapsed = PUR_COLLAPSED.has(k);
    out.push({__hdr:true, key:k, label:purMonthLabel(k), count:list.length, grand, outstanding:unpaid, collapsed});
    if(!collapsed) list.forEach(p=>out.push(p));
  });
  return out;
}

/* ---- Monthly purchase-bill export for the CA ----
   Builds ONE pdf of every attached bill file (PDFs merged as-is, photos placed on A4 pages)
   for bills dated within the chosen month, in date order. ---- */
function purchasesForMonthRange(from, to){
  if(!from) return [];
  if(!to) to = from;
  if(to < from){ const t=from; from=to; to=t; }
  return DB.purchases
    .filter(p=>{ const m=String(p.date||'').slice(0,7); return m>=from && m<=to; })
    .sort((a,b)=> String(a.date).localeCompare(String(b.date)) || String(a.supplierInvoiceNumber||'').localeCompare(String(b.supplierInvoiceNumber||'')));
}
function monthValueLabel(v, long){
  const [y,m] = v.split('-');
  return new Date(parseInt(y,10), parseInt(m,10)-1, 1).toLocaleDateString('en-IN', {month: long?'long':'short', year:'numeric'});
}
function purCaCountLabel(from, to){
  if(!from) return '';
  const rows = purchasesForMonthRange(from, to||from);
  const lo = (to && to<from) ? to : from, hi = (to && to>from) ? to : from;
  const range = lo===hi ? monthValueLabel(lo,true) : monthValueLabel(lo)+' – '+monthValueLabel(hi);
  if(!rows.length) return 'No purchase bills in '+range;
  const withFiles = rows.filter(p=>(p.attachments||[]).length).length;
  return `${rows.length} bill${rows.length===1?'':'s'} in ${range} · ${withFiles} with file${withFiles===1?'':'s'}`;
}
function dataUrlToBytes(dataUrl){
  const b64 = String(dataUrl).split(',')[1] || '';
  const bin = atob(b64); const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function generateMonthlyPurchasesPDF(from, to, onProgress){
  if(!window.PDFLib) throw new Error('PDF merge library did not load — check your internet connection.');
  const { PDFDocument } = window.PDFLib;
  if(to && to<from){ const t=from; from=to; to=t; }
  const rows = purchasesForMonthRange(from, to||from);
  if(!rows.length) return {count:0};

  const body = await PDFDocument.create();
  const W=595.28, H=841.89, M=24;
  const meta = [];
  for(let i=0;i<rows.length;i++){
    if(onProgress) onProgress(i+1, rows.length);
    const p = rows[i];
    const m = {start: body.getPageCount(), added:0, failed:0};
    for(const att of (p.attachments||[])){
      try{
        const data = await getAttachmentData(p, att);
        if(!data) throw new Error('missing');
        const bytes = dataUrlToBytes(data);
        if(att.type==='application/pdf'){
          const src = await PDFDocument.load(bytes, {ignoreEncryption:true});
          const pgs = await body.copyPages(src, src.getPageIndices());
          pgs.forEach(pg=>body.addPage(pg)); m.added += pgs.length;
        } else {
          const img = /png/i.test(att.type) ? await body.embedPng(bytes) : await body.embedJpg(bytes);
          const sc = Math.min((W-2*M)/img.width, (H-2*M)/img.height);
          const w = img.width*sc, h = img.height*sc;
          const pg = body.addPage([W,H]);
          pg.drawImage(img, {x:(W-w)/2, y:H-M-h, width:w, height:h}); m.added += 1;
        }
      }catch(e){ console.warn('purchase file skipped', p.id, att && att.name, e); m.failed++; }
    }
    meta.push(m);
  }

  const periodLabel = (from===(to||from)) ? monthValueLabel(from,true) : monthValueLabel(from)+' to '+monthValueLabel(to);
  if(!body.getPageCount()) return {count: rows.length, withFiles: 0, missing: rows.length, filename: null, empty: true};
  const bytes = await body.save();
  const filename = `Purchase_Bills_${periodLabel.replace(/\s+/g,'_')}_${safeFilename(DB.settings.companyName||'Company')}.pdf`;
  const url = URL.createObjectURL(new Blob([bytes], {type:'application/pdf'}));
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
  return {count: rows.length, withFiles: meta.filter(m=>m.added).length, missing: meta.filter(m=>!m.added).length, filename};
}

function wirePurchases(){

  });
  document.querySelectorAll('[data-pmgrp]').forEach(r=>r.addEventListener('click', ()=>{
    const k = r.dataset.pmgrp;
    if(PUR_COLLAPSED.has(k)) PUR_COLLAPSED.delete(k); else PUR_COLLAPSED.add(k);

  document.getElementById('pca-from').addEventListener('change', e=>{ PUR_CA_FROM=e.target.value; PUR_CA_TO=PUR_CA_FROM; render(); });
  document.getElementById('pca-download').addEventListener('click', async ()=>{
