<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<!-- Billing Panel: local data layer (replaces Firebase for now) + workspace gate -->
<style>
html.ws-gate body > *:not(#ws-picker){display:none !important;}
#ws-picker{--ink:#e8ecf6;--mute:#8d97b5;--line:rgba(255,255,255,.09);position:fixed;inset:0;z-index:99999;overflow:auto;display:flex;flex-direction:column;box-sizing:border-box;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 500px at 12% -10%,rgba(99,102,241,.28),transparent 60%),radial-gradient(800px 500px at 95% 0%,rgba(20,184,166,.22),transparent 60%),radial-gradient(700px 400px at 50% 120%,rgba(99,102,241,.16),transparent 60%),#080c1a;}
#ws-picker *{box-sizing:border-box;}
#ws-picker::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%);}
#ws-picker button{font-family:inherit;}
#ws-picker .wp-top{position:relative;display:flex;align-items:center;justify-content:space-between;padding:22px 34px;}
#ws-picker .wp-mark{display:flex;align-items:center;gap:12px;}
#ws-picker .wp-logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#6366f1,#14b8a6);display:grid;place-items:center;box-shadow:0 8px 24px rgba(99,102,241,.4);}
#ws-picker .wp-mark b{font-size:15px;letter-spacing:.2px;display:block;}
#ws-picker .wp-mark small{font-size:10.5px;color:var(--mute);letter-spacing:1.2px;text-transform:uppercase;}
#ws-picker .wp-clock{text-align:right;}
#ws-picker .wp-clock b{font-size:22px;font-weight:700;letter-spacing:-.5px;display:block;font-variant-numeric:tabular-nums;}
#ws-picker .wp-clock small{font-size:12px;color:var(--mute);}
#ws-picker .wp-main{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 24px 30px;gap:38px;}
#ws-picker .wp-hero{text-align:center;}
#ws-picker .wp-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:#a5b4fc;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.3);padding:6px 14px;border-radius:99px;}
#ws-picker .wp-eyebrow i{width:6px;height:6px;border-radius:50%;background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.2);}
#ws-picker .wp-hero h1{margin:18px 0 10px;font-size:clamp(30px,4.6vw,48px);font-weight:800;letter-spacing:-1.4px;line-height:1.08;background:linear-gradient(180deg,#fff,#aeb8d6);-webkit-background-clip:text;background-clip:text;color:transparent;}
#ws-picker .wp-hero p{margin:0;color:var(--mute);font-size:15px;}
#ws-picker .wp-cards{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;}
#ws-picker .wp-card{--ac:#6366f1;position:relative;width:340px;max-width:100%;text-align:left;cursor:pointer;color:inherit;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:22px;padding:28px;overflow:hidden;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:none;transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,box-shadow .25s;}
#ws-picker .wp-card.gears{--ac:#f59e0b;}
#ws-picker .wp-card::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 220px at 100% 0%,color-mix(in srgb,var(--ac) 30%,transparent),transparent 70%);opacity:.55;transition:opacity .25s;pointer-events:none;}
#ws-picker .wp-card:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--ac) 65%,transparent);box-shadow:0 26px 60px rgba(0,0,0,.5),0 0 0 1px color-mix(in srgb,var(--ac) 35%,transparent);}
#ws-picker .wp-card:hover::before{opacity:1;}
#ws-picker .wp-card:focus-visible{outline:2px solid var(--ac);outline-offset:3px;}
#ws-picker .wp-card>*{position:relative;}
#ws-picker .wp-row{display:flex;align-items:flex-start;justify-content:space-between;}
#ws-picker .wp-ic{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#000));box-shadow:0 10px 26px color-mix(in srgb,var(--ac) 45%,transparent);}
#ws-picker .wp-badge{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#fff;background:color-mix(in srgb,var(--ac) 35%,transparent);border:1px solid color-mix(in srgb,var(--ac) 60%,transparent);padding:4px 10px;border-radius:99px;display:none;}
#ws-picker .wp-badge.show{display:inline-block;}
#ws-picker .wp-card h2{margin:22px 0 6px;font-size:22px;font-weight:700;letter-spacing:-.4px;}
#ws-picker .wp-desc{margin:0;color:var(--mute);font-size:13.5px;line-height:1.55;}
#ws-picker .wp-chips{display:flex;flex-wrap:wrap;gap:7px;margin:18px 0 22px;}
#ws-picker .wp-chips span{font-size:11.5px;font-weight:500;color:#cdd5ea;background:rgba(255,255,255,.06);border:1px solid var(--line);padding:5px 11px;border-radius:8px;}
#ws-picker .wp-cta{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:18px;font-weight:600;font-size:14px;}
#ws-picker .wp-go{display:flex;align-items:center;gap:8px;color:#fff;}
#ws-picker .wp-go svg{transition:transform .2s;}
#ws-picker .wp-card:hover .wp-go svg{transform:translateX(5px);}
#ws-picker kbd{font:600 11px Inter,sans-serif;color:var(--mute);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:2px 8px;background:rgba(255,255,255,.04);}
#ws-picker .wp-foot{position:relative;display:flex;gap:26px;flex-wrap:wrap;justify-content:center;padding:18px 24px 26px;color:var(--mute);font-size:12px;border-top:1px solid var(--line);}
#ws-picker .wp-foot span{display:flex;align-items:center;gap:7px;}
@media(max-width:640px){#ws-picker .wp-top{padding:16px 18px;}#ws-picker .wp-clock b{font-size:18px;}#ws-picker .wp-card{padding:22px;}}
@keyframes wprise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#ws-picker .wp-hero,#ws-picker .wp-card{animation:wprise .6s cubic-bezier(.2,.8,.2,1) both;}
#ws-picker .wp-card:nth-child(1){animation-delay:.1s}#ws-picker .wp-card:nth-child(2){animation-delay:.2s}
</style>
<script>
  /* ---------- Workspaces ---------- */
  const WORKSPACES = { 'sk-gears':'S.K GEARS', 'sk-enterprises':'S.K ENTERPRISES' };
  let WS_ID = null;
  try{ WS_ID = sessionStorage.getItem('bp_workspace'); }catch(e){}
  if(!WORKSPACES[WS_ID]) WS_ID = null;
  const WS_NAME = WS_ID ? WORKSPACES[WS_ID] : '';
  const WS_KEY = WS_ID || 'none';
  if(!WS_ID) document.documentElement.classList.add('ws-gate');
  function bpPickWorkspace(id){ try{ sessionStorage.setItem('bp_workspace', id); localStorage.setItem('bp_last_workspace', id); }catch(e){} location.reload(); }
  function bpSwitchWorkspace(){ try{ sessionStorage.removeItem('bp_workspace'); }catch(e){} location.reload(); }
  window.addEventListener('DOMContentLoaded', function(){
    if(WS_ID){
      var bs = document.getElementById('brand-sub'); if(bs) bs.textContent = WS_NAME;
      document.body.classList.add('has-bar');
      var seg = document.getElementById('bp-seg');
      seg.innerHTML = Object.keys(WORKSPACES).map(function(k){ return '<button type="button" data-ws="'+k+'"'+(k===WS_ID?' class="on"':'')+'><span class="dot"></span>'+WORKSPACES[k]+'</button>'; }).join('');
      seg.addEventListener('click', function(e){ var b = e.target.closest('button[data-ws]'); if(b && b.dataset.ws!==WS_ID) bpPickWorkspace(b.dataset.ws); });
      document.getElementById('bp-home').addEventListener('click', bpSwitchWorkspace);
      document.title = 'Billing Panel — ' + WS_NAME;
      return;
    }
    var last = null; try{ last = localStorage.getItem('bp_last_workspace'); }catch(e){}
    var ICONS = { 'sk-enterprises': '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l9-5 9 5v12"/><path d="M7 21v-8h10v8"/><path d="M7 16.5h10M12 13v8"/></svg>', 'sk-gears': '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg>' };
    var CLS = { 'sk-enterprises':'ent', 'sk-gears':'gears' };
    var ARROW = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
    var CHIPS = ['GST Invoices','Products','Customers','Costing'];
    var keys = Object.keys(WORKSPACES);
    var d = document.createElement('div'); d.id = 'ws-picker';
    d.innerHTML =
      '<div class="wp-top"><div class="wp-mark"><div class="wp-logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="19" cy="17" r="2"/></svg></div><div><b>Billing Panel</b><small>Invoicing &amp; Inventory</small></div></div>'
      + '<div class="wp-clock"><b id="wp-clk">--:--</b><small id="wp-dt"></small></div></div>'
      + '<div class="wp-main"><div class="wp-hero"><span class="wp-eyebrow"><i></i>Select workplace</span><h1 id="wp-greet">Welcome back</h1><p>Choose a business to continue. Each workplace keeps its own data and settings.</p></div>'
      + '<div class="wp-cards">'
      + keys.map(function(k, i){
          return '<button type="button" class="wp-card '+CLS[k]+'" data-ws="'+k+'"><div class="wp-row"><div class="wp-ic">'+ICONS[k]+'</div><span class="wp-badge'+(last===k?' show':'')+'">Last used</span></div>'
            + '<h2>'+WORKSPACES[k]+'</h2><p class="wp-desc">GST tax invoices, product catalogue, customers, purchases and costing.</p>'
            + '<div class="wp-chips">'+CHIPS.map(function(c){ return '<span>'+c+'</span>'; }).join('')+'</div>'
            + '<div class="wp-cta"><span class="wp-go">Open workplace '+ARROW+'</span><kbd>'+(i+1)+'</kbd></div></button>';
        }).join('')
      + '</div></div>'
      + '<div class="wp-foot"><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Encrypted cloud storage</span>'
      + '<span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>Live sync across devices</span>'
      + '<span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>Separate data per business</span></div>';
    d.addEventListener('click', function(e){ var b = e.target.closest('button[data-ws]'); if(b) bpPickWorkspace(b.dataset.ws); });
    document.body.appendChild(d);
    function tick(){
      var t = new Date(), h = t.getHours();
      document.getElementById('wp-clk').textContent = t.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
      document.getElementById('wp-dt').textContent = t.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
      document.getElementById('wp-greet').textContent = (h<12?'Good morning':h<17?'Good afternoon':'Good evening');
    }
    tick(); setInterval(tick, 30000);
    document.addEventListener('keydown', function(e){
      if(e.ctrlKey||e.metaKey||e.altKey) return;
      var k = keys[parseInt(e.key,10)-1]; if(k) bpPickWorkspace(k);
    });
  });
</script>

<style>
:root{
  /* ---------- Brand ---------- */
  --brand-25:#F7F8FF; --brand-50:#EEF0FF; --brand-100:#E0E4FF; --brand-200:#C7CDFE;
  --brand-300:#A6AEFB; --brand-400:#8189F7; --brand-500:#6366F1; --brand-600:#4F46E5;
  --brand-700:#4338CA; --brand-800:#372FA8;

  /* ---------- Neutrals ---------- */
  --canvas:#F7F8FA; --canvas-2:#F1F3F7; --surface:#FFFFFF; --surface-2:#FAFBFD;
  --border:#E7E9EF; --border-2:#EEF0F4; --border-strong:#D8DCE5;
  --ink-900:#0F172A; --ink-800:#1D2839; --ink-700:#475467; --ink-600:#5C677D;
  --ink-500:#7C8698; --ink-400:#98A2B3; --ink-300:#CBD2DE;

  /* ---------- Semantic ---------- */
  --green-700:#067647; --green-600:#0E9F6E; --green-200:#A9EFC5; --green-50:#ECFDF3;
  --amber-700:#B54708; --amber-600:#C87309; --amber-200:#FEDF89; --amber-50:#FFFAEB;
  --red-700:#B42318;   --red-600:#D92D20;   --red-200:#FECDCA;   --red-50:#FEF3F2;
  --blue-700:#175CD3;  --blue-600:#2E90FA;  --blue-200:#B2DDFF;  --blue-50:#EFF8FF;
  --violet-700:#5925DC; --violet-200:#D9D6FE; --violet-50:#F4F3FF;
  --teal-700:#107569;  --teal-50:#F0FDF9;

  /* ---------- Radii ---------- */
  --r-xs:6px; --r-sm:8px; --r:10px; --r-md:12px; --r-lg:14px; --r-xl:18px; --r-pill:999px;
  --radius:10px;

  /* ---------- Elevation (soft) ---------- */
  --shadow-xs:0 1px 2px rgba(16,24,40,.05);
  --shadow-sm:0 1px 3px rgba(16,24,40,.05),0 1px 2px rgba(16,24,40,.04);
  --shadow-md:0 4px 14px rgba(16,24,40,.07),0 2px 5px rgba(16,24,40,.04);
  --shadow-lg:0 18px 44px rgba(16,24,40,.11),0 5px 12px rgba(16,24,40,.04);
  --ring:0 0 0 4px rgba(79,70,229,.14);

  /* ---------- Motion ---------- */
  --ease:cubic-bezier(.4,0,.2,1);
  --t-fast:.14s var(--ease); --t:.2s var(--ease);

  --sidebar-w:254px; --topbar-h:64px;

  /* ---------- Legacy aliases: inline styles and the invoice paper still read these ---------- */
  --navy-950:#0F172A; --navy-900:#16202F; --navy-800:#1D2839; --navy-700:#334155; --navy-600:#475467;
  --steel-500:#4F46E5; --steel-300:#A6AEFB;
  --paper:#F7F8FA; --paper-2:#F1F3F7; --white:#FFFFFF; --line:#E7E9EF;
}
/* ---- Expense entries (modern card – same family as the BN expense chart) ---- */
.exl-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);padding:22px 22px 8px;}
.exl-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
.exl-title{font-size:18px;font-weight:700;letter-spacing:-.02em;color:var(--ink-900);}
.exl-sub{font-size:12.5px;color:var(--ink-500);margin-top:3px;}
.exl-fy{display:inline-flex;align-items:center;background:var(--canvas-2);border-radius:var(--r-pill);padding:4px;}
.exl-fy span{padding:0 14px;font-weight:650;font-size:13px;color:var(--ink-800);}
.exl-fy button{width:30px;height:30px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow-xs);font-size:18px;line-height:1;color:var(--ink-700);cursor:pointer;}
.exl-fy button:hover{background:#4F46E5;color:#fff;}
.exl-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px;}
.exl-kpi{border:1px solid var(--border);border-radius:var(--r-md);padding:12px 16px;background:linear-gradient(180deg,var(--surface),var(--surface-2));}
.exl-kpi .l{font-size:11.5px;font-weight:600;color:var(--ink-500);text-transform:uppercase;letter-spacing:.05em;}
.exl-kpi .v{font-size:22px;font-weight:750;letter-spacing:-.02em;margin-top:4px;color:var(--ink-900);}
.exl-kpi .v.sm{font-size:15px;line-height:1.3;margin-top:8px;}
.exl-kpi .v small{display:block;font-size:12px;font-weight:600;color:var(--ink-500);}
.exl-bars{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;margin-bottom:14px;padding:10px 14px 8px;background:var(--surface-2);border:1px solid var(--border-2);border-radius:var(--r-md);}
.exl-bar{display:flex;flex-direction:column;align-items:center;min-width:0;border:0;background:transparent;padding:0;font-family:inherit;cursor:pointer;}
.exl-bar-val{font-size:10.5px;font-weight:650;color:var(--ink-600);height:14px;white-space:nowrap;}
.exl-bar-track{width:100%;max-width:30px;height:38px;display:flex;align-items:flex-end;margin:4px 0;}
.exl-bar-fill{width:100%;min-height:3px;border-radius:6px 6px 3px 3px;background:#C7CCFA;transition:height .25s var(--ease),background var(--t-fast);}
.exl-bar:hover .exl-bar-fill{background:#A6AEFB;}
.exl-bar.on .exl-bar-fill{background:#4F46E5;}
.exl-bar-lbl{font-size:11px;font-weight:600;color:var(--ink-500);}
.exl-bar.on .exl-bar-lbl{color:#4F46E5;}
.exl-filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;}
.exl-filters .search-field{flex:1 1 240px;max-width:340px;}
.exl-filters input[type=month],.exl-filters select{max-width:180px;height:38px;border-radius:10px;}
.exl-count{margin-left:auto;font-size:12px;font-weight:650;color:var(--ink-600);background:var(--canvas-2);padding:6px 12px;border-radius:var(--r-pill);}
.exl-scroll{overflow-x:auto;margin:0 -22px;padding:0 22px 14px;}
.exl-tbl{width:100%;min-width:780px;border-collapse:separate;border-spacing:0;}
.exl-tbl thead th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-500);text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);background:var(--surface);}
.exl-tbl thead th.right{text-align:right;}
.exl-tbl td{padding:9px 8px;border-bottom:1px solid var(--border-2);vertical-align:middle;}
.exl-row:hover td{background:var(--surface-2);}
.exl-mh td{padding:16px 8px 6px;border-bottom:0;}
.exl-mh td>div{display:flex;align-items:center;gap:10px;}
.exl-mn{font-size:13px;font-weight:750;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-900);}
.exl-mc{font-size:11.5px;font-weight:600;color:#4F46E5;background:#EEF0FF;padding:3px 10px;border-radius:var(--r-pill);}
.exl-ms{margin-left:auto;font-size:13px;font-weight:750;color:var(--ink-700);}
.exl-date{width:96px;}
.exl-date .d{font-size:19px;font-weight:750;line-height:1;letter-spacing:-.02em;color:var(--ink-900);}
.exl-date .m{font-size:11.5px;color:var(--ink-500);margin-top:3px;white-space:nowrap;}
.exl-date .m b{font-weight:650;color:var(--ink-700);}
.exl-cn{display:flex;align-items:center;gap:11px;}
.exl-chip{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:750;font-size:13px;flex:none;}
.exl-cn-t{font-weight:650;font-size:13px;letter-spacing:.01em;color:var(--ink-900);white-space:nowrap;}
.exl-ret{font-size:11px;font-weight:650;color:var(--green-700);background:var(--green-50);padding:3px 8px;border-radius:var(--r-pill);margin-left:6px;}
.exl-who{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13px;color:var(--ink-900);white-space:nowrap;}
.exl-av{width:28px;height:28px;border-radius:50%;background:#EEF0FF;color:#4F46E5;display:grid;place-items:center;font-size:11px;font-weight:750;flex:none;}
.exl-note{max-width:260px;font-size:13px;color:var(--ink-600);}
.exl-nil{color:var(--ink-300);}
.exl-amtc{min-width:128px;text-align:right;}
.exl-amt{font-size:13.5px;font-weight:750;color:var(--ink-900);white-space:nowrap;}
.exl-amt.neg{color:var(--green-700);}
.exl-share{height:4px;background:var(--canvas-2);border-radius:99px;margin-top:6px;overflow:hidden;}
.exl-share i{display:block;height:100%;border-radius:99px;}
.exl-act{display:inline-flex;gap:2px;opacity:0;transition:opacity var(--t-fast);}
.exl-row:hover .exl-act{opacity:1;}
@media (hover:none){.exl-act{opacity:.6;}}
.exl-act button{border:0;background:transparent;width:28px;height:28px;border-radius:8px;color:var(--ink-500);display:grid;place-items:center;cursor:pointer;}
.exl-act button:hover{background:var(--canvas-2);color:var(--ink-900);}
.exl-act button.danger:hover{background:var(--red-50);color:var(--red-600);}
.exl-act svg{width:14px;height:14px;}
.exl-tbl tfoot td{background:#16202F;color:#fff;font-weight:700;font-size:13px;text-align:right;padding:15px 10px;border:0;white-space:nowrap;}
.exl-tbl tfoot td.exl-fl{text-align:left;border-radius:12px 0 0 12px;padding-left:18px;letter-spacing:.04em;text-transform:uppercase;font-size:12px;}
.exl-tbl tfoot td.exl-fr{border-radius:0 12px 12px 0;}

.exl-pp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:12px 14px;border:1px solid var(--border-2);border-radius:var(--r-md);background:var(--surface-2);}
.exl-pp-t{font-size:13px;font-weight:700;color:var(--ink-900);margin-right:4px;}
.exl-pp select,.exl-pp input[type=month]{height:36px;border-radius:10px;max-width:220px;}
.exl-pp .grow{flex:1;}
.exl-pp label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink-500);}
.exl-pc{display:flex;align-items:center;gap:18px;flex-wrap:wrap;border:1px solid var(--border);border-radius:var(--r-md);padding:12px 16px;margin-bottom:16px;background:linear-gradient(180deg,var(--surface),var(--surface-2));}
.exl-pc-h{display:flex;align-items:center;gap:10px;min-width:170px;}
.exl-pc-n{font-weight:700;font-size:14px;color:var(--ink-900);}
.exl-pc-r{font-size:11.5px;color:var(--ink-500);}
.exl-pc-s{display:flex;gap:22px;flex-wrap:wrap;flex:1;}
.exl-pc-l{font-size:10.5px;font-weight:650;color:var(--ink-500);text-transform:uppercase;letter-spacing:.05em;}
.exl-pc-v{font-size:17px;font-weight:750;letter-spacing:-.02em;color:var(--ink-900);margin-top:2px;}
.exl-pc-v.main{color:#4F46E5;}
.exl-pc-a{display:flex;gap:6px;margin-left:auto;}
@media (max-width:680px){
  .exl-card{padding:16px 14px 6px;}
  .exl-scroll{margin:0 -14px;padding:0 14px 12px;}
  .exl-bars{gap:4px;padding:12px 8px 8px;}
  .exl-bar-val{display:none;}
  .exl-count{margin-left:0;}
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--canvas);
  color:var(--ink-900);
  font-size:14px;
  line-height:1.45;
  letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-variant-numeric:tabular-nums;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:13.5px;}
a{color:inherit;text-decoration:none;}
h1,h2,h3,h4{margin:0;letter-spacing:-.018em;}
svg{display:block;}
::selection{background:var(--brand-100);color:var(--brand-800);}
::-webkit-scrollbar{width:11px;height:11px;}
::-webkit-scrollbar-thumb{background:#D3D8E2;border-radius:99px;border:3px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:#BCC3D1;background-clip:content-box;}
::-webkit-scrollbar-track{background:transparent;}
:focus-visible{outline:2px solid var(--brand-600);outline-offset:2px;}

/* =======================================================================
   SHELL
   ======================================================================= */
#app-shell{display:flex;min-height:100vh;}

#sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;z-index:60;
}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px;}
.brand-mark{
  width:36px;height:36px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(145deg,var(--brand-500),var(--brand-700));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;letter-spacing:-.4px;
  box-shadow:0 3px 8px rgba(79,70,229,.28),inset 0 1px 0 rgba(255,255,255,.25);
}
.brand-text{min-width:0;}
.brand-name{font-weight:700;font-size:14.5px;color:var(--ink-900);letter-spacing:-.02em;line-height:1.2;}
.brand-sub{font-size:10.5px;color:var(--ink-500);margin-top:2px;letter-spacing:.34px;text-transform:uppercase;font-weight:600;}

.nav{padding:6px 12px 14px;flex:1;overflow-y:auto;}
.nav-section-label{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-400);
  padding:16px 10px 7px;font-weight:700;
}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r-sm);
  color:var(--ink-700);font-size:13.5px;font-weight:550;cursor:pointer;margin-bottom:2px;
  position:relative;transition:background var(--t-fast),color var(--t-fast);
  user-select:none;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;color:var(--ink-400);transition:color var(--t-fast);}
.nav-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav-item:hover{background:var(--canvas-2);color:var(--ink-900);}
.nav-item:hover svg{color:var(--ink-600);}
.nav-item.active{background:var(--brand-50);color:var(--brand-700);font-weight:650;}
.nav-item.active svg{color:var(--brand-600);}
.nav-item.active::before{
  content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);
  width:3px;height:19px;border-radius:0 3px 3px 0;background:var(--brand-600);
}
.nav-count{
  font-size:11px;font-weight:700;color:var(--ink-500);background:var(--canvas-2);
  border-radius:var(--r-pill);padding:1px 7px;min-width:22px;text-align:center;flex:none;
}
.nav-item.active .nav-count{background:#fff;color:var(--brand-700);}

.sidebar-foot{padding:12px;border-top:1px solid var(--border);}
.sync-card{
  display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--border-2);
}
.sync-card .sc-t{font-size:11.5px;font-weight:650;color:var(--ink-800);line-height:1.25;}
.sync-card .sc-s{font-size:10.5px;color:var(--ink-500);margin-top:1px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green-600);flex:none;
  box-shadow:0 0 0 3px rgba(14,159,110,.16);animation:pulseDot 2.4s var(--ease) infinite;}
.live-dot.off{background:var(--ink-400);box-shadow:0 0 0 3px rgba(124,134,152,.14);animation:none;}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 3px rgba(14,159,110,.16);}50%{box-shadow:0 0 0 5px rgba(14,159,110,.05);}}

#sidebar-scrim{
  position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:55;
  opacity:0;pointer-events:none;transition:opacity var(--t);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
#sidebar-scrim.show{opacity:1;pointer-events:auto;}

#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  min-height:var(--topbar-h);background:rgba(255,255,255,.86);
  -webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;padding:0 24px;
  position:sticky;top:0;z-index:40;
}
.topbar-burger{
  display:none;width:36px;height:36px;border-radius:var(--r-sm);border:1px solid var(--border);
  background:#fff;align-items:center;justify-content:center;color:var(--ink-700);flex:none;
}
.topbar-burger:hover{background:var(--canvas-2);}
.topbar-burger svg{width:18px;height:18px;}
.topbar-head{min-width:0;flex:none;}
.topbar-title{font-size:16px;font-weight:700;color:var(--ink-900);letter-spacing:-.022em;line-height:1.2;}
.topbar-sub{font-size:12px;color:var(--ink-500);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0;}
.topbar-actions{display:flex;align-items:center;gap:8px;}

.topbar-search{position:relative;width:300px;max-width:34vw;}
.topbar-search > svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-400);pointer-events:none;}
#topbar .topbar-search input{
  width:100%;height:38px;padding:0 58px 0 34px;border-radius:var(--r-sm);
  border:1px solid var(--border);background:var(--canvas);color:var(--ink-900);
  font-size:13px;transition:var(--t-fast);
}
#topbar .topbar-search input::placeholder{color:var(--ink-400);}
#topbar .topbar-search input:focus{background:#fff;border-color:var(--brand-300);box-shadow:var(--ring);outline:none;}
.kbd{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none;
  font-family:'Inter',sans-serif;font-size:10.5px;font-weight:650;color:var(--ink-400);
  border:1px solid var(--border);border-bottom-width:2px;background:#fff;border-radius:5px;padding:1px 5px;
}
.status-pill{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;flex:none;
  border-radius:var(--r-pill);background:var(--green-50);border:1px solid var(--green-200);
  font-size:11.5px;font-weight:650;color:var(--green-700);white-space:nowrap;
}
.status-pill.off{background:var(--canvas-2);border-color:var(--border);color:var(--ink-600);}

#content{padding:24px 28px 72px;flex:1;min-width:0;}
.page{max-width:1360px;margin:0 auto;}
.hidden{display:none !important;}
.stack{display:flex;flex-direction:column;gap:18px;}

/* =======================================================================
   BUTTONS
   ======================================================================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 15px;border-radius:var(--r-sm);
  border:1px solid var(--border-strong);background:#fff;color:var(--ink-800);
  font-size:13px;font-weight:600;letter-spacing:-.005em;white-space:nowrap;
  box-shadow:var(--shadow-xs);
  transition:background var(--t-fast),border-color var(--t-fast),box-shadow var(--t-fast),transform var(--t-fast),color var(--t-fast);
}
.btn:hover{background:var(--canvas-2);border-color:var(--ink-300);}
.btn:active{transform:translateY(.5px);box-shadow:none;}
.btn:focus-visible{box-shadow:var(--ring);outline:none;}
.btn svg{width:15px;height:15px;flex:none;}

.btn-primary{background:var(--brand-600);border-color:var(--brand-600);color:#fff;
  box-shadow:0 1px 2px rgba(16,24,40,.12),inset 0 1px 0 rgba(255,255,255,.14);}
.btn-primary:hover{background:var(--brand-700);border-color:var(--brand-700);}
.btn-amber{background:var(--amber-600);border-color:var(--amber-600);color:#fff;
  box-shadow:0 1px 2px rgba(16,24,40,.12),inset 0 1px 0 rgba(255,255,255,.16);}
.btn-amber:hover{background:var(--amber-700);border-color:var(--amber-700);}
.btn-green{background:var(--green-600);border-color:var(--green-600);color:#fff;
  box-shadow:0 1px 2px rgba(16,24,40,.12),inset 0 1px 0 rgba(255,255,255,.16);}
.btn-green:hover{background:var(--green-700);border-color:var(--green-700);}
.btn-paid-active{background:var(--green-50);border-color:var(--green-200);color:var(--green-700);font-weight:650;}
.btn-paid-active:hover{background:#DDF7E6;border-color:var(--green-200);}
.btn-sent-no{background:#fff;border-color:var(--amber-200);color:var(--amber-700);font-weight:600;}
.btn-sent-no:hover{background:var(--amber-50);border-color:var(--amber-600);}
.btn-sent-yes{background:var(--brand-50);border-color:var(--brand-200,#C7D2FE);color:var(--brand-700);font-weight:650;}
.btn-sent-yes:hover{background:#E0E7FF;}
.pay-cell{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;}
.btn-dark{background:var(--ink-900);border-color:var(--ink-900);color:#fff;}
.btn-dark:hover{background:#1B2537;border-color:#1B2537;}
.btn-danger{color:var(--red-700);border-color:var(--red-200);background:#fff;}
.btn-danger:hover{background:var(--red-50);border-color:#FCA5A1;}
.btn-ghost{border-color:transparent;background:transparent;box-shadow:none;color:var(--ink-700);}
.btn-ghost:hover{background:var(--canvas-2);border-color:transparent;color:var(--ink-900);}
.btn-soft{background:var(--brand-50);border-color:var(--brand-100);color:var(--brand-700);box-shadow:none;}
.btn-soft:hover{background:var(--brand-100);border-color:var(--brand-200);}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:var(--r-xs);}
.btn-sm svg{width:14px;height:14px;}
.btn-lg{padding:11px 19px;font-size:14px;border-radius:var(--r);}
.btn-icon{padding:0;width:32px;height:32px;flex:none;}
.btn-icon.btn-sm{width:29px;height:29px;}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;}
.btn-block{width:100%;}

.chk-col{width:38px;padding-left:16px !important;padding-right:4px !important;}
.tbl input.prod-chk{width:16px;height:16px;cursor:pointer;accent-color:var(--brand-600,#2563eb);vertical-align:middle;}
.tbl tr.row-selected td{background:var(--brand-50) !important;}
.sel-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;margin-bottom:10px;background:var(--brand-50);border:1px solid var(--brand-100,#dbeafe);border-radius:10px;font-size:13px;font-weight:600;color:var(--brand-700);}
.row-actions{display:inline-flex;align-items:center;gap:2px;justify-content:flex-end;}
.row-actions .btn-ghost{color:var(--ink-500);}
.row-actions .btn-ghost:hover{color:var(--brand-700);background:var(--brand-50);}
.row-actions .btn-ghost.danger:hover{color:var(--red-700);background:var(--red-50);}
.tbl tr .row-actions{opacity:.62;transition:opacity var(--t-fast);}
.tbl tr:hover .row-actions{opacity:1;}

/* =======================================================================
   SURFACES
   ======================================================================= */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-sm);}
.card-pad{padding:20px 22px;}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--border-2);}
.card-hd h3{font-size:14px;font-weight:680;color:var(--ink-900);letter-spacing:-.015em;}
.card-hd .sub{font-size:12px;color:var(--ink-500);margin-top:2px;font-weight:450;}
.card-bd{padding:18px 20px;}
.card-bd.flush{padding:0;}
.card-ft{padding:13px 20px;border-top:1px solid var(--border-2);background:var(--surface-2);
  border-radius:0 0 var(--r-md) var(--r-md);display:flex;align-items:center;justify-content:space-between;gap:12px;}
.section-title{font-size:13.5px;font-weight:680;letter-spacing:-.012em;color:var(--ink-900);margin:0 0 14px;text-transform:none;}
.overline{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-400);}

/* KPI cards */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(206px,1fr));gap:14px;margin-bottom:18px;}
.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  padding:16px 18px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
  transition:box-shadow var(--t),transform var(--t),border-color var(--t);
}
.stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);border-color:var(--border-strong);}
.stat-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.stat-label{font-size:12px;color:var(--ink-600);font-weight:600;letter-spacing:-.005em;text-transform:none;}
.stat-ico{width:32px;height:32px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex:none;}
.stat-ico svg{width:16px;height:16px;}
.stat-ico.i-brand{background:var(--brand-50);color:var(--brand-600);}
.stat-ico.i-green{background:var(--green-50);color:var(--green-600);}
.stat-ico.i-amber{background:var(--amber-50);color:var(--amber-600);}
.stat-ico.i-blue{background:var(--blue-50);color:var(--blue-600);}
.stat-ico.i-violet{background:var(--violet-50);color:var(--violet-700);}
.stat-ico.i-red{background:var(--red-50);color:var(--red-700);}
.stat-value{font-size:25px;font-weight:720;color:var(--ink-900);letter-spacing:-.03em;line-height:1.1;}
.stat-sub{font-size:11.5px;color:var(--ink-500);margin-top:6px;display:flex;align-items:center;gap:5px;}
.trend{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:var(--r-pill);}
.trend svg{width:11px;height:11px;}
.trend.up{background:var(--green-50);color:var(--green-700);}
.trend.down{background:var(--red-50);color:var(--red-700);}
.trend.flat{background:var(--canvas-2);color:var(--ink-600);}

/* =======================================================================
   TABLES
   ======================================================================= */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
.tbl th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.55px;color:var(--ink-500);
  padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);
  white-space:nowrap;font-weight:700;
}
.tbl.tbl-fit{width:100%;}
.tbl.tbl-fit th{padding:10px 10px;}
.tbl.tbl-fit td{padding:11px 10px;}
.tbl.tbl-fit th:first-child,.tbl.tbl-fit td:first-child{padding-left:16px;}
.tbl.tbl-fit th:last-child,.tbl.tbl-fit td:last-child{padding-right:12px;}
.tbl .amt-2{text-align:right;white-space:nowrap;line-height:1.35;}
.tbl .amt-2 .a1{font-weight:650;color:var(--ink-900);}
.tbl .amt-2 .a2{font-size:11.5px;color:var(--ink-400);}
.tbl .sup-2 .s2{font-size:11.5px;color:var(--ink-400);margin-top:1px;}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--border-2);vertical-align:middle;color:var(--ink-700);}
.tbl tbody tr{transition:background var(--t-fast);}
.tbl tbody tr:hover td{background:var(--brand-25);}
.tbl tbody tr.mgrp-row td{background:var(--brand-50,#eef2ff);padding:0;border-top:2px solid var(--brand-200,#c7d2fe);border-bottom:1px solid var(--brand-200,#c7d2fe);cursor:pointer;}
.tbl tbody tr.mgrp-row:hover td{background:var(--brand-100,#e0e7ff);}
.mgrp-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;font-size:13px;}
.mgrp-chev{width:14px;color:var(--brand-600,#4f46e5);font-size:13px;}
.mgrp-title{font-weight:700;font-size:14px;color:var(--ink-900,#0f172a);}
.mgrp-meta{color:var(--ink-500,#64748b);}
.mgrp-meta b{color:var(--ink-800,#1e293b);font-weight:650;}
.mgrp-meta b.mgrp-due{color:#dc2626;}
.mgrp-sp{flex:1;}
.tbl tbody tr:last-child td{border-bottom:none;}
.tbl td.strong,.tbl .t-strong{color:var(--ink-900);font-weight:650;}
.tbl tfoot .tbl-total-row td{background:var(--surface-2);border-top:2px solid var(--border);border-bottom:none;padding:12px 14px;}
.tbl-wrap{overflow-x:auto;overflow-y:clip;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow-sm);max-height:none;}
.tbl-wrap.prod-fit{overflow-x:hidden;}
.prod-tbl{table-layout:fixed;width:100%;font-size:12.5px;}
.prod-tbl th{padding:10px 6px;font-size:10px;letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;}
.prod-tbl td{padding:10px 6px;overflow:hidden;}
.prod-tbl th:first-child,.prod-tbl td:first-child{padding-left:14px;padding-right:4px;}
.prod-tbl input.prod-chk{display:block;margin:0;}
.prod-tbl td:nth-child(2),.prod-tbl th:nth-child(2){padding-left:8px;}
.prod-tbl th{white-space:nowrap;text-overflow:clip;}
.prod-tbl td{white-space:nowrap;}
.prod-tbl td:nth-child(2){white-space:normal;}
.prod-tbl th:nth-child(n+8):nth-child(-n+11),.prod-tbl td:nth-child(n+8):nth-child(-n+11){padding-left:4px;padding-right:8px;}
.prod-tbl td:nth-child(12){padding-left:8px;}
.prod-tbl .row-actions{justify-content:flex-start;}
.prod-tbl th:last-child,.prod-tbl td:last-child{padding-right:10px;}
.prod-tbl .with-avatar{gap:8px;}
.prod-tbl .avatar{display:none;}
.prod-tbl .c1,.prod-tbl .c2{white-space:normal !important;max-width:none !important;overflow:visible !important;text-overflow:clip !important;word-break:break-word;}
.prod-tbl .row-actions{gap:0;flex-wrap:nowrap;}
.prod-tbl .row-actions .btn{padding:0 !important;width:24px;min-width:24px;height:26px;}
.prod-tbl .badge{padding:2px 7px;font-size:11px;}
.tbl-wrap.in-card{border:none;border-radius:0;box-shadow:none;}
.cell-2{line-height:1.3;}
.cell-2 .c1{font-weight:600;color:var(--ink-900);}
.cell-2 .c2{font-size:11.5px;color:var(--ink-500);margin-top:2px;}
.right{text-align:right;}
.center{text-align:center;}
.muted{color:var(--ink-500);}
.mono{font-family:'IBM Plex Mono','SFMono-Regular',monospace;font-size:12.5px;letter-spacing:-.02em;}
.nowrap{white-space:nowrap;}
.truncate{max-width:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.avatar{
  width:32px;height:32px;border-radius:var(--r-sm);background:var(--brand-50);color:var(--brand-700);
  font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;
  flex:none;letter-spacing:.2px;
}
.with-avatar{display:flex;align-items:center;gap:11px;min-width:0;}

/* Status pills */
.badge,.pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r-pill);
  font-size:11.5px;font-weight:650;letter-spacing:-.002em;border:1px solid transparent;white-space:nowrap;
}
.badge::before,.pill.dotted::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.85;}
.badge-draft{background:var(--canvas-2);color:var(--ink-600);border-color:var(--border);}
.badge-finalized{background:var(--violet-50);color:var(--violet-700);border-color:var(--violet-200);}
.badge-sent{background:var(--blue-50);color:var(--blue-700);border-color:var(--blue-200);}
.badge-paid{background:var(--green-50);color:var(--green-700);border-color:var(--green-200);}
.badge-cancelled{background:var(--red-50);color:var(--red-700);border-color:var(--red-200);}
.badge-unpaid{background:var(--red-50);color:var(--red-700);border-color:var(--red-200);}
.badge-partial{background:var(--amber-50);color:var(--amber-700);border-color:var(--amber-200);}
.badge-settled{background:var(--green-50);color:var(--green-700);border-color:var(--green-200);}
.amt-due{color:var(--red-700);font-weight:700;}
.amt-clear{color:var(--ink-400);}
.pay-progress{height:5px;border-radius:99px;background:var(--canvas-2);overflow:hidden;margin-top:5px;min-width:70px;}
.pay-progress i{display:block;height:100%;background:var(--green-600);border-radius:99px;}
.ledger-tabs{display:flex;gap:6px;background:var(--canvas-2);padding:4px;border-radius:var(--r-sm);width:max-content;margin-bottom:14px;}
.ledger-tabs button{border:none;background:transparent;padding:7px 16px;border-radius:var(--r-xs);font-size:13px;font-weight:600;color:var(--ink-600);}
.ledger-tabs button.active{background:#fff;color:var(--brand-700);box-shadow:var(--shadow-xs);}
.pill-neutral{background:var(--canvas-2);color:var(--ink-700);border-color:var(--border);}
.pill-brand{background:var(--brand-50);color:var(--brand-700);border-color:var(--brand-100);}

/* Empty state */
.empty{text-align:center;padding:44px 20px;}
.empty-ico{
  width:46px;height:46px;border-radius:var(--r-md);margin:0 auto 14px;
  background:var(--canvas-2);color:var(--ink-400);display:flex;align-items:center;justify-content:center;
}
.empty-ico svg{width:21px;height:21px;}
.empty-t{font-weight:680;color:var(--ink-900);font-size:14px;letter-spacing:-.015em;}
.empty-s{font-size:12.5px;color:var(--ink-500);margin-top:5px;max-width:340px;margin-left:auto;margin-right:auto;line-height:1.5;}
.empty-act{margin-top:16px;}

/* =======================================================================
   FORMS
   ======================================================================= */
input[type=text],input[type=number],input[type=date],input[type=month],input[type=email],input[type=tel],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border-strong);border-radius:var(--r-sm);
  background:#fff;color:var(--ink-900);box-shadow:var(--shadow-xs);
  transition:border-color var(--t-fast),box-shadow var(--t-fast),background var(--t-fast);
}
input::placeholder,textarea::placeholder{color:var(--ink-400);}
input:hover:not(:focus),select:hover:not(:focus),textarea:hover:not(:focus){border-color:var(--ink-300);}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-400);box-shadow:var(--ring);}
input[disabled],select[disabled],textarea[disabled]{background:var(--canvas-2);color:var(--ink-600);cursor:not-allowed;box-shadow:none;}
textarea{resize:vertical;min-height:64px;line-height:1.5;}
select{
  appearance:none;-webkit-appearance:none;padding-right:32px;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237C8698' stroke-width='2.2' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 9px center;background-size:15px;
}
input[type=file]{
  width:100%;padding:8px;border:1px dashed var(--border-strong);border-radius:var(--r-sm);
  background:var(--surface-2);font-size:12.5px;color:var(--ink-600);box-shadow:none;
}
input[type=file]::file-selector-button{
  border:1px solid var(--border-strong);background:#fff;color:var(--ink-800);
  padding:5px 11px;border-radius:var(--r-xs);font-weight:600;font-size:12px;margin-right:10px;cursor:pointer;
}
input[type=checkbox]{accent-color:var(--brand-600);width:16px;height:16px;}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-700);margin-bottom:6px;letter-spacing:-.004em;}
.field{margin-bottom:14px;}
.field:last-child{margin-bottom:0;}
.field-row{display:grid;gap:14px;margin-bottom:14px;}
.field-row:last-child{margin-bottom:0;}
.field-row .field{margin-bottom:0;}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr));}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.cols-4{grid-template-columns:repeat(4,minmax(0,1fr));}
.hint{font-size:11.5px;color:var(--ink-500);margin-top:6px;line-height:1.5;}
.err-text{font-size:12px;color:var(--red-700);margin-top:6px;font-weight:550;}
.ok-text{font-size:12px;color:var(--green-700);margin-top:6px;font-weight:550;}
input.invalid,select.invalid{border-color:var(--red-600);box-shadow:0 0 0 4px rgba(217,45,32,.1);}
.field-emph label{font-size:12.5px;font-weight:700;color:var(--brand-700);}
.field-emph input{font-size:14.5px;font-weight:650;padding:10px 12px;border-color:var(--brand-200);background:var(--brand-25);color:var(--ink-900);}
.field-emph input:focus{background:#fff;}
.alert{
  display:flex;gap:11px;padding:13px 15px;border-radius:var(--r);font-size:13px;
  border:1px solid var(--border);background:var(--surface-2);color:var(--ink-700);line-height:1.5;
}
.alert svg{width:17px;height:17px;flex:none;margin-top:1px;}
.alert.err{background:var(--red-50);border-color:var(--red-200);color:var(--red-700);}
.alert.info{background:var(--blue-50);border-color:var(--blue-200);color:var(--blue-700);}
.alert.warn{background:var(--amber-50);border-color:var(--amber-200);color:var(--amber-700);}
.alert b{font-weight:700;}

/* Toolbar (filters row) */
.toolbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px 14px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-md);box-shadow:var(--shadow-sm);margin-bottom:16px;
}
.toolbar .spacer{flex:1;}
.search-field{position:relative;flex:1 1 260px;max-width:380px;min-width:190px;}
.search-field > svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-400);pointer-events:none;}
.search-field input{padding-left:34px;}
.sel-sm,input.sel-sm,select.sel-sm{width:auto;min-width:150px;flex:none;}
.count-chip{font-size:12px;font-weight:600;color:var(--ink-600);background:var(--canvas-2);
  border:1px solid var(--border);border-radius:var(--r-pill);padding:4px 11px;white-space:nowrap;}

/* Segmented control */
.tag-toggle,.seg{display:inline-flex;background:var(--canvas-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:2px;gap:2px;}
.tag-toggle button,.seg button{
  border:none;background:transparent;padding:5px 12px;font-size:12.5px;font-weight:600;
  color:var(--ink-600);cursor:pointer;border-radius:6px;transition:var(--t-fast);white-space:nowrap;
}
.tag-toggle button:hover,.seg button:hover{color:var(--ink-900);background:rgba(255,255,255,.72);}
.tag-toggle button.active,.seg button.active{background:#fff;color:var(--brand-700);box-shadow:var(--shadow-xs);}

/* =======================================================================
   MODAL
   ======================================================================= */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(15,23,42,.45);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;
  z-index:200;padding:56px 16px 40px;overflow-y:auto;animation:fadeIn .16s var(--ease);
}
.modal{
  background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:580px;
  box-shadow:var(--shadow-lg);border:1px solid var(--border);overflow:hidden;
  animation:modalIn .2s var(--ease);
}
.modal.wide{max-width:940px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--border-2);}
.modal-head h3{margin:0;font-size:16px;font-weight:700;letter-spacing:-.02em;color:var(--ink-900);}
.modal-head .mh-sub{font-size:12.5px;color:var(--ink-500);margin-top:3px;font-weight:450;}
.modal-body{padding:22px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:15px 22px;border-top:1px solid var(--border-2);display:flex;justify-content:flex-end;gap:9px;background:var(--surface-2);}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes modalIn{from{opacity:0;transform:translateY(-10px) scale(.985);}to{opacity:1;transform:none;}}

/* =======================================================================
   TOAST
   ======================================================================= */
#toast-wrap{position:fixed;bottom:24px;right:24px;z-index:500;display:flex;flex-direction:column;gap:10px;max-width:min(380px,calc(100vw - 48px));}
.toast{
  background:var(--surface);color:var(--ink-800);padding:13px 15px;border-radius:var(--r);
  font-size:13px;font-weight:550;line-height:1.45;box-shadow:var(--shadow-lg);
  border:1px solid var(--border);display:flex;align-items:flex-start;gap:10px;
  animation:toastIn .22s var(--ease);
}
.toast::before{content:'';width:4px;align-self:stretch;border-radius:99px;background:var(--ink-400);flex:none;margin:1px 2px 1px 0;}
.toast.ok::before{background:var(--green-600);}
.toast.err::before{background:var(--red-600);}
@keyframes toastIn{from{opacity:0;transform:translateX(14px) scale(.97);}to{opacity:1;transform:none;}}

/* =======================================================================
   AUTOCOMPLETE
   ======================================================================= */
.ac-wrap{position:relative;}
.ac-list{
  position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);
  max-height:300px;overflow-y:auto;z-index:120;padding:5px;
  animation:acIn .14s var(--ease);
}
@keyframes acIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.ac-item{padding:9px 11px;cursor:pointer;border-radius:var(--r-xs);transition:background var(--t-fast);}
.ac-item + .ac-item{margin-top:1px;}
.ac-item:hover,.ac-item.hi{background:var(--brand-50);}
.ac-item .p1{font-weight:620;font-size:13px;color:var(--ink-900);letter-spacing:-.008em;}
.ac-item .p2{font-size:11.5px;color:var(--ink-500);margin-top:2px;}
.ac-empty{padding:16px 12px;font-size:12.5px;color:var(--ink-500);text-align:center;}
.ac-create{display:flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;color:var(--brand-600);border-top:1px solid var(--border-2);margin-top:4px;padding-top:11px;}
.ob-toggle{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:12px;color:var(--ink-600,var(--ink-500));cursor:pointer;user-select:none;}
.ob-toggle input{width:auto;margin:0;cursor:pointer;}
.ac-create svg{width:14px;height:14px;flex:none;}
.ac-create:hover,.ac-create.hi{background:var(--brand-50);}
.ac-head{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-400);padding:8px 11px 4px;}

/* =======================================================================
   DASHBOARD widgets
   ======================================================================= */
.dash-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start;}
.dash-col{display:flex;flex-direction:column;gap:16px;min-width:0;}
.chart{display:flex;align-items:flex-end;gap:10px;height:178px;padding:22px 2px 0;}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0;height:100%;}
.chart-bar-wrap{width:100%;flex:1;display:flex;align-items:flex-end;justify-content:center;position:relative;}
.chart-bar{
  width:74%;max-width:42px;min-height:4px;border-radius:7px 7px 3px 3px;
  background:linear-gradient(180deg,var(--brand-400),var(--brand-600));
  position:relative;transition:filter var(--t),transform var(--t);
}
.chart-col:hover .chart-bar{filter:saturate(1.15) brightness(1.06);transform:scaleY(1.012);transform-origin:bottom;}
.chart-bar.zero{background:var(--canvas-2);}
.cb-tip{
  position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%) translateY(4px);
  background:var(--ink-900);color:#fff;font-size:11px;font-weight:650;padding:5px 9px;border-radius:6px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:var(--t);box-shadow:var(--shadow-md);z-index:5;
}
.chart-col:hover .cb-tip{opacity:1;transform:translateX(-50%) translateY(0);}
.chart-x{font-size:11px;color:var(--ink-500);font-weight:600;white-space:nowrap;}
.chart-x b{display:block;color:var(--ink-700);font-weight:700;}

.rank-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border-2);}
.rank-row:first-child{padding-top:2px;}
.rank-row:last-child{border-bottom:none;padding-bottom:2px;}
.rank-no{
  width:24px;height:24px;border-radius:7px;background:var(--canvas-2);color:var(--ink-600);
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;
}
.rank-row:first-child .rank-no{background:var(--brand-50);color:var(--brand-700);}
.rank-main{min-width:0;flex:1;}
.rank-name{font-size:13px;font-weight:600;color:var(--ink-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rank-meter{height:5px;border-radius:99px;background:var(--canvas-2);margin-top:7px;overflow:hidden;}
.rank-meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand-400),var(--brand-600));transition:width .5s var(--ease);}
.rank-val{font-size:12.5px;font-weight:700;color:var(--ink-900);white-space:nowrap;flex:none;}

.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.quick{
  display:flex;align-items:center;gap:10px;padding:12px 13px;border-radius:var(--r);
  border:1px solid var(--border);background:var(--surface);cursor:pointer;text-align:left;
  font-size:13px;font-weight:600;color:var(--ink-800);box-shadow:var(--shadow-xs);
  transition:var(--t-fast);
}
.quick:hover{border-color:var(--brand-200);background:var(--brand-25);color:var(--brand-700);transform:translateY(-1px);box-shadow:var(--shadow-sm);}
.quick .q-ico{width:30px;height:30px;border-radius:var(--r-sm);background:var(--brand-50);color:var(--brand-600);display:flex;align-items:center;justify-content:center;flex:none;}
.quick .q-ico svg{width:15px;height:15px;}

/* =======================================================================
   INVOICE EDITOR workspace
   ======================================================================= */
.inv-topgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-bottom:16px;align-items:start;}
.party-grid{display:grid;grid-template-columns:1fr;gap:12px;}
.party-box{
  border:1px solid var(--border);border-radius:var(--r-md);padding:15px 17px;background:var(--surface);
  box-shadow:var(--shadow-sm);
}
.party-box h4 svg{width:13px;height:13px;flex:none;color:var(--ink-300);}
.party-box h4{margin:0 0 11px;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-400);font-weight:700;
  display:flex;align-items:center;justify-content:flex-start;gap:7px;}
.party-name{font-weight:680;font-size:14px;color:var(--ink-900);letter-spacing:-.015em;}
.party-line{font-size:12.5px;color:var(--ink-600);margin-top:4px;line-height:1.5;}
.party-line b{color:var(--ink-800);font-weight:600;}
.party-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.chip{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  background:var(--canvas-2);border:1px solid var(--border);border-radius:var(--r-xs);
  padding:3px 8px;color:var(--ink-700);
}
.chip .k{color:var(--ink-500);font-weight:600;}
.party-empty{padding:2px 0 0;}

.items-card{overflow:hidden;}
.items-scroll{overflow-x:auto;}
.items-grid{min-width:880px;}
.item-row{
  display:grid;
  grid-template-columns:minmax(150px,2.5fr) minmax(88px,1fr) minmax(66px,.78fr) minmax(58px,.62fr) minmax(46px,.5fr) minmax(76px,.9fr) minmax(96px,1fr) minmax(112px,1.15fr);
  gap:10px;align-items:center;padding:11px 20px;border-bottom:1px solid var(--border-2);
  transition:background var(--t-fast);
}
.item-row:hover{background:var(--brand-25);}
.item-row.head{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-500);font-weight:700;
  padding-top:10px;padding-bottom:10px;background:var(--surface-2);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:2;
}
.item-row.head:hover{background:var(--surface-2);}
.item-row input,.item-row select{padding:7px 9px;font-size:13px;border-radius:var(--r-xs);box-shadow:none;}
.item-row .ro{font-size:12.5px;color:var(--ink-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-sr{font-size:11px;font-weight:700;color:var(--ink-400);}
.item-amt{font-size:13.5px;font-weight:700;color:var(--ink-900);letter-spacing:-.015em;}
.item-gst{font-size:11px;color:var(--ink-500);margin-top:2px;}
.item-cell-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;}
.item-remove{
  width:26px;height:26px;border-radius:var(--r-xs);border:1px solid transparent;background:transparent;
  color:var(--ink-400);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  flex:none;transition:var(--t-fast);opacity:.55;
}
.item-row:hover .item-remove{opacity:1;}
.item-remove:hover{background:var(--red-50);color:var(--red-600);border-color:var(--red-200);}
.item-remove svg{width:14px;height:14px;}
.items-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:var(--surface-2);border-top:1px solid var(--border-2);}

.totals-panel{margin-top:16px;display:grid;grid-template-columns:minmax(0,1fr) 388px;gap:16px;align-items:start;}
.totals-box{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;background:var(--surface);box-shadow:var(--shadow-sm);}
.totals-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 18px;font-size:13px;color:var(--ink-600);}
.totals-row + .totals-row{border-top:1px solid var(--border-2);}
.totals-row strong{color:var(--ink-900);font-weight:650;font-variant-numeric:tabular-nums;}
.totals-row.sub{background:var(--surface-2);}
.totals-row.disc strong{color:var(--green-700);}
.totals-row.grand{
  background:var(--ink-900);color:#fff;font-weight:750;font-size:17px;padding:16px 18px;border-top:none;
  letter-spacing:-.02em;
}
.totals-row.grand span:first-child{font-size:12.5px;font-weight:600;color:#B7BECC;letter-spacing:0;text-transform:uppercase;}
.totals-row input{width:110px;text-align:right;padding:5px 8px;font-size:12.5px;}
.words-box{
  font-size:12.5px;color:var(--amber-700);padding:12px 15px;background:var(--amber-50);
  border:1px solid var(--amber-200);border-radius:var(--r);line-height:1.55;
}
.words-box .wb-k{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--amber-600);display:block;margin-bottom:4px;}
.draft-indicator{font-size:12px;color:var(--ink-500);display:inline-flex;align-items:center;gap:7px;font-weight:550;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green-600);box-shadow:0 0 0 3px rgba(14,159,110,.14);flex:none;}
.editor-bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;
  padding:11px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-sm);
}

/* Settings / reports helpers */
.set-grid{display:grid;grid-template-columns:minmax(0,232px) minmax(0,1fr);gap:22px;align-items:start;}
.set-nav{position:sticky;top:calc(var(--topbar-h) + 22px);display:flex;flex-direction:column;gap:2px;}
.set-nav a{
  padding:9px 12px;border-radius:var(--r-sm);font-size:13px;font-weight:600;color:var(--ink-600);
  cursor:pointer;transition:var(--t-fast);display:flex;align-items:center;gap:9px;
}
.set-nav a:hover{background:var(--canvas-2);color:var(--ink-900);}
.set-nav a svg{width:15px;height:15px;color:var(--ink-400);}
.media-box{
  border:1px dashed var(--border-strong);border-radius:var(--r);background:var(--surface-2);
  padding:14px;display:flex;align-items:center;gap:14px;margin-bottom:10px;min-height:74px;
}
.media-box img{max-height:56px;max-width:170px;display:block;background:#fff;border:1px solid var(--border);border-radius:var(--r-xs);padding:4px;}
.media-box .mb-empty{font-size:12.5px;color:var(--ink-400);font-style:normal;}
.rep-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px;}
.rep-card{
  text-align:left;padding:16px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);
  cursor:pointer;box-shadow:var(--shadow-xs);transition:var(--t-fast);
}
.rep-card:hover{border-color:var(--brand-200);background:var(--brand-25);transform:translateY(-1px);box-shadow:var(--shadow-sm);}
.rep-card.active{border-color:var(--brand-400);background:var(--brand-25);box-shadow:var(--ring);}
.rep-ico{width:34px;height:34px;border-radius:var(--r-sm);background:var(--brand-50);color:var(--brand-600);
  display:flex;align-items:center;justify-content:center;margin-bottom:11px;}
.rep-ico svg{width:16px;height:16px;}
.rep-t{font-size:13.5px;font-weight:680;color:var(--ink-900);letter-spacing:-.012em;}
.rep-s{font-size:11.5px;color:var(--ink-500);margin-top:3px;line-height:1.45;}
.kv{display:flex;flex-direction:column;gap:3px;}
.kv .k{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-400);}
.kv .v{font-size:13.5px;font-weight:600;color:var(--ink-900);}
.skel{background:linear-gradient(90deg,var(--canvas-2) 25%,#E9ECF2 37%,var(--canvas-2) 63%);
  background-size:400% 100%;animation:shimmer 1.3s linear infinite;border-radius:var(--r-xs);}
@keyframes shimmer{from{background-position:100% 0;}to{background-position:0 0;}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}

/* ---------- Print / Invoice paper preview — premium corporate tax invoice ---------- */
.ip-paper{
  --ip-navy:#1E3A5C; --ip-navy2:#2A4E74; --ip-accent:#C1791A; --ip-accent-bg:#FBF2E4;
  --ip-line:#E4E1D9; --ip-muted:#8A8F98; --ip-text:#20293B;
  --ip-subtlebg:#F8F6F2; --ip-panelbg:#FFFFFF;
  width:794px;min-height:1123px;background:#fff;margin:0 auto;
  display:flex;flex-direction:column;
  font-family:'IBM Plex Sans',sans-serif;color:var(--ip-text);
  border:1px solid var(--ip-line);box-shadow:var(--shadow-md);border-radius:14px;
  font-size:9.5px;line-height:1.5;overflow:hidden;
}
.ip-paper *{box-sizing:border-box;}
.ip-push-bottom{margin-top:auto;}

/* ---------- A4 sheet shell ----------
   Every previewed / printed / PDF'd page is exactly one .ip-sheet: a fixed 794×1123px
   (A4 @96dpi) window. Inside it, .ip-scaler holds an .ip-paper laid out 794/k px wide
   and scaled by k, so a long item list is fitted by zooming the whole sheet out rather
   than letting it spill past the page edge. See layoutInvoiceSheets(). */
.ip-sheet{position:relative;width:794px;height:1123px;background:#fff;overflow:hidden;
  margin:0 auto;border:1px solid var(--ip-line,#E4E1D9);border-radius:14px;box-shadow:var(--shadow-md);}
.ip-sheet + .ip-sheet{margin-top:24px;}
.ip-sheet > .ip-scaler{transform-origin:top left;}
.ip-sheet .ip-paper{border:none;border-radius:0;box-shadow:none;margin:0;}

/* Continuation sheets: compact "who / continued" strip in place of the full party boxes,
   plus brought-forward / carried-forward rows so the running total is auditable. */
.ip-contstrip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;
  padding:8px 14px;border:1px solid var(--ip-line);border-left:3px solid var(--ip-accent);
  border-radius:6px;background:var(--ip-subtlebg);font-size:9px;color:#4B5468;}
.ip-contstrip .cs-label{font-size:7.4px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--ip-accent);font-weight:800;}
.ip-contstrip .cs-em{font-size:10.5px;font-weight:700;color:var(--ip-navy);}
.ip-contstrip .cs-tag{margin-left:auto;padding:2px 9px;border-radius:10px;background:#fff;
  border:1px solid var(--ip-line);color:var(--ip-muted);font-size:6.8px;letter-spacing:.4px;
  text-transform:uppercase;font-weight:700;}
table.ip-items tr.ip-cfrow td{background:var(--ip-subtlebg);font-weight:600;color:var(--ip-navy);}
table.ip-items tr.ip-cfrow td .cf-note{color:var(--ip-muted);font-weight:600;font-size:7.6px;
  text-transform:uppercase;letter-spacing:.4px;}
.ip-continues{display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin-bottom:16px;padding:10px 16px;border:1px dashed var(--ip-accent);border-radius:6px;
  background:var(--ip-accent-bg);}
.ip-continues .cn-label{font-size:7.6px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--ip-accent);font-weight:800;}
.ip-continues .cn-sub{font-size:8.6px;color:#4B5468;margin-top:2px;}
.ip-continues .cn-amt{font-size:12px;font-weight:800;color:var(--ip-navy);}

/* Header */
.ip-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;
  padding:34px 34px 26px;background:linear-gradient(135deg,var(--ip-navy),var(--ip-navy2));
  border-bottom:4px solid var(--ip-accent);position:relative;}
.ip-head-left{display:flex;gap:22px;align-items:center;flex:1;min-width:0;}
.ip-ident{flex:1;min-width:0;}
.ip-logo-badge{width:84px;height:84px;border-radius:16px;background:var(--ip-accent);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;
  font-size:30px;flex-shrink:0;letter-spacing:.2px;}
.ip-logo{height:auto;width:auto;max-height:128px;max-width:240px;object-fit:contain;object-position:center;flex-shrink:0;margin:0;filter:drop-shadow(0 2px 6px rgba(0,0,0,.28));}
.ip-company{font-family:'Archivo','IBM Plex Sans',sans-serif;font-stretch:125%;font-variation-settings:'wdth' 125;font-size:33px;font-weight:900;line-height:1.08;letter-spacing:1.5px;text-transform:uppercase;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.22);}
.ip-company::after{content:'';display:block;width:46px;height:3px;border-radius:2px;background:var(--ip-accent);margin-top:7px;}
.ip-tagline{font-size:11px;color:var(--ip-accent);font-weight:600;margin-top:5px;line-height:1.4;max-width:420px;text-transform:uppercase;letter-spacing:.3px;}
.ip-meta{font-size:11px;color:#AEB6C4;margin-top:9px;line-height:1.5;max-width:440px;}
.ip-ident .ip-tagline{margin-top:8px;letter-spacing:1.6px;font-size:10.5px;}
.ip-meta b{color:#E7EAF0;font-weight:600;}
.ip-head-right{text-align:right;flex-shrink:0;padding-top:1px;}
.ip-tax-tag{display:inline-block;font-size:13px;font-weight:800;letter-spacing:1.2px;
  color:#fff;background:var(--ip-accent);padding:6px 14px;border-radius:20px;}
.ip-copy-label{font-size:9px;font-weight:700;letter-spacing:1px;color:#AEB6C4;text-transform:uppercase;margin-top:8px;}
.ip-inv-label{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:#8792A6;font-weight:700;}
.ip-inv-no{font-size:16px;font-weight:800;color:#fff;margin-top:2px;}
.ip-inv-date-label{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:#8792A6;font-weight:700;}
.ip-inv-date{font-size:13px;color:#E7EAF0;font-weight:600;margin-top:2px;}

.ip-hr-row{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:13px;}
.ip-hr-row:first-of-type{margin-top:15px;}
.ip-hr-text{text-align:left;}
.ip-icon-box{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  color:#fff;flex-shrink:0;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);}
.ip-icon-box svg{width:15px;height:15px;}

/* Body */
.ip-body{padding:22px 34px 0;}

.ip-orderinfo{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.ip-orderinfo .oi-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--ip-subtlebg);border:1px solid var(--ip-line);border-radius:20px;}
.ip-orderinfo .oi-icon{color:var(--ip-accent);display:flex;flex-shrink:0;}
.ip-orderinfo .oi-icon svg{width:11px;height:11px;}
.ip-orderinfo .oi-label{font-size:7.3px;text-transform:uppercase;letter-spacing:.4px;color:var(--ip-muted);font-weight:700;}
.ip-orderinfo .oi-value{font-size:9.3px;color:var(--ip-text);font-weight:600;}
.ip-orderinfo .oi-chip-em{background:var(--ip-accent-bg);border-color:var(--ip-accent);padding:7px 14px;}
.ip-orderinfo .oi-chip-em .oi-label{font-size:8px;color:var(--ip-accent);}
.ip-orderinfo .oi-chip-em .oi-value{font-size:11px;font-weight:800;}

.ip-parties{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.ip-parties.single{grid-template-columns:1fr;}
.ip-partybox{border:1px solid var(--ip-line);border-left:3px solid var(--ip-accent);border-radius:6px;padding:11px 14px;background:var(--ip-panelbg);}
.ip-partybox .pb-label{display:flex;align-items:center;gap:5px;font-size:7.4px;text-transform:uppercase;letter-spacing:.7px;color:var(--ip-accent);font-weight:800;margin-bottom:5px;}
.ip-partybox .pb-tag{margin-left:auto;padding:2px 8px;border-radius:10px;background:var(--ip-subtlebg);color:var(--ip-muted);font-size:6.6px;letter-spacing:.3px;text-transform:uppercase;font-weight:700;}
.ip-partybox .pb-icon{color:var(--ip-accent);display:flex;flex-shrink:0;}
.ip-partybox .pb-icon svg{width:11px;height:11px;}
.ip-partybox .pb-name{font-size:11px;font-weight:700;color:var(--ip-navy);}
.ip-partybox .pb-line{font-size:9px;color:#1F2937;font-weight:500;margin-top:3px;line-height:1.4;}
.ip-partybox .pb-line.sub{color:#2B3447;font-weight:600;margin-top:4px;}

table.ip-items{width:100%;border-collapse:collapse;font-size:10.4px;margin-bottom:16px;border-radius:6px;overflow:hidden;}
table.ip-items .mono{font-size:inherit;}
table.ip-items thead th{background:var(--ip-navy);color:#fff;padding:9px 8px;font-size:8.2px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;text-align:left;}
table.ip-items td{padding:8px;border-bottom:1px solid #C9CED6;vertical-align:top;color:#0F172A;font-weight:600;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
table.ip-items tbody tr:last-child td{border-bottom:1.4px solid var(--ip-navy);}
.ip-dwg{display:block;font-size:8.4px;color:#374151;margin-top:3px;font-family:'IBM Plex Mono',monospace;letter-spacing:.1px;font-weight:600;}

/* Totals */
.ip-totalswrap{display:flex;justify-content:flex-end;margin-bottom:0;}
.ip-totals{width:300px;}
.ip-totals .t-row{display:flex;justify-content:space-between;padding:6px 4px;font-size:10.6px;border-bottom:1px solid #C9CED6;}
.ip-totals .t-row .lbl{color:#1F2937;font-weight:600;}
.ip-totals .t-row .val{font-weight:800;color:#0B1220;}

.ip-grandbar{display:flex;justify-content:space-between;align-items:center;margin:6px 34px 18px;
  padding:15px 22px;background:linear-gradient(135deg,var(--ip-navy),var(--ip-navy2));
  border-radius:9px;border-left:4px solid var(--ip-accent);box-shadow:0 4px 14px rgba(15,30,51,.18);}
.ip-grandbar .gb-label{color:#AEB6C4;font-size:8px;text-transform:uppercase;letter-spacing:1px;font-weight:700;}
.ip-grandbar .gb-sub{color:#7D879A;font-size:7.5px;margin-top:2px;}
.ip-grandbar .gb-amt{color:#fff;font-weight:800;font-size:19px;letter-spacing:.2px;}

.ip-obalance{margin:-10px 34px 14px;font-size:8.3px;color:#8a6d1f;background:#FFF8E6;border:1px solid #F3E3B0;
  border-radius:6px;padding:6px 12px;text-align:right;}
.ip-obalance b{color:#6b4e0d;}
.ip-paper.ip-d1 .ip-obalance{margin:-8px 26px 10px;padding:5px 10px;font-size:7.6px;}
.ip-paper.ip-d2 .ip-obalance{margin:-6px 20px 7px;padding:4px 9px;font-size:7px;}

.ip-words{font-size:10px;padding-top:2px;margin-bottom:18px;color:#111827;}
.ip-words .w-label{text-transform:uppercase;font-size:7.8px;letter-spacing:.6px;color:#374151;font-weight:800;margin-bottom:4px;}
.ip-words .w-value{font-weight:700;color:#0B1220;}

/* Bottom */
.ip-bottom{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;align-items:start;}
.ip-bank{border:1px solid var(--ip-line);border-radius:6px;padding:12px 14px;background:var(--ip-subtlebg);}
.ip-bank .bk-label{display:flex;align-items:center;gap:5px;font-size:7.6px;text-transform:uppercase;letter-spacing:.6px;color:var(--ip-accent);font-weight:800;margin-bottom:8px;}
.ip-bank .bk-icon{color:var(--ip-accent);display:flex;flex-shrink:0;}
.ip-bank .bk-icon svg{width:11px;height:11px;}
.ip-bank .bk-row{display:flex;font-size:9px;color:#111827;font-weight:600;margin-bottom:4px;}
.ip-bank .bk-row span:first-child{color:#4B5563;font-weight:600;min-width:98px;flex-shrink:0;}
.ip-bank .bk-terms{margin-top:8px;font-size:8.7px;color:var(--ip-text);font-weight:600;border-top:1px dashed var(--ip-line);padding-top:7px;}

.ip-sign{border:1px solid var(--ip-line);border-radius:6px;padding:12px 20px;background:var(--ip-panelbg);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;
  min-width:220px;width:100%;box-sizing:border-box;}
.ip-sign .sg-for{font-size:9.6px;color:var(--ip-navy);font-weight:800;}
.ip-sign .sg-stampwrap{position:relative;width:100px;height:100px;margin:6px 0 2px;display:flex;align-items:center;justify-content:center;}
.ip-sign .sg-stamp{position:absolute;top:0;left:0;width:100px;height:100px;object-fit:contain;opacity:.9;
  transform:translate(var(--stx,0px),var(--sty,0px)) scale(var(--sts,1));transform-origin:center;}
.ip-sign .sg-img{position:relative;max-height:100px;max-width:220px;object-fit:contain;z-index:2;
  transform:translate(calc(-14px + var(--sgx,0px)),calc(2px + var(--sgy,0px))) rotate(-3deg) scale(var(--sgs,1));
  transform-origin:center;filter:contrast(1.15) saturate(1.1);}
.ip-sign .sg-space{height:20px;}
.ip-sign .sg-label{font-size:8.8px;color:#111827;font-weight:600;border-top:1px solid #9CA3AF;padding-top:6px;margin-top:4px;width:100%;text-align:center;}

.ip-declare{font-size:8.4px;color:#111827;font-weight:600;line-height:1.5;border-top:1.2px solid #9CA3AF;padding:11px 34px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.ip-footerbar{background:var(--ip-navy);color:#AEB6C4;display:flex;justify-content:space-between;align-items:center;
  padding:9px 34px;font-size:7.4px;}
.ip-footerbar b{color:var(--ip-accent);letter-spacing:.4px;}

/* ---------- Density tiers ----------
   Two progressively tighter versions of the paper's own chrome — paddings, letterhead,
   logo, stamp, table cell padding, declaration. layoutInvoiceSheets() reaches for these
   BEFORE it zooms the sheet out, because trimming whitespace costs nothing in
   readability whereas zooming shrinks the line items along with everything else. */
.ip-paper.ip-d1 .ip-head{padding:24px 26px 19px;}
.ip-paper.ip-d1 .ip-body{padding:16px 26px 0;}
.ip-paper.ip-d1 .ip-logo{max-height:100px;max-width:200px;}
.ip-paper.ip-d1 .ip-logo-badge{width:66px;height:66px;font-size:24px;}
.ip-paper.ip-d1 .ip-company{font-size:29px;letter-spacing:1.2px;}
.ip-paper.ip-d1 .ip-orderinfo{margin-bottom:11px;}
.ip-paper.ip-d1 .ip-parties{margin-bottom:11px;}
.ip-paper.ip-d1 .ip-contstrip{margin-bottom:10px;}
.ip-paper.ip-d1 .ip-partybox{padding:8px 12px;}
.ip-paper.ip-d1 table.ip-items{margin-bottom:11px;font-size:9.8px;}
.ip-paper.ip-d1 .ip-totals .t-row{font-size:10px;}
.ip-paper.ip-d1 table.ip-items td{padding:5.5px 7px;}
.ip-paper.ip-d1 table.ip-items thead th{padding:7px 7px;}
.ip-paper.ip-d1 .ip-grandbar{margin:4px 26px 12px;padding:11px 18px;}
.ip-paper.ip-d1 .ip-words{margin-bottom:12px;}
.ip-paper.ip-d1 .ip-bottom{margin-bottom:11px;gap:12px;}
.ip-paper.ip-d1 .ip-bank{padding:9px 12px;}
.ip-paper.ip-d1 .ip-bank .bk-row{margin-bottom:2.5px;}
.ip-paper.ip-d1 .ip-sign{padding:9px 16px;}
.ip-paper.ip-d1 .ip-sign .sg-stampwrap{width:78px;height:78px;margin:4px 0 1px;}
.ip-paper.ip-d1 .ip-sign .sg-stamp{width:78px;height:78px;}
.ip-paper.ip-d1 .ip-sign .sg-img{max-height:78px;max-width:170px;}
.ip-paper.ip-d1 .ip-continues{margin-bottom:11px;padding:8px 14px;}
.ip-paper.ip-d1 .ip-declare{padding:8px 26px;line-height:1.42;font-size:7.8px;}
.ip-paper.ip-d1 .ip-footerbar{padding:7px 26px;}

.ip-paper.ip-d2 .ip-head{padding:17px 20px 14px;border-bottom-width:3px;}

@media print{
  body *{visibility:hidden;}
  #print-area, #print-area *{visibility:visible;}
  #print-area{position:absolute;left:0;top:0;width:100%;}
  /* Each .ip-sheet is already sized to exactly one A4 page and its contents are
     pre-fitted by layoutInvoiceSheets(), so the only job left here is to make sure
     the browser puts exactly one sheet on each physical page and never tries to
     break inside one. */
  .ip-sheet{box-shadow:none;border:none;border-radius:0;margin:0;overflow:hidden;
    break-inside:avoid;page-break-inside:avoid;break-after:page;page-break-after:always;}
  .ip-sheet:last-child{break-after:auto;page-break-after:auto;}
  .ip-sheet + .ip-sheet{margin-top:0;}
  .ip-paper{box-shadow:none;border:none;border-radius:0;overflow:hidden;}
  @page{size:A4;margin:0;}
}
