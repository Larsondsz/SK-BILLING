    }catch(e){
      console.error(e); toast('Could not build the PDF: '+e.message, 'err');
    }finally{
      btn.disabled = false; btn.innerHTML = originalHTML;
    }
  });
  document.getElementById('pur-search').addEventListener('input', e=>{ PUR_SEARCH=e.target.value; render();
    setTimeout(()=>{ const el=document.getElementById('pur-search'); if(el){ el.focus(); el.selectionStart=el.selectionEnd=el.value.length; } },0); });
  document.getElementById('pur-filter').addEventListener('change', e=>{ PUR_FILTER=e.target.value; render(); });
  document.getElementById('pur-sort').addEventListener('change', e=>{ PUR_SORT=e.target.value; render(); });
  document.querySelectorAll('[data-pview]').forEach(b=>b.addEventListener('click', ()=>openPurchaseView(b.dataset.pview)));
  document.querySelectorAll('[data-pedit]').forEach(b=>b.addEventListener('click', ()=>openPurchaseEdit(b.dataset.pedit)));
  document.querySelectorAll('[data-pdup]').forEach(b=>b.addEventListener('click', ()=>duplicatePurchase(b.dataset.pdup)));
  document.querySelectorAll('[data-pdel]').forEach(b=>b.addEventListener('click', ()=>deletePurchase(b.dataset.pdel)));
  document.querySelectorAll('[data-ppaid]').forEach(b=>b.addEventListener('click', ()=>togglePurchasePaid(b.dataset.ppaid)));
}

/* ========================================================================
   PURCHASE BILL PDF — a simpler, table-based layout (autoTable) rather than the multi-sheet
   sales-invoice paper builder, since a purchase bill is an internal record of a supplier's
   invoice rather than a document handed to a customer.
   ======================================================================== */
async function generatePurchaseBillPDF(p, opts={}){
  if(!window.jspdf){ throw new Error('PDF library not loaded — check your internet connection.'); }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4', compress:true});
  const t = p.totals || computePurchaseTotals(p);
  const s = DB.settings;
  const marginX = 40;
  let y = 50;

  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text(s.companyName||'Company', marginX, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90);
  y += 16;
  if(s.address){ doc.text(String(s.address).slice(0,110), marginX, y); y += 12; }
  doc.text(`GSTIN: ${s.gstin||'—'}  ·  State: ${s.state||'—'} (${s.stateCode||'—'})`, marginX, y);
  doc.setTextColor(0);
  y += 22;
  doc.setDrawColor(200); doc.line(marginX, y, 555, y); y += 22;

  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text('PURCHASE BILL', marginX, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text(`Bill No.: ${p.number||'—'}`, 400, y-4);
  doc.text(`Date: ${fmtDate(p.date)}`, 400, y+10);
  y += 26;

  doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('Supplier / Vendor', marginX, y);
  y += 14;
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text(String(p.supplierName||'—'), marginX, y); y += 12;
  if(p.supplierBillingAddress){ doc.text(String(p.supplierBillingAddress).slice(0,100), marginX, y); y += 12; }
  doc.text(`GSTIN: ${p.supplierGSTIN||'—'}   State: ${p.supplierState||'—'} (${p.supplierStateCode||'—'})`, marginX, y); y += 12;
  if(p.supplierInvoiceNumber || p.supplierInvoiceDate){
    doc.text(`Supplier Invoice No.: ${p.supplierInvoiceNumber||'—'}   Date: ${p.supplierInvoiceDate?fmtDate(p.supplierInvoiceDate):'—'}`, marginX, y); y += 12;
  }
  y += 8;

  let body, head;
  if(p.amount!==undefined){
    const gstAmt = round2(t.cgst+t.sgst+t.igst);
    body = [[1, 'Purchase Amount', fmtINR(clamp0(p.amount),false), `${p.gstRate!==undefined?p.gstRate:18}%`, fmtINR(gstAmt,false), fmtINR(round2(t.taxableTotal+gstAmt),false)]];
    head = [['#','Description','Amount','GST %','GST Amt','Total']];
  } else {
    body = (p.items||[]).map((it,idx)=>{
      const taxable = Calc.lineTaxable(it);
      const gstAmt = round2(taxable*clamp0(it.gst)/100);
      return [idx+1, (it.name||'')+(itemMaterial(it)?' ('+itemMaterial(it)+')':''), it.dwg||'', it.hsn||'', it.qty, it.unit||'', fmtINR(it.rate,false), fmtINR(taxable,false), `${it.gst}%`, fmtINR(gstAmt,false), fmtINR(round2(taxable+gstAmt),false)];
    });
    head = [['#','Product / Item','DWG/Code','HSN','Qty','Unit','Rate','Taxable','GST %','GST Amt','Total']];
  }
  doc.autoTable({
    startY: y,
    margin: {left:marginX, right:40},
    head,
    body,
    styles: {fontSize:8, cellPadding:4},
    headStyles: {fillColor:[79,70,229], textColor:255},
    columnStyles: {0:{cellWidth:20}, 1:{cellWidth:110}},
  });
  let ny = (doc.lastAutoTable && doc.lastAutoTable.finalY) ? doc.lastAutoTable.finalY + 20 : y + 60;

  const lines = [
    ...(p.amount!==undefined ? [['Amount (after discount)', fmtPDF(t.afterDiscount)]] : []),
    ...(t.chargesTotal>0 ? [['Additional Charges', fmtPDF(t.chargesTotal)]] : []),
    ['Taxable Amount', fmtPDF(t.taxableTotal)],
    ...(t.mode==='cgst_sgst' ? [['CGST', fmtPDF(t.cgst)],['SGST', fmtPDF(t.sgst)]] : [['IGST', fmtPDF(t.igst)]]),
    ['Total GST', fmtPDF(round2(t.cgst+t.sgst+t.igst))],
    ['Round Off', (t.roundOff>=0?'+':'')+fmtPDF(t.roundOff)],
  ];
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  lines.forEach(([k,v])=>{ doc.text(k, 380, ny); doc.text(String(v), 555, ny, {align:'right'}); ny += 14; });
  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('Grand Total', 380, ny); doc.text(fmtPDF(t.grandTotal), 555, ny, {align:'right'});
  ny += 18;
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(90);
  doc.text(t.amountInWords||'', marginX, ny, {maxWidth:500});
  doc.setTextColor(0);

  if(p.notes){ ny += 22; doc.setFontSize(9); doc.text(`Notes: ${p.notes}`, marginX, ny, {maxWidth:500}); }

  const filename = `${safeFilename(p.number||'purchase_bill')}.pdf`;
  if(opts.download){ doc.save(filename); }
  return { doc, filename };
}

/* =========================================================================
   A4 SHEET LAYOUT ENGINE

   One job: guarantee that whatever the item count, every page that comes out of
   preview / print / PDF is exactly one A4 sheet with the layout intact — letterhead
   at the top, bank details + signature pinned to the bottom, nothing clipped and
   nothing spilling over the edge.

   Three strategies, in order of preference:

   1. TIGHTEN THE CHROME. Tiers .ip-d1 / .ip-d2 shave the letterhead padding, logo,
      stamp, table cell padding and declaration — whitespace, not content. The lowest
      tier that fits the whole invoice on one unzoomed sheet wins, so a 3-item invoice
      keeps its original generous spacing and only a crowded one gets compacted.

   2. ZOOM THE SHEET OUT. If even the tightest tier overflows, the paper is laid out
      `SHEET_W / k` px wide and scaled by k, shrinking every font, padding and hairline
      together while still filling the full page width. We binary-search for the
      *largest* k (least shrink) that fits. Because the search adjusts the layout width,
      wide item descriptions also stop wrapping onto second lines, which buys back real
      vertical room on top of the scaling itself.

   3. SPLIT INTO CONTINUATION SHEETS. Past K_MIN the text would stop being legible in
      print, so instead the item table is broken across real pages: each sheet repeats
      the letterhead, the table header and a compact Bill To strip, carries the running
      total forward, and only the final sheet carries the tax summary, grand total,
      amount in words, bank details and signature. Row counts per sheet are found by
      measuring the actual DOM, not estimated — so a row with a long description or a
      drawing number simply takes the space it needs.
   ========================================================================= */
const SHEET_W = 794;      // A4 width  in CSS px @96dpi
const SHEET_H = 1123;     // A4 height in CSS px @96dpi
const K_MIN   = 0.70;     // hard floor on zoom-out — below this, print gets unreadable
const IP_SAFETY = 2.5;    // px of slack kept below the page edge so overflow:hidden never
                          // shaves the footer bar's bottom hairline (the search render and
                          // the final render can measure sub-pixel differently)
const IP_DENSITIES = [0, 1, 2];
// Fallbacks once more than one sheet is unavoidable, best first: full-size text with
// trimmed chrome beats zooming out, and fewer pages beats more.
const IP_MULTI_STEPS = [{d:1, k:1}, {d:2, k:1}, {d:2, k:0.88}, {d:2, k:K_MIN}];

let _ipMeasureHost = null;
function ipMeasureHost(){
  if(_ipMeasureHost && _ipMeasureHost.isConnected) return _ipMeasureHost;
  const h = document.createElement('div');
  h.style.cssText = 'position:fixed;left:-10000px;top:0;width:0;height:0;overflow:visible;'+
                    'z-index:-1;pointer-events:none;visibility:hidden;';
  document.body.appendChild(h);
  _ipMeasureHost = h;
  return h;
}
async function ipFontsReady(){
  try{ if(document.fonts && document.fonts.load){
    await Promise.race([Promise.all([document.fonts.load("900 33px Archivo"),document.fonts.load("400 12px Archivo")]), new Promise(r=>setTimeout(r,2500))]);
  } }catch(e){}
}
function ipWaitForImages(root){
  const imgs = Array.from(root.querySelectorAll('img'));
  return Promise.all(imgs.map(img => (img.complete && img.naturalHeight !== 0) || !img.src
    ? Promise.resolve()
    : new Promise(res=>{ img.onload = img.onerror = res; setTimeout(res, 2500); })));
}

/* Natural content height, in px, of one paper laid out `width` px wide.
   min-height/height are neutralised so .ip-push-bottom's auto margin collapses to 0 and
   we get the true content height rather than a padded-out full page. */
function ipMeasureHeight(host, html, width){
  host.innerHTML = `<div style="width:${width}px;">${html}</div>`;
  const paper = host.querySelector('.ip-paper');
  if(!paper) return Infinity;
  paper.style.width = width+'px';
  paper.style.minHeight = '0';
  paper.style.height = 'auto';
  paper.style.maxHeight = 'none';
  paper.style.overflow = 'visible';
  paper.style.border = 'none';
  paper.style.borderRadius = '0';
  paper.style.boxShadow = 'none';
  paper.style.margin = '0';
  // scrollHeight rounds to an integer; getBoundingClientRect keeps the sub-pixel truth,
  // which matters because we're comparing against an exact page height.
  return Math.max(paper.scrollHeight, paper.getBoundingClientRect().height);
}

/* Fit the whole invoice on ONE sheet: the lowest density tier that needs no zoom at all,
   else the tightest tier zoomed as little as possible. Returns {density,k} or null if a
   single sheet is impossible without going below K_MIN. */
function ipFitOneSheet(host, inv, copyLabel){
  const fits = (d,k) => ipMeasureHeight(host,
      buildInvoicePaperHTML(inv, {copyLabel, density:d, pageLabel:'Page 1 of 1'}),
      SHEET_W/k) <= (SHEET_H/k) - IP_SAFETY;

  // 1. Trim whitespace before touching text size.
  for(const d of IP_DENSITIES) if(fits(d,1)) return {density:d, k:1};

  // 2. Tightest chrome, then the least zoom-out that fits. "Fits" is monotone in the
  //    layout width, so a binary search is sound.
  const d = IP_DENSITIES[IP_DENSITIES.length-1];
  if(!fits(d,K_MIN)) return null;
  let lo = K_MIN, hi = 1;                  // invariant: lo fits, hi doesn't
  for(let i=0; i<8; i++){
    const mid = (lo+hi)/2;
    if(fits(d,mid)) lo = mid; else hi = mid;
  }
  return {density:d, k:lo};
}

/* Greedily pack items into continuation sheets at a fixed density and zoom, measuring
   every candidate so the break always lands where it actually fits. Returns null if this
   step is too generous to make progress (caller then tries the next one). */
function ipFillSheets(host, inv, allItems, d, k, copyLabel){
  const W = SHEET_W/k, LIMIT = SHEET_H/k;
  const t = inv.totals || Calc.compute(inv);
  // Running total of the Total column, so each sheet can hand a carry-forward figure on.
  const cum = []; let run = 0;
  for(const it of allItems){ run = round2(run + (it.lineTotal||0)); cum.push(run); }

  const specs = [];
  let idx = 0, guard = 0;

  const probe = (n, isLast, first) => ipMeasureHeight(host, buildInvoicePaperHTML(inv, {
      copyLabel, density:d, pageLabel:'Page 8 of 8',
      slice:{ items: allItems.slice(idx, idx+n), startIndex: idx,
              showParties: first, showTotals: isLast,
              broughtForward: first ? null : (cum[idx-1] || 0),
              // placeholder of realistic magnitude — digit count, not value, affects layout
              carriedForward: isLast ? null : t.grandTotal }
    }), W) <= LIMIT - IP_SAFETY;

  while(guard++ < 200){
    const first = specs.length === 0;
    const remaining = allItems.length - idx;

    if(probe(remaining, true, first)){                 // everything left finishes here
      specs.push({items:allItems.slice(idx), startIndex:idx, showParties:first,
                  showTotals:true,
                  broughtForward: first ? null : (cum[idx-1] || 0),
                  carriedForward: null});
      idx = allItems.length;
      break;
    }

    let lo = 0, hi = remaining;                        // invariant: lo fits, hi doesn't
    while(hi - lo > 1){
      const mid = (lo + hi) >> 1;
      if(probe(mid, false, first)) lo = mid; else hi = mid;
    }
    if(lo === 0) return null;                          // not even one row — need a tighter step

    specs.push({items:allItems.slice(idx, idx+lo), startIndex:idx, showParties:first,
                showTotals:false,
                broughtForward: first ? null : (cum[idx-1] || 0),
                carriedForward: cum[idx+lo-1] || 0});
    idx += lo;
  }
  if(idx < allItems.length) return null;               // guard tripped — bail to next step

  const N = specs.length;
  return specs.map((spec,i)=>({
    scale: k, width: W, height: LIMIT, density: d,
    html: buildInvoicePaperHTML(inv, {
      copyLabel, density:d, pageLabel:`Page ${i+1} of ${N}`, slice:spec,
      paperStyle:`width:${W}px;min-height:${LIMIT}px;height:${LIMIT}px;`
    })
  }));
}

/* Resolve one invoice copy into an array of ready-to-render A4 sheets:
   [{html, scale, width, height}, ...] — html is a .ip-paper already pinned to
   width×height px, which the caller scales by `scale` to land it on a real A4 page. */
async function layoutInvoiceSheets(inv, opts={}){
  const host = ipMeasureHost();
  const copyLabel = opts.copyLabel || '';
  const t = inv.totals || Calc.compute(inv);
  const allItems = (t.lineBreakdown || Calc.compute(inv).lineBreakdown || []);

  // Every measurement below budgets around the letterhead logo and the signature/stamp,
  // so those images have to be decoded before the first getBoundingClientRect.
  await ipFontsReady();
  host.innerHTML = buildInvoicePaperHTML(inv, {copyLabel});
  await ipWaitForImages(host);

  const sheet = (d,k) => ({
    scale: k, width: SHEET_W/k, height: SHEET_H/k, density: d,
    html: buildInvoicePaperHTML(inv, {copyLabel, density:d, pageLabel:'Page 1 of 1',
      paperStyle:`width:${SHEET_W/k}px;min-height:${SHEET_H/k}px;height:${SHEET_H/k}px;`})
  });

  try{
    const one = ipFitOneSheet(host, inv, copyLabel);
    if(one) return [sheet(one.density, one.k)];
    for(const step of IP_MULTI_STEPS){
      const sheets = ipFillSheets(host, inv, allItems, step.d, step.k, copyLabel);
      if(sheets && sheets.length) return sheets;
    }
    // Unreachable in practice (a single row always fits at the tightest step); clip
    // rather than throw so the user still gets an invoice.
    return [sheet(2, K_MIN)];
  } finally {
    host.innerHTML = '';
  }
}

/* Wrap a laid-out sheet in its A4 window. */
function ipSheetShell(s){
  return `<div class="ip-sheet"><div class="ip-scaler" style="transform:scale(${s.scale});">${s.html}</div></div>`;
}

/* Every sheet of every copy, in order — the single source of truth shared by
   preview, print and PDF so all three are guaranteed identical. */
async function layoutInvoiceCopies(inv, copyLabels){
  const out = [];
  for(const label of copyLabels){
    const sheets = await layoutInvoiceSheets(inv, {copyLabel:label});
    out.push(...sheets);
  }
  return out;
}

function safeFilename(s){
  return String(s).replace(/[\/\\?%*:|"<>]/g,'_').replace(/\s+/g,'_');
}

/* ---- PDF generation — renders the exact sheets the preview shows.

   layoutInvoiceSheets() has already fitted the invoice into whole A4 sheets, so each
   sheet is captured on its own with html2canvas and dropped onto one PDF page at full
   bleed. No slicing, no page-break heuristics: a sheet's capture is A4-proportioned by
   construction (its paper is pinned to width × width·√2), so it lands on the page 1:1.

   renderInvoiceCopyIntoDoc() does capture+append for ONE copy of ONE invoice into an
   existing jsPDF doc, so it's reused both for a single invoice's PDF (2 copies) and for
   a combined multi-invoice PDF (1 copy each, back to back) — e.g. a month's worth of
   invoices for a CA/GST filing. pageState is a small mutable {firstPage:true} object
   shared across every call for the same doc, so the very first page drawn anywhere
   reuses jsPDF's initial blank page instead of adding an extra one. ---- */
const PDF_CAPTURE_SCALE = 2.2;   // capture oversampling — sharp text without huge files

async function ipCaptureSheet(sheet){
  const host = document.createElement('div');
  host.style.cssText = `position:fixed;left:-10000px;top:0;width:${sheet.width}px;background:#fff;z-index:-1;`;
  host.innerHTML = sheet.html;
  document.body.appendChild(host);
  try{
    const paper = host.querySelector('.ip-paper');
    paper.style.width = sheet.width+'px';
    paper.style.height = sheet.height+'px';
    paper.style.minHeight = sheet.height+'px';
    paper.style.boxShadow = 'none';
    paper.style.border = 'none';
    paper.style.borderRadius = '0';
    paper.style.margin = '0';
    paper.style.overflow = 'hidden';
    await ipFontsReady();
    await ipFixLogoIn(host);
    await ipWaitForImages(paper);
    await new Promise(res=>setTimeout(res, 40));
    return await html2canvas(paper, {
      scale: PDF_CAPTURE_SCALE, useCORS:true, backgroundColor:'#ffffff',
      width: sheet.width, height: sheet.height,
      windowWidth: sheet.width, windowHeight: sheet.height
    });
  } finally {
    document.body.removeChild(host);
  }
}

async function renderInvoiceCopyIntoDoc(doc, inv, copyLabel, pageState){
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const sheets = await layoutInvoiceSheets(inv, {copyLabel});

  for(const sheet of sheets){
    const canvas = await ipCaptureSheet(sheet);
    if(!pageState.firstPage) doc.addPage();
    pageState.firstPage = false;
    doc.addImage(canvas.toDataURL('image/jpeg',0.95), 'JPEG', 0, 0, pageW, pageH);
  }
}


async function generateInvoicePDF(inv, opts={}){
  if(!window.jspdf){ throw new Error('PDF library not loaded — check your internet connection.'); }
  if(!window.html2canvas){ throw new Error('PDF renderer not loaded — check your internet connection.'); }
  const { jsPDF } = window.jspdf;

  const copies = opts.copies || ['ORIGINAL FOR RECIPIENT', 'DUPLICATE FOR SUPPLIER'];
  const doc = new jsPDF({unit:'pt', format:'a4', compress:true});
  const pageState = {firstPage:true};

  for(const copyLabel of copies){
    await renderInvoiceCopyIntoDoc(doc, inv, copyLabel, pageState);
  }

  const filename = `Invoice_${safeFilename(inv.number)}_${safeFilename(inv.customerName||'Customer')}.pdf`;
  if(opts.download){ doc.save(filename); }
  return {doc, filename};
}

/* ---- Monthly combined PDF — every invoice dated within a chosen month, one single
   (unlabelled) copy each, back to back in one PDF — meant to be handed straight to a
   CA/accountant for GST filing instead of sending invoices one by one. ---- */
function invoicesForMonth(monthValue){
  if(!monthValue) return [];
  const [yearStr, monStr] = monthValue.split('-');
  const year = parseInt(yearStr,10), monIdx = parseInt(monStr,10)-1;
  return DB.invoices
    .filter(i=>{ const d=new Date(i.date); return d.getFullYear()===year && d.getMonth()===monIdx; })
    .sort((a,b)=> new Date(a.date)-new Date(b.date) || String(a.number||'').localeCompare(String(b.number||'')));
}
async function generateMonthlyInvoicesPDF(monthValue){
  if(!window.jspdf){ throw new Error('PDF library not loaded — check your internet connection.'); }
  if(!window.html2canvas){ throw new Error('PDF renderer not loaded — check your internet connection.'); }
  const { jsPDF } = window.jspdf;

  const rows = invoicesForMonth(monthValue);
  if(!rows.length) return {doc:null, filename:null, count:0};

  const doc = new jsPDF({unit:'pt', format:'a4', compress:true});
  const pageState = {firstPage:true};
  for(const inv of rows){
    await renderInvoiceCopyIntoDoc(doc, inv, '', pageState); // '' = no ORIGINAL/DUPLICATE watermark, just one clean copy
  }

  const [yearStr, monStr] = monthValue.split('-');
  const monthLabel = new Date(parseInt(yearStr,10), parseInt(monStr,10)-1, 1)
    .toLocaleDateString('en-IN', {month:'short', year:'numeric'}).replace(/\s+/g,'_');
  const filename = `GST_Invoices_${monthLabel}_${safeFilename(DB.settings.companyName||'Company')}.pdf`;
  doc.save(filename);
  return {doc, filename, count: rows.length};
}

/* ---- Money formatter for PDFs ----
   jsPDF's built-in Helvetica has no glyph for the rupee sign (U+20B9), which is why
   the old statement printed the total as a stray quote mark followed by digits.
   Every amount that goes into a PDF is formatted through here instead. */
function fmtPDF(n){ return 'Rs. ' + fmtINR(n, false); }

/* Label for the financial year immediately before the current one, e.g. "26-27" -> "25-26" —
   used to tag the opening-balance row so it reads as a specific year, not a vague "B/F". */
function prevFYLabel(){
  const parts = currentFY().split('-').map(Number);
  const pad = n => String(n).padStart(2,'0');
  return pad(parts[0]-1) + '-' + pad(parts[1]-1);
}

/* Renders a one-page "Statement of Account" on LECO letterhead — pending bills only,
   with the customer's opening balance shown as an explicit "Balance B/F" row so the
   column actually adds up to the Total Balance Due printed at the bottom. Built with
   autoTable (same lightweight pattern as generatePurchaseBillPDF — no html2canvas). */
function generateCustomerBalancePDF(c, opts={}){
  if(!window.jspdf){ throw new Error('PDF library not loaded — check your internet connection.'); }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4', compress:true});
  const s   = DB.settings;

  const PW = doc.internal.pageSize.getWidth();   // 595.28
  const PH = doc.internal.pageSize.getHeight();  // 841.89
  const M  = 40;                                  // side margin
  const RX = PW - M;                              // right edge
  const HDR = 86;                                 // letterhead band height

  /* palette */
  const NAVY   = [22, 33, 59];
  const INDIGO = [59, 63, 160];
  const SLATE  = [91, 100, 114];
  const LINE   = [221, 225, 232];
  const ZEBRA  = [245, 246, 250];
  const RED    = [180, 35, 24];

  const cinv    = DB.invoices.filter(i=>i.customerId===c.id).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const pending = cinv.filter(i=>invBalance(i)>0);
  const opening = round2(c.openingBalance||0);
  const due     = round2(cinv.reduce((t,i)=>t+invBalance(i),0) + opening);

  /* ---------- letterhead + footer, drawn on every page ---------- */
  function drawChrome(pageNo){
    doc.setFillColor.apply(doc, NAVY);
    doc.rect(0, 0, PW, HDR, 'F');
    doc.setFillColor.apply(doc, INDIGO);
    doc.rect(0, HDR, PW, 6, 'F');

    /* monogram tile */
    const ms = 34, mx = M, my = (HDR - ms)/2;
    doc.setFillColor(255,255,255);
    doc.roundedRect(mx, my, ms, ms, 7, 7, 'F');
    doc.setTextColor.apply(doc, INDIGO);
    doc.setFont('helvetica','bold'); doc.setFontSize(13);
    doc.text('LE', mx + ms/2, my + ms/2 + 4.5, {align:'center'});

    const tx = mx + ms + 16;
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold'); doc.setFontSize(15.5);
    doc.text(String(s.companyName||'Company'), tx, 34);
    doc.setFont('helvetica','normal'); doc.setFontSize(8);
    doc.setTextColor(199, 203, 232);
    if(s.address) doc.text(String(s.address).slice(0,120), tx, 48);
    doc.text(`GSTIN ${s.gstin||'—'}    •    State: ${s.state||'—'} (${s.stateCode||'—'})`, tx, 60);

    /* footer */
    doc.setDrawColor.apply(doc, LINE); doc.setLineWidth(0.5);
    doc.line(M, PH - 38, RX, PH - 38);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
    doc.setTextColor.apply(doc, SLATE);
    doc.text(`${s.companyName||'Company'}  •  GSTIN ${s.gstin||'—'}`, M, PH - 25);
    doc.text(`Page ${pageNo}`, RX, PH - 25, {align:'right'});
    doc.setTextColor(0,0,0);
  }
  drawChrome(1);

  let y = HDR + 34;

  /* ---------- document title ---------- */
  doc.setTextColor.apply(doc, NAVY);
  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text('Statement of Account', M, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
  doc.setTextColor.apply(doc, SLATE);
  doc.text(`Statement date: ${fmtDate(new Date().toISOString())}`, RX, y - 7, {align:'right'});
  doc.text(`${pending.length} pending invoice${pending.length===1?'':'s'}`, RX, y + 4, {align:'right'});
  y += 10;
  doc.setDrawColor.apply(doc, INDIGO); doc.setLineWidth(1);
  doc.line(M, y, RX, y);
  y += 22;

  /* ---------- Bill To ---------- */
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
  doc.setTextColor.apply(doc, SLATE);
  doc.text('BILL TO', M, y);
  y += 14;
  doc.setFont('helvetica','bold'); doc.setFontSize(10.5);
  doc.setTextColor.apply(doc, NAVY);
  const nameLines = doc.splitTextToSize(String(c.name||'—'), 330);
  doc.text(nameLines, M, y);
  y += nameLines.length * 13;
  doc.setFont('helvetica','normal'); doc.setFontSize(8.2);
  doc.setTextColor.apply(doc, SLATE);
  if(c.billingAddress){
    const addr = doc.splitTextToSize(String(c.billingAddress), 330);
    doc.text(addr, M, y);
    y += addr.length * 10.5;
  }
  y += 2;
  if(c.phone) { doc.text(`Phone: ${c.phone}`, M, y); y += 11; }
  if(c.gstin) { doc.text(`GSTIN: ${c.gstin}`, M, y); y += 11; }
  y += 20;

  /* ---------- invoice table ---------- */
  const obItems = Array.isArray(c.openingBalanceItems) ? c.openingBalanceItems.filter(it=>round2(it.amount||0)>0) : [];
  const obfCount = obItems.length ? obItems.length : (opening>0 ? 1 : 0);
  if(pending.length || opening > 0){
    const body = [];
    if(obItems.length){
      /* itemised brought-forward bills (e.g. last year's unpaid invoices) — each listed
         on its own line so the statement reads like real bills, not one opaque total */
      obItems.forEach(it=>{
        body.push([
          {content:'—', styles:{halign:'center'}},
          it.number || `FY ${prevFYLabel()}`,
          it.date ? fmtDate(it.date) : '—',
          '—',
          fmtPDF(it.amount||0),
        ]);
      });
    } else if(opening > 0){
      body.push([{content:'—', styles:{halign:'center'}}, `FY ${prevFYLabel()}`, 'Balance B/F', '—', fmtPDF(opening)]);
    }
    pending.forEach((i, idx)=>{
      body.push([idx+1, i.number||'', fmtDate(i.date), fmtPDF(i.totals?.grandTotal||0), fmtPDF(invBalance(i))]);
    });

    doc.autoTable({
      startY: y,
      margin: {left:M, right:M, top:HDR + 24, bottom:52},
      head: [['#','INVOICE NO.','DATE','INVOICE AMOUNT','BALANCE DUE']],
      body: body,
      theme: 'grid',
      styles: {
        font:'helvetica', fontSize:8.4, cellPadding:{top:4, bottom:4, left:7, right:7},
        textColor: NAVY, lineColor: LINE, lineWidth:0.4, valign:'middle',
      },
      headStyles: {
        fillColor: NAVY, textColor:255, fontStyle:'bold', fontSize:8.2,
        cellPadding:{top:7, bottom:7, left:7, right:7}, lineWidth:0,
      },
      alternateRowStyles: { fillColor: ZEBRA },
      columnStyles: {
        0:{cellWidth:26, halign:'center', textColor:SLATE},
        1:{cellWidth:78},
        2:{cellWidth:74},
        3:{halign:'right'},
        4:{halign:'right', fontStyle:'bold'},
      },
      didParseCell: function(d){
        /* brought-forward rows read as carried-forward notes, not fresh invoices */
        if(d.section==='body' && d.row.index < obfCount){
          d.cell.styles.fontStyle  = 'italic';
          d.cell.styles.textColor  = SLATE;
          d.cell.styles.fillColor  = [251,251,253];
        }
      },
      didDrawPage: function(d){
        if(d.pageNumber > 1) drawChrome(d.pageNumber);
      },
    });
    y = doc.lastAutoTable.finalY;
  } else {
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    doc.setTextColor.apply(doc, SLATE);
    doc.text('No pending invoices — account fully settled.', M, y);
    doc.setTextColor(0,0,0);
    y += 24;
  }

  /* ---------- totals strip ---------- */
  /* if the table ended near the bottom, carry the totals + sign-off to a fresh page
     rather than letting them run off the sheet */
  if(y > PH - 150){
    doc.addPage();
    drawChrome(doc.internal.getNumberOfPages());
    y = HDR + 34;
  }
  y += 4;
  doc.setDrawColor.apply(doc, NAVY); doc.setLineWidth(1.1);
  doc.line(PW/2 - 30, y, RX, y);
  y += 19;
  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  doc.setTextColor.apply(doc, SLATE);
  const partsLabel = obItems.length
    ? `${pending.length} pending invoice${pending.length===1?'':'s'} + ${obItems.length} brought-forward bill${obItems.length===1?'':'s'}`
    : (opening>0
      ? `${pending.length} pending invoice${pending.length===1?'':'s'} + FY ${prevFYLabel()} balance`
      : `${pending.length} pending invoice${pending.length===1?'':'s'}`);
  doc.text(partsLabel, M, y);
  doc.setFont('helvetica','bold'); doc.setFontSize(10.5);
  doc.setTextColor.apply(doc, NAVY);
  doc.text('TOTAL BALANCE DUE', RX - 150, y, {align:'right'});
  doc.setFontSize(13.5);
  doc.setTextColor.apply(doc, RED);
  doc.text(fmtPDF(due), RX, y, {align:'right'});
  doc.setTextColor(0,0,0);

  /* ---------- note + signature ---------- */
  y += 30;
  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  doc.setTextColor.apply(doc, SLATE);
  doc.text(
    'Kindly clear the outstanding balance at your earliest convenience. Please quote the invoice number with your remittance. ' +
    'For any queries regarding this statement, feel free to reach out to us.',
    M, y, {maxWidth: PW - 2*M, lineHeightFactor:1.5}
  );
  y += 44;
  if(y < PH - 90){
    doc.setFont('helvetica','bold'); doc.setFontSize(9);
    doc.setTextColor.apply(doc, NAVY);
    doc.text(`For ${String(s.companyName||'Company').toUpperCase()}`, RX, y, {align:'right'});
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
    doc.setTextColor.apply(doc, SLATE);
    doc.text('Authorised Signatory', RX, y + 32, {align:'right'});
    doc.text('This is a system-generated statement and does not require a signature.', M, y + 32);
  }
  doc.setTextColor(0,0,0);

  const filename = `${safeFilename(c.name||'customer')}_statement.pdf`;
  if(opts.download){ doc.save(filename); }
  return { doc, filename, due, pendingCount: pending.length };
}

let INV_SEARCH='', INV_FILTER='all', INV_SORT='number';
let INV_GROUP = true;               // month-wise splitter on/off
const INV_COLLAPSED = new Set();    // month keys currently collapsed
function invMonthKey(i){
  const d = new Date(i.date);
  if(isNaN(d)) return 'nodate';
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function invMonthLabel(k){
  if(k==='nodate') return 'No date';
  const [y,m] = k.split('-');
  return new Date(parseInt(y,10), parseInt(m,10)-1, 1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});
}
// Turns the flat sorted rows into rows + month divider entries
function invBuildItems(rows){
  if(!INV_GROUP) return rows;
  const groups = new Map();
  rows.forEach(i=>{ const k=invMonthKey(i); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(i); });
  const asc = (INV_SORT==='numberAsc' || INV_SORT==='oldest');
  const keys = [...groups.keys()].sort((a,b)=>{
    if(a==='nodate') return 1; if(b==='nodate') return -1;
    return asc ? a.localeCompare(b) : b.localeCompare(a);
  });
  const out = [];
  keys.forEach(k=>{
    const list = groups.get(k);
    const grand = list.reduce((x,i)=>x+((i.totals||Calc.compute(i)).grandTotal||0),0);
    const out_ = list.reduce((x,i)=>x+invBalance(i),0);
    const collapsed = INV_COLLAPSED.has(k);
    out.push({__hdr:true, key:k, label:invMonthLabel(k), count:list.length, grand, outstanding:out_, collapsed});
    if(!collapsed) list.forEach(i=>out.push(i));
  });
  return out;
}
function parseInvNumForSort(num){
  const s = String(num||'');
  const m = s.match(/(\d+)\s*\/\s*(\d{2,4})-(\d{2,4})/);
  if(!m) return { fy:'', seq:0, raw:s };
  return { fy:m[2]+'-'+m[3], seq:parseInt(m[1],10) };
}
let INV_CA_MONTH = (()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); })();
function viewInvoices(){
  let rows = [...DB.invoices];
  const q = INV_SEARCH.toLowerCase();
  if(q){
    rows = rows.filter(i=> i.number.toLowerCase().includes(q) || i.customerName.toLowerCase().includes(q)
      || (i.items||[]).some(it=> (it.name||'').toLowerCase().includes(q) || (it.dwg||'').toLowerCase().includes(q)) );
  }
  const now = new Date();
  if(INV_FILTER==='thisMonth') rows = rows.filter(i=>{ const d=new Date(i.date); return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear(); });
  else if(INV_FILTER==='lastMonth'){ const lm=new Date(now.getFullYear(),now.getMonth()-1,1); rows = rows.filter(i=>{ const d=new Date(i.date); return d.getMonth()===lm.getMonth()&&d.getFullYear()===lm.getFullYear(); }); }
  else if(INV_FILTER==='thisFY'){ const fy=currentFY(); rows = rows.filter(i=> (i.number||'').endsWith(fy)); }

  if(INV_SORT==='number') rows.sort((a,b)=>{
    const pa = parseInvNumForSort(a.number), pb = parseInvNumForSort(b.number);
    if(pa.fy !== pb.fy) return pb.fy.localeCompare(pa.fy);
    if(pb.seq !== pa.seq) return pb.seq - pa.seq;
    return String(b.number||'').localeCompare(String(a.number||''));
  });
  else if(INV_SORT==='numberAsc') rows.sort((a,b)=>{
    const pa = parseInvNumForSort(a.number), pb = parseInvNumForSort(b.number);
    if(pa.fy !== pb.fy) return pa.fy.localeCompare(pb.fy);
    if(pa.seq !== pb.seq) return pa.seq - pb.seq;
    return String(a.number||'').localeCompare(String(b.number||''));
  });
  else if(INV_SORT==='newest') rows.sort((a,b)=>new Date(b.date)-new Date(a.date));
  else if(INV_SORT==='oldest') rows.sort((a,b)=>new Date(a.date)-new Date(b.date));
  else if(INV_SORT==='highest') rows.sort((a,b)=>(b.totals?.grandTotal||0)-(a.totals?.grandTotal||0));
  else if(INV_SORT==='lowest') rows.sort((a,b)=>(a.totals?.grandTotal||0)-(b.totals?.grandTotal||0));

  const sumTaxable = rows.reduce((s,i)=>s+((i.totals||Calc.compute(i)).taxableTotal||0),0);
  const sumGst = rows.reduce((s,i)=>{ const t=i.totals||Calc.compute(i); return s+((t.cgst||0)+(t.sgst||0)+(t.igst||0)); },0);
  const sumGrand = rows.reduce((s,i)=>s+((i.totals||Calc.compute(i)).grandTotal||0),0);
  const sumReceived = rows.reduce((s,i)=>s+round2(i.amountPaid||0),0);
  const sumOutstanding = rows.reduce((s,i)=>s+invBalance(i),0);

  return `
  <div class="page">
    <div class="toolbar">
      <div class="search-field">
        ${icon('search')}
        <input type="text" id="inv-search" placeholder="Search invoice #, customer, product or DWG…" value="${esc(INV_SEARCH)}" spellcheck="false">
      </div>
      <select id="inv-filter" class="sel-sm">
        <option value="all" ${INV_FILTER==='all'?'selected':''}>All Dates</option>
        <option value="thisMonth" ${INV_FILTER==='thisMonth'?'selected':''}>This Month</option>
        <option value="lastMonth" ${INV_FILTER==='lastMonth'?'selected':''}>Last Month</option>
        <option value="thisFY" ${INV_FILTER==='thisFY'?'selected':''}>This Financial Year</option>
      </select>
      <select id="inv-sort" class="sel-sm">
        <option value="number" ${INV_SORT==='number'?'selected':''}>Invoice # (High to Low)</option>
        <option value="numberAsc" ${INV_SORT==='numberAsc'?'selected':''}>Invoice # (Low to High)</option>
        <option value="newest" ${INV_SORT==='newest'?'selected':''}>Newest First</option>
        <option value="oldest" ${INV_SORT==='oldest'?'selected':''}>Oldest First</option>
        <option value="highest" ${INV_SORT==='highest'?'selected':''}>Highest Amount</option>
        <option value="lowest" ${INV_SORT==='lowest'?'selected':''}>Lowest Amount</option>
      </select>
      <select id="inv-group" class="sel-sm">
        <option value="month" ${INV_GROUP?'selected':''}>Split by Month</option>
        <option value="none" ${!INV_GROUP?'selected':''}>No Splitting</option>
      </select>
      ${INV_GROUP?`<button class="btn btn-sm" id="inv-collapse-all" type="button">${INV_COLLAPSED.size?'Expand all':'Collapse all'}</button>`:''}
      <span class="count-chip">${rows.length} invoice${rows.length===1?'':'s'}</span>
    </div>

    <div class="grid-cards" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:16px;">
      <div class="stat-card">
        <div class="stat-top"><div class="stat-label">Taxable Value</div><div class="stat-ico i-blue">${icon('layers')}</div></div>
        <div class="stat-value" style="font-size:20px;">${fmtINR(sumTaxable)}</div>
        <div class="stat-sub">Across the current filter</div>
      </div>
      <div class="stat-card">
        <div class="stat-top"><div class="stat-label">GST</div><div class="stat-ico i-violet">${icon('tag')}</div></div>
        <div class="stat-value" style="font-size:20px;">${fmtINR(sumGst)}</div>
        <div class="stat-sub">CGST + SGST + IGST</div>
      </div>
      <div class="stat-card">
        <div class="stat-top"><div class="stat-label">Grand Total</div><div class="stat-ico i-brand">${icon('rupee')}</div></div>
        <div class="stat-value" style="font-size:20px;">${fmtINR(sumGrand)}</div>
        <div class="stat-sub">Invoiced amount incl. GST</div>
      </div>
      <div class="stat-card">
        <div class="stat-top"><div class="stat-label">Received from Customers</div><div class="stat-ico i-green">${icon('check')}</div></div>
        <div class="stat-value" style="font-size:20px;">${fmtINR(sumReceived)}</div>
        <div class="stat-sub">${fmtINR(sumOutstanding)} still outstanding</div>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="card-hd">
        <div>
          <h3>Export for CA / GST Filing</h3>
          <div class="sub">One clean PDF containing every invoice for a month, in date order</div>
        </div>
        <div class="stat-ico i-green">${icon('printer')}</div>
      </div>
      <div class="card-bd">
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
          <input type="month" id="ca-month" value="${esc(INV_CA_MONTH)}" class="sel-sm" style="min-width:170px;">

      <tbody>

        if(i.__hdr){

          <td>

              ${(i.attachments&&i.attachments.length)?`<button class="btn btn-ghost btn-sm btn-icon" data-ia-att="${i.id}" title="View attached bill">${icon('paperclip')}</button>`:''}
              <button class="btn btn-ghost btn-sm btn-icon" data-view="${i.id}" title="View invoice">${icon('eye')}</button>

              <button class="btn btn-ghost btn-sm btn-icon danger" data-del="${i.id}" title="Delete">${icon('trash')}</button>
            </div>
          </td>
        </tr>`;
      }).join('') : `<tr><td colspan="7">${emptyState(
          INV_SEARCH||INV_FILTER!=='all' ? 'No invoices match this filter' : 'No invoices yet',
          INV_SEARCH||INV_FILTER!=='all' ? 'Try a different search term or widen the date range.' : 'Create your first GST tax invoice to get started.',
          INV_SEARCH||INV_FILTER!=='all' ? null : {label:'New Invoice', nav:'newInvoice', icon:'plus'})}</td></tr>`}
      </tbody>
    </table>
    </div>
  </div>`;
}
function caCountLabel(monthValue){
  const n = invoicesForMonth(monthValue).length;
  if(!monthValue) return '';
  const [yearStr, monStr] = monthValue.split('-');
  const label = new Date(parseInt(yearStr,10), parseInt(monStr,10)-1, 1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});
  return n ? `${n} invoice(s) in ${label}` : `No invoices in ${label}`;
}
function wireInvoices(){

  }));
  document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{
    if(!confirm('Permanently delete this invoice? This cannot be undone.')) return;
    const delId = b.dataset.del; DB.invoices = DB.invoices.filter(i=>i.id!==delId); invoiceRemove(delId); iaRemoveAll(delId); render(); toast('Invoice deleted','ok'); _xlRebuildAndWrite();
  }));
  document.querySelectorAll('[data-ipaid]').forEach(b=>b.addEventListener('click', ()=>toggleInvoicePaid(b.dataset.ipaid)));
  document.querySelectorAll('[data-ia-att]').forEach(b=>b.addEventListener('click', e=>{ e.stopPropagation(); const inv=DB.invoices.find(x=>x.id===b.dataset.iaAtt); if(!inv) return; if((inv.attachments||[]).length===1) iaOpen(inv, inv.attachments[0].id); else openInvoiceView(inv.id); }));
  document.querySelectorAll('[data-isent]').forEach(b=>b.addEventListener('click', e=>{ e.stopPropagation(); toggleInvoiceSent(b.dataset.isent); }));

function runReport(type, restore){
  const out = document.getElementById('report-output');
  const invs = DB.invoices;
  let title='', header=[], rows=[], prodMeta=null;
  if(type==='salesByMonth'){
    title='Sales by Month';
    const map={};
    invs.forEach(i=>{ const d=new Date(i.date); const k=d.toLocaleDateString('en-IN',{month:'short',year:'numeric'}); map[k]=map[k]||{count:0,tax:0,gst:0,total:0};
      const t=i.totals||Calc.compute(i); map[k].count++; map[k].tax+=t.taxableTotal; map[k].gst+=(t.cgst+t.sgst+t.igst); map[k].total+=t.grandTotal; });
    header=['Month','Invoices','Taxable','GST','Grand Total'];
    rows = Object.entries(map).map(([k,v])=>[k,v.count,fmtINR(v.tax),fmtINR(v.gst),fmtINR(v.total)]);
  } else if(type==='salesByCustomer'){
    title='Sales by Customer';
    const map={};
    invs.forEach(i=>{ map[i.customerName]=map[i.customerName]||{count:0,total:0}; map[i.customerName].count++; map[i.customerName].total += (i.totals?.grandTotal||0); });
    header=['Customer','Invoices','Total Billing'];
    rows = Object.entries(map).sort((a,b)=>b[1].total-a[1].total).map(([k,v])=>[k,v.count,fmtINR(v.total)]);
  } else if(type==='salesByProduct'){
    title='Sales by Product';
    const map={};
    invs.forEach(i=>(i.items||[]).forEach(it=>{
      const nm = it.name; const m = map[nm] = map[nm]||{qty:0,total:0,inv:{}};
      const q = clamp0(it.qty), v = (it.taxable||Calc.lineTaxable(it))+((it.gstAmount)||0);
      m.qty+=q; m.total+=v;
      const e = m.inv[i.id] = m.inv[i.id]||{id:i.id,number:i.number,date:i.date,customer:i.customerName,qty:0,total:0};
      e.qty+=q; e.total+=v;
    }));
    header=['Product','Qty Sold','Total Value'];
    const sorted = Object.entries(map).sort((a,b)=>b[1].total-a[1].total);
    rows = sorted.map(([k,v])=>[k,v.qty,fmtINR(v.total)]);
    prodMeta = sorted.map(([k,v])=>Object.values(v.inv).sort((a,b)=>new Date(b.date)-new Date(a.date)));
  } else if(type==='salesByProduct_unused'){
    // (legacy placeholder)
  } else if(type==='gstSummary'){
    title='GST Summary';
    let cgst=0,sgst=0,igst=0,tax=0;
    invs.forEach(i=>{ const t=i.totals||Calc.compute(i); cgst+=t.cgst; sgst+=t.sgst; igst+=t.igst; tax+=t.taxableTotal; });
    header=['Metric','Amount'];
    rows=[['Taxable Total',fmtINR(tax)],['CGST',fmtINR(cgst)],['SGST',fmtINR(sgst)],['IGST',fmtINR(igst)],['Total GST',fmtINR(cgst+sgst+igst)]];
  } else if(type==='invoiceRegister'){
    title='Invoice Register';
    header=['Invoice #','Date','Customer','Taxable','GST','Grand Total','Status'];
    rows = [...invs].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(i=>{ const t=i.totals||Calc.compute(i);
      return [i.number,fmtDate(i.date),i.customerName,fmtINR(t.taxableTotal),fmtINR(t.cgst+t.sgst+t.igst),fmtINR(t.grandTotal),i.status]; });
  }
  document.querySelectorAll('.rep-card').forEach(c=>c.classList.toggle('active', c.dataset.report===type));
  const numeric = new Set(['Invoices','Taxable','GST','Grand Total','Total Billing','Qty Sold','Total Value','Amount']);
  const isProd = type==='salesByProduct';
  out.innerHTML = `
  <div class="card">
    <div class="card-hd">
      <div>
        <h3>${esc(title)}</h3>
        <div class="sub" id="rep-count">${rows.length} row${rows.length===1?'':'s'} · generated just now</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        ${isProd?`<div class="search-field" style="min-width:260px;">${icon('search')}<input type="text" id="rep-search" placeholder="Search product, invoice no. or customer…" spellcheck="false" autocomplete="off"></div>`:''}
        <button class="btn btn-sm" id="rep-export">${icon('download')} Export CSV</button>
      </div>
    </div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr>${isProd?'<th style="width:28px"></th>':''}${header.map(h=>`<th class="${numeric.has(h)?'right':''}">${h}</th>`).join('')}${isProd?'<th class="right">Invoices</th>':''}</tr></thead>
    <tbody id="rep-body"></tbody></table></div>
  </div>`;
  const emptyRow = `<tr><td colspan="${header.length+(isProd?2:0)}">${emptyState('Nothing to report yet', 'Once you issue invoices, this report will fill in automatically.', {label:'New Invoice', nav:'newInvoice', icon:'plus'})}</td></tr>`;
  let shownRows = rows;
  const openNames = new Set((restore&&restore.open)||[]);
  const body = document.getElementById('rep-body');
  const drawBody = (q)=>{
    q = (q||'').trim().toLowerCase();
    if(!isProd){
      body.innerHTML = rows.length ? rows.map(r=>`<tr>${r.map((c,ci)=>`<td class="${numeric.has(header[ci])?'right nowrap':''}${ci===0?' t-strong':''}">${esc(c)}</td>`).join('')}</tr>`).join('') : emptyRow;
      return;
    }
    const terms = q.split(/\s+/).filter(Boolean);
    shownRows = [];
    let html='';
    rows.forEach((r,idx)=>{
      const invList = prodMeta[idx];
      const hay = (r[0]+' '+invList.map(x=>x.number+' '+x.customer).join(' ')).toLowerCase();
      if(terms.length && !terms.every(t=>hay.includes(t))) return;
      shownRows.push(r.concat([invList.map(x=>x.number).join(' | ')]));
      const auto = openNames.has(r[0]) || (terms.length>0 && !terms.every(t=>String(r[0]).toLowerCase().includes(t))); // matched via invoice/customer -> open
      html += `<tr class="rep-prow" data-pi="${idx}" style="cursor:pointer;"><td><span class="rep-caret" style="display:inline-block;transition:transform .15s;">▸</span></td>
        <td class="t-strong">${esc(r[0])}</td><td class="right nowrap">${esc(r[1])}</td><td class="right nowrap">${esc(r[2])}</td>
        <td class="right nowrap"><span class="count-chip">${invList.length} invoice${invList.length===1?'':'s'}</span></td></tr>
        <tr class="rep-pdet" data-pd="${idx}" ${auto?'':'hidden'}><td></td><td colspan="4" style="padding:0 0 12px;">
          <table class="tbl" style="margin:0;"><thead><tr><th>Invoice #</th><th>Date</th><th>Customer</th><th class="right">Qty</th><th class="right">Value</th></tr></thead><tbody>
          ${invList.map(x=>`<tr><td class="t-strong"><a href="#" data-invview="${esc(x.id)}" style="color:var(--brand-600,#4f46e5);text-decoration:underline;">${esc(x.number)}</a></td><td class="nowrap">${esc(fmtDate(x.date))}</td><td>${esc(x.customer)}</td><td class="right">${x.qty}</td><td class="right nowrap">${esc(fmtINR(x.total))}</td></tr>`).join('')}
          </tbody></table></td></tr>`;
      if(auto){ /* caret state set below */ }
    });
    body.innerHTML = html || `<tr><td colspan="5" style="text-align:center;padding:28px;color:var(--ink-500);">No product or invoice matches “${esc(q)}”.</td></tr>`;
    body.querySelectorAll('.rep-pdet:not([hidden])').forEach(d=>{ const c=body.querySelector(`.rep-prow[data-pi="${d.dataset.pd}"] .rep-caret`); if(c) c.style.transform='rotate(90deg)'; });
    document.getElementById('rep-count').textContent = `${shownRows.length} of ${rows.length} rows · generated just now`;
  };
  drawBody('');
  REPORT_LIVE = ()=>({type, open:[...openNames], query:(document.getElementById('rep-search')||{}).value||''});
  if(isProd){
    body.addEventListener('click', e=>{
      const a = e.target.closest('[data-invview]');
      if(a){
        e.preventDefault();
        openInvoiceView(a.dataset.invview); return;
      }
      const tr = e.target.closest('.rep-prow'); if(!tr) return;
      const d = body.querySelector(`.rep-pdet[data-pd="${tr.dataset.pi}"]`);
      d.hidden = !d.hidden;
      const nm = rows[+tr.dataset.pi][0]; d.hidden ? openNames.delete(nm) : openNames.add(nm);
      tr.querySelector('.rep-caret').style.transform = d.hidden ? '' : 'rotate(90deg)';
    });
    const si = document.getElementById('rep-search');
    si.addEventListener('input', e=>drawBody(e.target.value));
    if(restore && restore.query){ si.value = restore.query; drawBody(restore.query); }

  }
  document.querySelectorAll('.rep-card').forEach(c=>c.classList.toggle('active', c.dataset.report===type));
  document.getElementById('rep-export').addEventListener('click', ()=>{
    if(isProd) downloadCSV(safeFilename(title).toLowerCase()+'.csv', header.concat(['Invoices']), shownRows);
    else downloadCSV(safeFilename(title).toLowerCase()+'.csv', header, rows);
  });
  wireGoto(out);
}

/* ================= ADDA SYSTEM (Non-GST vehicle bills) — ported from Kelvin ================= */
const NgbCalc = {
  lineBase(item){ const days=(item.daysNA||item.days===undefined)?1:clamp0(item.days); return clamp0(item.rate)*(days||1); },
  lineDiscount(item){ const base=this.lineBase(item);
    if(item.discountType==='pct') return round2(base*clamp0(item.discountValue)/100);
    if(item.discountType==='fixed') return round2(clamp0(item.discountValue)); return 0; },
  lineTaxable(item){
    if(item.taxableOverride!==undefined && item.taxableOverride!==null && item.taxableOverride!=='') return round2(clamp0(item.taxableOverride));
    return round2(clamp0(this.lineBase(item)-this.lineDiscount(item))); },
  invoiceDiscountAmount(items,discount){
    const subtotal=items.reduce((s,it)=>s+this.lineTaxable(it),0);
    if(!discount||!discount.value) return 0;
    if(discount.type==='pct') return round2(subtotal*clamp0(discount.value)/100);
    return round2(Math.min(clamp0(discount.value),subtotal)); }
};
const K_NONGST_BILLS = 'nonGstBills';
let NGB = { bills:[], status:'idle', error:'' };
async function loadNonGstBills(){
  NGB.status = 'loading'; NGB.error = '';
  try{
    const snap = await Promise.race([
      RTDB_ROOT.child(K_NONGST_BILLS).get(),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('Timed out talking to the database.')),15000))
    ]);
    const val = snap.exists() ? (snap.val() || {}) : {};
    NGB.bills = Object.keys(val).map(id => val[id] && val[id].value).filter(b => b && typeof b === 'object');
    try{ NGB_COUNTER = await storeGet('nonGstCounter', null); }catch(e){}
    NGB.status = 'ready';
  }catch(e){
    console.error('loadNonGstBills failed', e);
    NGB.status = 'error';
    NGB.error = (e && e.message) ? e.message : 'Could not load Non-GST bills.';
  }
}
function ngbTotal(b){ const n = Number(b && b.totals && b.totals.grandTotal); return isFinite(n) ? n : 0; }
function ngbReceived(b){ const n = Number(b && b.amountPaid); return isFinite(n) ? n : 0; }
function ngbBalance(b){ return Math.max(0, round2(ngbTotal(b) - ngbReceived(b))); }
function nonGstStats(){
  const list = NGB.bills;
  const totalValue = round2(list.reduce((s,b)=>s+ngbTotal(b),0));
  const received   = round2(list.reduce((s,b)=>s+ngbReceived(b),0));
  const outstanding = round2(list.reduce((s,b)=>s+ngbBalance(b),0));
  const paid   = list.filter(b => ngbTotal(b) > 0 && ngbBalance(b) <= 0).length;
  const unpaid = list.filter(b => ngbBalance(b) > 0).length; // includes part-paid bills
  return { count:list.length, totalValue, received, outstanding, paid, unpaid };
}
let NGB_SYNC_STARTED = false;
function startNonGstLiveSync(){
  if(NGB_SYNC_STARTED) return;
  NGB_SYNC_STARTED = true;
  const ref = RTDB_ROOT.child(K_NONGST_BILLS);
  let ready = false;
  ref.once('value', ()=>{ setTimeout(()=>{ ready = true; }, 0); }, ()=>{}); // let the initial child_added dump pass silently
  const refresh = ()=>{ if(VIEW==='nonGstBills') render(); };
  const applyRemote = (id, bill)=>{
    if(LOCAL_WRITE_FLAG['ngb:'+id]){ LOCAL_WRITE_FLAG['ngb:'+id] = false; return; }
    if(!ready) return;
    const idx = NGB.bills.findIndex(x=>x.id===id);
    if(idx>=0) NGB.bills[idx] = bill; else NGB.bills.push(bill);
    refresh();
  };
  const onErr = err=>console.error('non-GST live sync error', err);
  ref.on('child_added',   snap=>{ const b = snap.val() && snap.val().value; if(b) applyRemote(snap.key, b); }, onErr);
  ref.on('child_changed', snap=>{ const b = snap.val() && snap.val().value; if(b) applyRemote(snap.key, b); }, onErr);
  ref.on('child_removed', snap=>{
    if(LOCAL_WRITE_FLAG['ngb:'+snap.key]){ LOCAL_WRITE_FLAG['ngb:'+snap.key] = false; return; }
    if(!ready) return;
    NGB.bills = NGB.bills.filter(x=>x.id!==snap.key);
    refresh();
  }, onErr);
}

function ngbMaxSeq(prefix, fy){
  let m = 0;
  (NGB.bills||[]).forEach(b=>{
    const x = String(b.number||''); const suffix = '/'+fy;
    if(x.indexOf(prefix)===0 && x.slice(-suffix.length)===suffix){
      const n = parseInt(x.slice(prefix.length, x.length-suffix.length),10); if(isFinite(n) && n>m) m=n;
    }
  });
  return m;
}
function ngbPeekNumber(){
  const fy = currentFY(); const c = NGB_COUNTER||{};
  const prefix = c.prefix!==undefined ? c.prefix : 'NG-'; const pad = c.pad||3;
  let seq = (c.fy===fy) ? (c.seq||0) : 0;
  seq = Math.max(seq, ngbMaxSeq(prefix, fy)) + 1;
  return { number: `${prefix}${String(seq).padStart(pad,'0')}/${fy}`, seq, fy };
}
async function claimNgbNumber(){
  const fy = currentFY();
  const ref = RTDB_ROOT.child(K_NONGST_COUNTER).child('value');
  for(let tries=0; tries<6; tries++){
    const result = await ref.transaction(cur=>{
      let c = (cur && typeof cur==='object') ? {...cur} : { fy, seq:0, prefix:'NG-', pad:3 };
      if(c.fy!==fy){ c.fy = fy; c.seq = 0; }
      if(c.prefix===undefined) c.prefix='NG-'; if(!c.pad) c.pad=3;
      c.seq = Math.max(c.seq||0, ngbMaxSeq(c.prefix, fy)) + 1;
      return c;
    });
    if(!result.committed || !result.snapshot || !result.snapshot.exists()) throw new Error('Could not reserve a bill number — check your internet connection and try again.');
    const c = result.snapshot.val(); NGB_COUNTER = c;
    const number = `${c.prefix}${String(c.seq).padStart(c.pad||3,'0')}/${c.fy}`;
    if(!NGB.bills.some(b=>b.number===number)) return number;
  }
  throw new Error('Could not reserve a unique bill number.');
}
function ngbCompute(b){
  const items = b.items||[];
  const lines = items.map(it=>({...it, amount: NgbCalc.lineTaxable(it)}));
  const subtotal = round2(lines.reduce((s,l)=>s+l.amount,0));
  const discountAmount = NgbCalc.invoiceDiscountAmount(items, b.discount||{type:'pct',value:0});
  const net = round2(subtotal - discountAmount);
  const ch = b.charges||{};
  const chargesTotal = round2(clamp0(ch.freight)+clamp0(ch.packing)+clamp0(ch.transport)+clamp0(ch.other));
  const preRound = round2(net + chargesTotal);
  const roundOffOn = b.roundOffEnabled!==undefined ? !!b.roundOffEnabled : (DB.settings ? DB.settings.roundOffEnabled!==false : true);
  const grandTotal = roundOffOn ? Math.round(preRound) : round2(preRound);
  return { lines, subtotal, discountAmount, net, chargesTotal, preRound, roundOffOn,
    roundOff: round2(grandTotal-preRound), grandTotal,
    totalQty: items.reduce((s,it)=>s+(it.qtyNA?0:clamp0(it.qty)),0), amountInWords: amountToWords(grandTotal) };
}

      si.addEventListener('focus', wireAC, {once:true});
      si.addEventListener('pointerdown', wireAC, {once:true});
    }
    rowEl.querySelectorAll('.item-field').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        const f = inp.dataset.field;
        item[f] = (f==='discountType'||f==='dwg') ? inp.value : (parseFloat(inp.value)||0);
        if(f!=='taxableOverride' && f!=='qty' && f!=='dwg') item.taxableOverride = null;
        updateNgbTotalsOnly();
      });
    });
    rowEl.querySelectorAll('[data-na]').forEach(btn=>btn.addEventListener('click', ()=>{
      const flag = btn.dataset.na; item[flag] = !item[flag];
      const nf = flag==='qtyNA'?'qty':'days'; if(!item[flag] && !(item[nf]>0)) item[nf]=1;
      if(flag==='daysNA') item.taxableOverride = null; render();
    }));
    const rm = rowEl.querySelector('[data-remove-row]');
    if(rm) rm.addEventListener('click', ()=>{ if(b.items.length===1){ toast('A bill needs at least one item.','err'); return; } b.items = b.items.filter(i=>i.rowId!==rowId); render(); });
  });
  const add = document.getElementById('ngb-add-item'); if(add) add.addEventListener('click', ()=>{ b.items.push(blankNgbItem()); render(); });
  ngbWireImport(b);
  ngbBind('ngb-number', v=>{ b.number=v; b.autoNumber=false; });
  ngbBind('ngb-date', v=>b.date=v); wireBillMonth('ngb', v=>b.billMonth=v); ngbBind('ngb-dest', v=>b.destination=v);
  ngbBind('ngb-ref', v=>b.refNo=v); ngbBind('ngb-notes', v=>b.notes=v);
  ngbBind('ngb-disctype', v=>{ b.discount.type=v; updateNgbTotalsOnly(); });
  ngbBind('ngb-discval', v=>{ b.discount.value=parseFloat(v)||0; updateNgbTotalsOnly(); });
  ['freight','packing','transport','other'].forEach(k=>ngbBind('ngb-'+k, v=>{ b.charges[k]=parseFloat(v)||0; updateNgbTotalsOnly(); }));
  const sb = document.getElementById('ngb-showbank'); if(sb) sb.addEventListener('change', ()=>{ b.showBank = sb.checked; });
  const bk = document.getElementById('ngb-bank'); if(bk) bk.addEventListener('change', ()=>{ b.bankAccountId = bk.value||null; });
}
function validateNgb(b){
  if(!b.customerId && !(b.customerName||'').trim()) return 'Please select a customer or type a customer name.';
  if(!b.date) return 'Bill date is required.';
  if(!b.number || !b.number.trim()) return 'Bill number is required.';
  if(NGB.bills.some(x=>x.number===b.number && x.id!==b.id)) return `Bill number ${b.number} is already used by another Non-GST bill.`;
  if(!b.items.some(i=>i.name && i.name.trim())) return 'Add at least one item.';
  for(const it of b.items){ if(it.name && !it.qtyNA && !(it.qty>0)) return `Vehicles must be greater than 0 for "${it.name}".`; }
  return null;
}
async function saveNonGstBill(){
  const b = CURRENT_NGB; const err = validateNgb(b);
  if(err){ toast(err,'err'); return false; }
  b.items = b.items.filter(i=>i.name && i.name.trim());
  b.totals = ngbStoredTotals(b);
  const s = DB.settings||{};
  b.companySnapshot = { companyName:s.companyName, tagline:s.tagline, address:s.address, pan:s.pan, phone:s.phone, email:s.email, signatureLabel:s.signatureLabel, declaration:s.declaration };
  b.bankSnapshot = b.showBank===false ? null : {...resolveInvoiceBankAccount(b)};
  const isNew = !b.id;
  if(isNew){
    b.id = uid('ngb_'); b.createdAt = nowISO();
    if(b.autoNumber!==false){
      try{ b.number = await claimNgbNumber(); }
      catch(e){ toast(e.message,'err'); b.id=null; return false; }
    }
    delete b.autoNumber;
  }
  b.updatedAt = nowISO();
  const clean = {...b}; delete clean._readonly;
  const ok = await nonGstBillSet(b.id, clean);
  if(!ok){ if(isNew) b.id=null; toast('Could not save the bill — check your internet connection and try again.','err'); return false; }
  const idx = NGB.bills.findIndex(x=>x.id===clean.id);
  if(idx>=0) NGB.bills[idx]=clean; else NGB.bills.push(clean);
  toast('Non-GST bill saved','ok'); goto('nonGstBills'); return true;
}

function ngbLiveStatement(b){
  const near=(x,y)=>Math.abs((Number(x)||0)-(Number(y)||0))<0.005;
  const src=(b.vehicleStatement||[]).filter(r=>r&&r.vno).map(r=>({...r}));
  const lines=(b.items||[]).filter(i=>i&&i.name&&String(i.name).trim()).map(it=>({it, amt:NgbCalc.lineTaxable(it), rows:[], used:false}));
  if(!src.length) return {rows:[], extras:lines.map(l=>({name:l.it.name, sub:l.it.dwg||'', amount:l.amt}))};
  const pool=[], dropped=new Set();
  const lineById=new Map(); lines.forEach(x=>{ if(x.it.rowId!=null) lineById.set(x.it.rowId,x); });   // O(1) lookup (was a slow find() per vehicle)
  src.forEach(r=>{
    let l=null;
    if(r.itemRowId){                                   // linked at import time
      l=lineById.get(r.itemRowId);
      if(!l){ dropped.add(r); return; }                // its bill line was deleted → vehicle is no longer billed
    } else {                                           // bills imported before links existed: best-effort match
      l = lines.find(x=>x.it.name===r.vno && !x.rows.length)
       || lines.find(x=>x.it.name===(r.type||'') && near(x.it.rate,r.rate))
       || (!r.type ? lines.find(x=>/vehicle-days/i.test(x.it.dwg||'') && near(x.it.rate,r.rate)) : null);
      if(!l){ pool.push(r); return; }
    }
    l.rows.push(r);
  });
  /* spread a bill-line amount over its vehicle rows (pro-rata to their old amounts, else days) */
  const alloc=(R,target)=>{
    const old=R.reduce((a,r)=>a+(Number(r.amount)||0),0);
    if(near(old,target)) return;
    let w=R.map(r=> old>0 ? (Number(r.amount)||0) : (Number(r.days)||0)), W=w.reduce((a,c)=>a+c,0);
    if(!(W>0)){ w=R.map(()=>1); W=R.length; }
    let acc=0;
    R.forEach((r,i)=>{
      r.amount = i===R.length-1 ? round2(target-acc) : round2(target*w[i]/W);
      acc=round2(acc+r.amount);
      const d=Number(r.days)||0; if(d>0) r.rate=round2(r.amount/d);
    });
  };
  lines.forEach(l=>{
    const R=l.rows; if(!R.length) return; l.used=true;
    if(R.length===1 && !l.it.daysNA){                  // one line per vehicle: take days / rate / amount straight from the line
      const r=R[0], d=(l.it.days===undefined) ? (Number(r.days)||0) : clamp0(l.it.days);
      r.days=d; r.amount=l.amt;
      const lr=clamp0(l.it.rate);
      r.rate = near(round2(lr*d), l.amt) ? lr : (d>0 ? round2(l.amt/d) : r.rate);
    } else alloc(R,l.amt);                             // grouped line: share its amount across its vehicles
  });
  const free=lines.filter(l=>!l.used);
  if(pool.length){
    if(free.length){ alloc(pool, round2(free.reduce((a,l)=>a+l.amt,0))); free.forEach(l=>l.used=true); }
    else pool.forEach(r=>dropped.add(r));
  }
  return {
    rows: src.filter(r=>!dropped.has(r)),
    extras: lines.filter(l=>!l.used).map(l=>({name:l.it.name, sub:l.it.dwg||'', amount:l.amt}))
  };
}
function ngbStatementBarHTML(b, readonly){
  if(!(b.vehicleStatement||[]).length) return '';

function printNgb(b){

async function generateNgbPDF(b){
  if(!window.jspdf || !window.html2canvas) throw new Error('PDF libraries not loaded — check your internet connection.');
  const err = validateNgb(b); if(err) throw new Error(err);
  const isAdda = !!(b.importedFrom && Array.isArray(b.vehicleStatement) && b.vehicleStatement.length);
  const host = document.createElement('div'); host.style.cssText='position:fixed;left:-10000px;top:0;background:#fff;width:794px;';
  // Adda export: the user wants ONLY the vehicle-wise statement (the original second page).
  // Do not export the summary/invoice first page. Non-Adda bills keep their normal layout.
  // Keep the full generated wrapper (including its embedded annexure CSS) in the DOM.
  // For Adda bills, capture only the vehicle-statement page; the summary bill remains unexported.
  host.innerHTML = isAdda ? buildNgbAddaOnePageHTML(b) : buildNgbPaperHTML({...b, items:(b.items||[]).filter(i=>i.name), showAnnexure:false});
  document.body.appendChild(host);
  try{
    try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready; }catch(_){}
    await new Promise(r=>setTimeout(r,180));
    const {jsPDF} = window.jspdf; const doc = new jsPDF({unit:'pt', format:'a4', compress:true});
    const pw = doc.internal.pageSize.getWidth(), ph = doc.internal.pageSize.getHeight();
    const papers = Array.from(host.querySelectorAll('.ngp'));
    const paper = papers[0];
    if(!paper) throw new Error(isAdda ? 'Vehicle statement could not be generated. Check that the imported bill has vehicle records.' : 'Bill layout could not be generated.');
    const canvas = await html2canvas(paper, {scale:2, useCORS:true, backgroundColor:'#fff', windowWidth:794});
    const scale = Math.min(pw / canvas.width, ph / canvas.height);
    const drawW = canvas.width * scale, drawH = canvas.height * scale;
    doc.addImage(canvas.toDataURL('image/jpeg',0.96), 'JPEG', (pw-drawW)/2, 0, drawW, drawH);
    doc.save(`Bill_${safeFilename(b.number)}_${safeFilename(b.customerName||'Customer')}.pdf`);
  } finally { host.remove(); }
}
async function recordNgbPayment(id, entry){
  const b = NGB.bills.find(x=>x.id===id); if(!b) return false;
  const amt = round2(Number(entry.amount)||0); if(amt<=0){ toast('Enter an amount greater than ₹0','err'); return false; }
  const bal = ngbBalance(b);
  if(amt > bal+0.5 && !confirm(`This is more than the outstanding ${fmtINR(bal)}. Record it anyway (as an advance)?`)) return false;
  if(!Array.isArray(b.paymentHistory)) b.paymentHistory=[];
  b.paymentHistory.push({id:uid('pay_'), date:entry.date||todayInputDate(), amount:amt, mode:entry.mode||'Other', note:(entry.note||'').trim(), recordedAt:nowISO()});
  b.amountPaid = round2(ngbReceived(b)+amt); b.updatedAt = nowISO();
  const ok = await nonGstBillSet(b.id, b); render();
  toast(ok?`Payment of ${fmtINR(amt)} recorded`:'Could not save the payment — check your connection.', ok?'ok':'err'); return ok;
}

async function toggleNgbPaid(id){

  if(!(ngbTotal(b)>0)){ toast('This bill has no value to mark as paid.','err'); return; }

  try{
    const bal = ngbBalance(b);
    if(bal>0){
      await recordNgbPayment(id, {amount:bal, date:todayInputDate(), mode:'Other', note:'Marked as paid from register'});
    } else {
      const n=(b.paymentHistory||[]).length, amt=ngbReceived(b);
      if(!confirm(`Mark ${b.number} as UNPAID?\n\nThis removes ${n?n+' recorded payment'+(n>1?'s':''):'the received amount'} (${fmtINR(amt)}) from this bill.`)) { render(); return; }

      const ok = await nonGstBillSet(b.id, b); render();

    }
  } finally { NGB_TOGGLE_BUSY = false; }
}

function resolveInvoiceBankAccount(inv){

  const custDefault = cust && cust.defaultBankAccountId ? getBankAccountById(cust.defaultBankAccountId) : null;
  if(custDefault) return custDefault;
  const def = getDefaultBankAccount();
  if(def) return def;
  const s = DB.settings||{};
  return { bankName:s.bankName||'', bankAccountName:s.bankAccountName||'', bankAccountNo:s.bankAccountNo||'', bankBranch:s.bankBranch||'', bankIFSC:s.bankIFSC||'', upi:s.upi||'' };

function fmtMonth(ym){ if(!ym) return '';

    if(a&&b&&a!==b){

        return y1===y2 ? n(y1,m1,false)+' – '+n(y2,m2,true) : n(y1,m1,true)+' – '+n(y2,m2,true);

    }

  }

  return new Date(y,m-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'}); }
function getBankAccountById(id){

function getDefaultBankAccount(){

function impParseDate(v){

  if(typeof v==='number'){ if(v<20000||v>80000) return null; return new Date(Date.UTC(1899,11,30)+Math.floor(v)*864e5).toISOString().slice(0,10); }

  if((m=s.match(/^(\d{1,2})[-\/. ]*([A-Za-z]{3,9})[-\/. ,]*(\d{4}|\d{2})(?!\d)/))){ const mo=IMP_MONTHS[m[2].slice(0,3).toLowerCase()]; if(mo) return impISO(+m[3],mo,+m[1]); }

function impISO(y,m,d){ if(y<100) y+=2000; const dt=new Date(Date.UTC(y,m-1,d));

function impCols(){ let n=0; IMP.grid.slice(0,60).forEach(r=>{ if(r.length>n) n=r.length; }); return n; }

function impAutoMap(){
  const g=IMP.grid, kw=/vehicle|veh|regn|registration|plate|truck|lorry|number|date|entry|exit|\bin\b|\bout\b|inward|outward|arriv|depart|rate|type|category/;
  let best=-1,bi=-1;
  for(let r=0;r<Math.min(g.length,25);r++){ const sc=g[r].filter(c=>typeof c==='string'&&kw.test(impNorm(c))).length; if(sc>best){best=sc;bi=r;} }
  IMP.headerRow = best>=2 ? bi : -1;
  const n=impCols(), hd=[]; for(let c=0;c<n;c++) hd[c]= IMP.headerRow>=0 ? impNorm(g[IMP.headerRow][c]) : '';
  const used=new Set();
  const find=(re,not)=>{ for(let c=0;c<n;c++){ const h=hd[c]; if(!used.has(c)&&h&&re.test(h)&&!(not&&not.test(h))){ used.add(c); return c; } } return -1; };
  const m={};
  m.veh=find(/vehicle|veh\b|regn|registration|reg no|plate|truck|lorry|chassis/,/type|category|class|date|rate|\b(in|out|entry|exit)\b/);
  if(m.veh<0) m.veh=find(/\bno\b|number|num\b/,/date|rate|sr\b|s no|serial|challan|bill|invoice|phone|mobile/);
  m.in=find(/\b(in|entry|entered|inward|arrival|arrived|received|checkin|check in)\b/,/\b(out|exit)\b/);
  m.out=find(/\b(out|exit|exited|outward|departure|departed|release|released|checkout|check out)\b/);
  m.rate=find(/\b(rate|tariff|charges?|per day)\b/,/total/);
  m.type=find(/\b(type|category|class|segment)\b/,/date/);
  const data=g.slice(IMP.headerRow+1,IMP.headerRow+201);
  const frac=(c,fn)=>{ const v=data.map(r=>r[c]).filter(x=>x!==''&&x!=null); return v.length? v.filter(fn).length/v.length : 0; };
  if(m.veh<0){ let bc=-1,bf=0.5; for(let c=0;c<n;c++){ if(used.has(c)) continue; const f=frac(c,impIsPlate); if(f>bf){bf=f;bc=c;} } if(bc>=0){ m.veh=bc; used.add(bc); } }
  if(m.in<0||m.out<0){ const dc=[]; for(let c=0;c<n;c++){ if(!used.has(c)&&frac(c,x=>!!impParseDate(x))>0.5) dc.push(c); }
    if(m.in<0 && dc.length){ m.in=dc.shift(); used.add(m.in); } if(m.out<0 && dc.length){ m.out=dc.shift(); used.add(m.out); } }
  ['veh','in','out','rate','type'].forEach(k=>{ if(m[k]===undefined) m[k]=-1; });
  IMP.map=m;
}

function impIsPlate(v){ const s=String(v==null?'':v).toUpperCase().replace(/[\s-]/g,''); return /^(?=.*[A-Z])(?=.*\d)[A-Z0-9]{6,12}$/.test(s); }

async function init(){

  wireShell();

  // real numbers immediately instead of sitting at ₹0.00 while Firebase loads over the network.
  try{
    const cached = await cacheLoadDB();
    if(cached && cached.settings){
      DB.settings = cached.settings; DB.products = cached.products||[]; DB.customers = cached.customers||[];
      DB.invoices = cached.invoices||[]; DB.counter = cached.counter; DB.suppliers = cached.suppliers||[];
      DB.purchases = cached.purchases||[]; DB.purchaseCounter = cached.purchaseCounter;

  }catch(e){
    console.error('firebase auth failed', e);

  }

  loadNonGstBills().then(()=>{ if(NGB.status==='ready') startNonGstLiveSync(); if(VIEW==='nonGstBills') render(); }).catch(e=>console.error('Adda init failed', e));
  try{
    await Promise.race([
      loadAll(),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('Timed out talking to the database. Check the databaseURL in firebaseConfig and your Realtime Database security rules.')), 12000))
    ]);
  }catch(e){
    // First attempt can be slower than usual the very first time this device runs the new
    // per-invoice storage (it has to read the old data once to migrate it) — retry once with
    // a longer window before giving up and showing an error.
    console.warn('loadAll first attempt failed, retrying with a longer timeout', e);
    try{
      await Promise.race([
        loadAll(),
        new Promise((_,rej)=>setTimeout(()=>rej(new Error('Timed out talking to the database. Check the databaseURL in firebaseConfig and your Realtime Database security rules.')), 30000))
      ]);
    }catch(e2){
      console.error('loadAll failed', e2);
      toast('Could not load your data: ' + (e2.message||''), 'err');
      return;
    }
  }
  startLiveSync();
  try{ ipCleanLogoSrc(DB.settings && DB.settings.logoDataUrl); }catch(e){}
  _xlTryAutoReconnect();
  cacheSaveDB(); // refresh the local snapshot so the NEXT load is instant too
  // One-time: strip the white background from a logo that was uploaded before this fix.
  try{
    if(DB.settings && DB.settings.logoDataUrl && !DB.settings.logoBgClean){
      const cleaned = await removeLogoWhiteBg(DB.settings.logoDataUrl);
      DB.settings.logoDataUrl = cleaned;
      DB.settings.logoBgClean = true;
      await persist('settings');
      cacheSaveDB();
      toast('Logo background cleaned','ok');
    }
  }catch(e){ console.warn('Stored-logo cleanup skipped', e); }
  // recover draft if present and no invoices editor open
  try{
    const draft = await storeGet(K_DRAFT, null);
    if(draft && draft.items && draft.items.some(i=>i.name) && !draft.id){
      setTimeout(()=>{
        if(confirm(`You have an unsaved invoice draft from ${draft._savedAt||'earlier'}. Restore it?`)){
          CURRENT_INVOICE = draft; goto('newInvoice');
        } else { storeSet(K_DRAFT, null); }
      }, 300);
    }
  }catch(e){}
  renderNav();
  render();
}

</script>





<style>
.hsn-suggest-box{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:99999;max-height:190px;overflow:auto;background:#fff;border:1px solid #d9deea;border-radius:9px;box-shadow:0 10px 28px rgba(15,23,42,.16);padding:5px;display:none}
.hsn-suggest-item{display:block;width:100%;text-align:left;border:0;background:transparent;color:#172033;padding:9px 11px;border-radius:6px;font:500 13px Inter,Arial,sans-serif;cursor:pointer}
.hsn-suggest-item:hover,.hsn-suggest-item:focus{background:#eef2ff;outline:0}
.hsn-suggest-empty{padding:9px 11px;color:#7b8498;font:12px Inter,Arial,sans-serif}
</style>
<script>
(function(){
  'use strict';
  var KEY='billingPanelSavedHSNCodes:'+WS_KEY;
  var activeInput=null;
  function readCodes(){
    try { var v=JSON.parse(localStorage.getItem(KEY)||'[]'); return Array.isArray(v)?v:[]; }
    catch(e){ return []; }
  }
  function saveCode(raw){
    var code=String(raw||'').trim();
    if(!code) return;
    var list=readCodes();
    if(!list.some(function(x){return String(x).toLowerCase()===code.toLowerCase();})){
      list.push(code);
      try{localStorage.setItem(KEY,JSON.stringify(list.slice(-300)));}catch(e){}
    }
  }
  function getBox(input){
    var field=input.closest('.field')||input.parentElement;
    if(!field) return null;
    if(getComputedStyle(field).position==='static') field.style.position='relative';
    var box=field.querySelector('.hsn-suggest-box');
    if(!box){box=document.createElement('div');box.className='hsn-suggest-box';box.setAttribute('role','listbox');field.appendChild(box);}
    return box;
  }
  function hide(box){if(box)box.style.display='none';}
  function render(input){
    var box=getBox(input); if(!box)return;
    var q=String(input.value||'').trim().toLowerCase();
    var codes=readCodes().filter(function(code){
      return !q || String(code).toLowerCase().indexOf(q)!==-1;
    }).sort(function(a,b){return String(a).localeCompare(String(b),undefined,{numeric:true});});
    box.replaceChildren();
    if(!codes.length){
      var empty=document.createElement('div');empty.className='hsn-suggest-empty';
      empty.textContent=q?'No saved HSN/SAC code matches. Press Enter or move out to save this code.':'No saved codes yet. Enter a code once to save it.';
      box.appendChild(empty);
    }else{
      codes.slice(0,30).forEach(function(code){
        var item=document.createElement('button');item.type='button';item.className='hsn-suggest-item';
        item.textContent=code;item.setAttribute('role','option');
        item.addEventListener('mousedown',function(e){e.preventDefault();input.value=code;saveCode(code);hide(box);input.dispatchEvent(new Event('input',{bubbles:true}));});
        box.appendChild(item);
      });
    }
    box.style.display='block';
  }
  document.addEventListener('focusin',function(e){
    var input=e.target;
    if(input && input.id==='pf-hsn'){activeInput=input;render(input);}
  });
  document.addEventListener('input',function(e){
    var input=e.target;
    if(input && input.id==='pf-hsn')render(input);
  });
  document.addEventListener('change',function(e){
    var input=e.target;
    if(input && input.id==='pf-hsn'){saveCode(input.value);render(input);}
  });
  document.addEventListener('focusout',function(e){
    var input=e.target;
    if(input && input.id==='pf-hsn'){
      saveCode(input.value);
      var box=getBox(input);
      setTimeout(function(){hide(box);},120);
    }
  });
  document.addEventListener('keydown',function(e){
    var input=e.target;
    if(input && input.id==='pf-hsn' && e.key==='Enter'){
      saveCode(input.value);hide(getBox(input));
    }
    if(input && input.id==='pf-hsn' && e.key==='Escape')hide(getBox(input));
  });
  document.addEventListener('click',function(e){
    if(activeInput && !e.target.closest('.hsn-suggest-box') && e.target!==activeInput){
      hide(getBox(activeInput));
    }
  });
})();
</script>
</body>
</html>
